---
# The recorded state of the fleet's account-scope contract: ONE ROW PER IN-SCOPE
# REPOSITORY, every number exact, compared in BOTH directions.
#
# WHAT THIS FILE IS, and it is not a list of suppressed identifiers
#
#   A repository with NO ROW is red. That is what makes a repository added to
#   `MVP-SCOPE.md`'s in-scope table a deliberate act rather than one that
#   silently widens what the gate watches.
#
#   A row whose numbers no longer match is red in EITHER direction: a repository
#   that got worse, and a repository that got better and whose row nobody
#   retired. The second half is the property a suppression list does not have,
#   and it is the reason this is a full record rather than a list of things to
#   ignore. **The rows below must shrink. They may not be widened.**
#
#   Measured against `cafaye/{identity,courier,guard,site,parlor,pantry,caf,kit,
#   core}`, with `tests/account_scope_fleet_check.py --baseline` printing the
#   numbers this file records. Every number below came out of that command; none
#   was copied out of a report.
#
#   TWO MEASUREMENT DATES, and the reason is the property above rather than
#   sloppiness. Seven rows were measured on 2026-10-03, when this record landed.
#   `pantry` and `identity` were re-measured on 2026-10-04 because core's D46
#   (`core/DECISIONS.md`, "what does a registration whose path prefix cannot be
#   evaluated produce") moved both of them — and it moved `pantry` in the
#   direction this file exists to catch: from exit 1 to exit 0, with no row
#   edited. Improvement nobody retires is the red that looks like a pass.
#
# THE RULES, and they are enforced by the runner's LOADER rather than by
# convention — a record that cannot be read is not a record that says everything
# is fine:
#
#   1. `fleet:` is one row per in-scope repository. `exempt:` is the subset that
#      has never declared a surface.
#   2. A row that tolerates a failure or a blindness carries a `condition:`. A
#      tolerance with no stated end is a switch, and the loader refuses one.
#   3. `counts:` must carry all six keys. A missing one refuses the file, so a
#      typo cannot read as "not recorded".
#   4. An `exempt:` row forgives `account-scope.declaration-missing` and NOTHING
#      ELSE. That is what the exemption was granted for.
#   5. An `exempt:` row whose repository now HAS a declaration is red: the
#      exemption existed because the repository had never declared, and the day
#      it declares the exemption is a hole through which nothing is checked.
#   6. A repository named twice, in either list, refuses the whole file.

# --------------------------------------------------------------- declaring
#
# Six of the nine declare their account-scoped surface and declare it well.
# `site` and `parlor` hold **zero** account-scoped routes and say so with core's
# own explicit `nothing-scoped` warning rather than by silence — which is the
# honest empty surface, and the reason their row tolerates nothing.
fleet:
  - repo: identity
    exit: 0
    note: >-
      17 account-scoped and 25 not, 0 undeclared. THREE WARNINGS, and none of them
      is a dropped route any more: core's D46 landed, so a registration whose
      path is an expression is NAMED rather than discarded. Two are
      `account-scope.surface-unreadable`, one per file —
      `internal/httpapi/oauth.go` lines 161 and 162, `internal/httpapi/oidc.go`
      lines 142 and 143 — and all four of them are a `const` in a concatenation
      (`socialLoginPrefix+"/{provider}"`, `oidc.PathLogin+"/{"+oidcRequestParam+"}"`).
      Between them they report 41 of the 45 registrations in `surface.sources`
      were read, which is the coverage number this row could not state before.
      The third is `social-login-callback`, still `contradiction-unreadable`, and
      it is still unreadable for the half of D46 that is not a fix: a path the
      checker cannot EVALUATE cannot be MATCHED to a declared row either. So
      `internal/httpapi/oauth.go:162` is now named as a mount and the row is still
      unverified — the same honest answer, one step further from silent. Nothing
      here is a failure and nothing is tolerated, so this row carries no
      `condition:`.
    counts: {account-scoped: 17, not-account-scoped: 25, stale: 0, undeclared: 0, failures: 0, warnings: 3}
    warnings:
      account-scope.contradiction-unreadable: 1
      account-scope.surface-unreadable: 2
      fleet.blind.unreadable-rows: 1
    failures: {}
    blind: []

  - repo: courier
    exit: 0
    note: >-
      9 account-scoped and 10 not, 0 undeclared. Three warnings, all
      `contradiction-unreadable`, and `fleet.blind.unreadable-rows` is the runner
      counting that same fact rather than restating it — so if either moves, this
      row is red.
    counts: {account-scoped: 9, not-account-scoped: 10, stale: 0, undeclared: 0, failures: 0, warnings: 3}
    warnings: {account-scope.contradiction-unreadable: 3, fleet.blind.unreadable-rows: 1}
    failures: {}
    blind: []

  - repo: guard
    exit: 0
    note: >-
      1 account-scoped (`/v1/me`, behind a prefix `app.use`) and 6 not. Six
      `contradiction-unreadable` warnings is the largest count in the fleet and
      it is recorded exactly, so a seventh is red rather than a slower slide.
    counts: {account-scoped: 1, not-account-scoped: 6, stale: 0, undeclared: 0, failures: 0, warnings: 6}
    warnings: {account-scope.contradiction-unreadable: 6, fleet.blind.unreadable-rows: 1}
    failures: {}
    blind: []

  - repo: site
    exit: 0
    note: >-
      Zero account-scoped routes, declared as zero. Its three routes are a
      Next.js catch-all, two probes and four verbs, and `nothing-scoped` is the
      honest answer rather than a silent one.
    counts: {account-scoped: 0, not-account-scoped: 6, stale: 0, undeclared: 0, failures: 0, warnings: 1}
    warnings: {account-scope.nothing-scoped: 1}
    failures: {}
    blind: []

  - repo: parlor
    exit: 0
    note: >-
      Zero account-scoped routes, declared as zero, byte-identical in shape to
      `site` because `site` is generated from it.
    counts: {account-scoped: 0, not-account-scoped: 6, stale: 0, undeclared: 0, failures: 0, warnings: 1}
    warnings: {account-scope.nothing-scoped: 1}
    failures: {}
    blind: []

  # ------------------------------------------------- declaring, and exit 0
  # while carrying ONE failure of this runner's own
  - repo: pantry
    exit: 0
    condition: >-
      ONE THING IS STILL TOLERATED, and it is this runner's own rule B2 rather
      than core's checker: `fleet.blind.surface-blind`. `account_scope.yml` sets
      `surface.minimum: 0` while naming `internal/api/api.gen.go`, which exists,
      so the declaration asserts in writing that the checker sees none of its
      surface. NINE RECORDED WARNINGS ARE NOT A TOLERANCE — the loader demands a
      `condition:` for `failures:` and `blind:` and for nothing else, and a
      warning a row is obliged to write down is the record doing its job, not a
      switch somebody left on. Drop `failures:` and `blind:` and this sentence
      becomes optional; leave either and the loader refuses the file.
      THE END THIS ROW USED TO NAME WAS WRONG, AND core HAS NOW SAID SO IN
      WRITING. It read "when core's chi recogniser reads a leading concatenation
      term", after `pantry/DECISIONS.md` D34 §3. That did not happen, and core
      declined it rather than deferring it: D46 lists "match on the literal tail"
      as its first REJECTED alternative, and its `Recommendation` states that
      resolving an identifier's value through the module index does **not** close
      `pantry`'s, "because `options.BaseURL` has no value in any tree". So the
      chi pattern still requires a string literal as the first term after `(`
      (measured: `harness/account_scope_check.py:486`), and pantry's D34 is
      still OPEN. What did land is the other half of the answer — the false
      `stale` became `registration-path-unreadable`, and `pantry` went from exit
      1 to exit 0 — so the tolerance that survives is not the one that condition
      was waiting on.
      THIS ROW ENDS when `account-scope.surface-unreadable` reports a NON-ZERO
      READ count for `internal/api/api.gen.go`. Today it says "0 of the 9
      registration(s) in `surface.sources` were read", and that zero is the whole
      of `surface.minimum: 0`. The day it moves, `minimum` is settable above zero
      on a tree that serves NINE routes, `fleet.blind.surface-blind` stops firing,
      and this row is red until it is deleted. There are two ways to it and both
      are outside this repository: `oapi-codegen` emits the paths as string
      literals, or `pantry` mounts them from a file a person wrote and names that
      file in `surface.sources`. Editing `api.gen.go` is NOT one of them — it is
      generated, and it comes back on every `go generate` (`pantry/DECISIONS.md`
      D34).
      THE SIX BECAME NINE, and that is the only number in this condition that
      moved: MD19's packet 2 added three POST operations to `pantry`, so
      `api.gen.go` mounts nine registrations instead of six, and
      `account-scope.surface-unreadable` counts them. The verdict is unchanged —
      still 0 of N read, still `fleet.blind.surface-blind`, still one failure —
      so the TOLERANCE this row exists to record did not move and is not rewritten
      to sound different from itself. What the number proves is the opposite of a
      reprieve: the write surface made the surface BIGGER and the checker read
      NONE of it, which is a worse version of the same blind spot rather than a
      smaller one.
    note: >-
      **THREE ACCOUNT-SCOPED, SIX NOT, 0 undeclared, 8 warnings, exit 0.** The six
      read rows are unchanged; the three write rows are new, and this is the
      DIRECTION MD19 flags — "a repository that got better and whose row nobody
      retired is also red". The row was re-measured, not reworded:
      `account-scope.nothing-scoped: 1` is GONE, because that warning exists to
      report a declaration with no account-scoped row in it, and
      `pantry/account_scope.yml` now has three. That warning leaving is the fleet
      learning something true.
      The numbers are not copied out of a report. Measured:
      `tests/account_scope_fleet_check.py --repos-dir <fleet> --only pantry`, with
      `pantry` resolved to the packet's worktree through a symlink so the row is
      measured against the branch and not against master. Before the update it
      reported, in as many words, `records account-scoped=0 and the run measured
      3`, `records warnings=9 and the run measured 8`, and `records warning
      account-scope.nothing-scoped x1 and this run did not report it`. Those three
      lines are the bidirectional property doing its job.
      THE THREE WRITE ROWS DECLARE `accountScoped: true` WITH AN `accountFrom`,
      and the declaration says the resolution by SYMBOL: `via: resolvePublisher`,
      pointing at `internal/httpapi/write.go`'s `publisherID := pub.ID`. Core's
      checker reads both halves — the symbol must appear in the named file, and the
      line that registers the route must go through it — so this is the first
      pantry row whose tenancy key is machine-checked rather than asserted.
      TWO THINGS MEASURED WHILE GETTING THERE, both of which cost a cycle and are
      recorded here because the next repository to declare an account-scoped row
      will hit both: `accountFrom` is a MAPPING (`via`, `file`, `line`) and a
      bare string makes core's checker raise `AttributeError: 'str' object has no
      attribute 'get'` and emit NOTHING at all; and an `accountScoped: true` row
      may NOT carry a `reason:` (`account-scope.schema`), because the closed
      vocabulary is a list of reasons a route is NOT scoped. There is no member for
      "reached by a verified principal", which is a real gap in the format and not
      something a declaration can route around — reported to the manager rather than
      worked around.
      STILL 0 READ, AND STILL TOLERATED, because nothing here fixed it: this is
      `internal/api/api.gen.go` mounting nine registrations — `Get`, `Post` — whose
      path argument is an expression, at lines 1183 to 1207, and core's chi
      recogniser requires a string literal as the first term after `(`. Six became
      nine and the read count stayed at zero. The registration anchors moved from
      852-867 to 1183-1207 for a reason worth recording: the generator emits a body
      type, a request-body alias, a body binder and a decode-error handler above
      the registration block for each operation that takes one, so three POSTs
      moved the block further than three extra lines. `pantry`'s own
      `TestEveryRegisteredAtLineStillRegistersThatRoute` is what caught it, and it
      is why `pantry`'s `bin/prime-go` now REGENERATES AND DIFFS rather than
      grepping for the generator's header — a grep for the header passed on a tree
      where the document and the generated server had silently diverged.
      The enumeration half is checked elsewhere and by nobody else:
      `pantry/internal/httpapi/scope_declaration_test.go` walks the LIVE router
      with `chi.Walk`, which the Python harness cannot do, and its
      `TestAPublisherIsResolvedOnlyFromAVerifiedAssertionOnANonPublicRoute` derives
      which routes resolve a publisher BY CONTENT rather than from a list.
    counts: {account-scoped: 3, not-account-scoped: 6, stale: 0, undeclared: 0, failures: 0, warnings: 8}
    warnings:
      account-scope.contradiction-unreadable: 6
      account-scope.registration-path-unreadable: 1
      account-scope.surface-unreadable: 1
      fleet.blind.unreadable-rows: 1
    failures: {fleet.blind.surface-blind: 1}
    blind: [surface-blind]

# ------------------------------------------------------------------ exempt
#
# Three in-scope repositories have never declared a surface, and each one is a
# separate piece of work in a repository this packet is forbidden to edit. They
# are exempt, not ratcheted, because the finding they report
# (`declaration-missing`) is the absence of the thing itself rather than a defect
# in something that exists — and rule 4 below means an exemption forgives THAT
# and nothing else, so the day any of them reports something else, this is red.
exempt:
  - repo: caf
    condition: >-
      `caf` is in the MVP — `MVP-SCOPE.md` calls it the CLI front door — and has
      never declared an account-scoped surface. It is a Go CLI: `d18-rowholder-audit.sh`
      records `MIGRATES 0, SCOPED 0`, so on the measurement in `DEBT.md` D18 it
      holds no customer rows and declares no entry points that reach any. It
      still needs one the moment it does, and this exemption is what says so
      without saying it is fine.
      THIS ENDS when `caf` grows a route that reads a customer row, or when it
      writes an `account_scope.yml` — at which point rule 5 turns this row red
      and it is deleted in the same commit that added the declaration.
    counts: {account-scoped: 0, not-account-scoped: 0, stale: 0, undeclared: 0, failures: 1, warnings: 0}
    warnings: {}
    failures: {account-scope.declaration-missing: 1}

  - repo: kit
    condition: >-
      `kit` is in the MVP — it is the generator every service is built from — and
      has never declared an account-scoped surface. It holds no HTTP surface at
      all: `d18-rowholder-audit.sh` records `MIGRATES 6, SCOPED 6` but the same
      audit's route table gives `kit` no recognisable entry points, and this
      repository ships templates and configuration, not a service. It is exempt
      for having no surface, not for being unimportant — it is the repository
      that renders nine services and the check above is in its own gate.
      THIS ENDS when `kit` grows an HTTP entry point, or when it writes an
      `account_scope.yml`.
    counts: {account-scoped: 0, not-account-scoped: 0, stale: 0, undeclared: 0, failures: 1, warnings: 0}
    warnings: {}
    failures: {account-scope.declaration-missing: 1}

  - repo: core
    condition: >-
      `core` is in the MVP — `MVP-SCOPE.md` calls it the contract all of the
      others are held to — and has never declared an account-scoped surface of
      its own. The one irony here is worth naming rather than leaving for a
      reader to find: `core` OWNS `account_scope_check.py`, runs its self-test in
      its own CI, and does not run the checker against itself. `core`'s own CI
      step reads `harness/tests/account_scope_self_test.sh`, which proves the
      CHECKER can fail; it does not prove any service's declaration is checked,
      which is the gap this packet exists to close and which only a repository
      outside `core` could close without `core` editing its own gate.
      THIS ENDS when `core` grows an HTTP entry point, or when it writes an
      `account_scope.yml`.
    counts: {account-scoped: 0, not-account-scoped: 0, stale: 0, undeclared: 0, failures: 1, warnings: 0}
    warnings: {}
    failures: {account-scope.declaration-missing: 1}
