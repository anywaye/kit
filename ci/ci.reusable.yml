---
name: ci
on:
  workflow_call:
    inputs:
      language:
        description: >-
          Toolchain to build, lint, and test. One job runs; the rest skip. Use
          'none' for a repository with no service manifest at all. One of:
          'go', 'ruby', 'elixir', 'python', 'node', 'bun', 'rust', 'none'.
          Anything else fails the `language` job rather than quietly running
          no toolchain at all.
        required: true
        type: string
      kit-lint-ref:
        description: >-
          Git ref to read kit's lint configs from, e.g. 'master' or a commit
          SHA. Pin it to the SAME ref you pinned the `uses:` line to. Changing
          it changes a service's lint policy without touching the service.
        required: false
        type: string
        default: 'master'
      lint-args:
        description: >-
          Extra arguments appended to the linter's command line, after kit's
          own flags, for a service that needs a STRICTER setting than the
          fleet's. May not change which config is read, what is linted, or
          whether a finding fails the build: the `lint-args guard` step that
          runs before every linter refuses those flags, and kit's gate fails
          if that step is ever deleted, moved after the linter, or shortened.
          A value here is a place a per-service lint policy can rot, so prefer
          a change in kit, where every service gets it free.
        required: false
        type: string
        default: ''
      working-dir:
        description: >-
          Directory holding the service manifest: go.mod, Gemfile, mix.exs,
          pyproject.toml, package.json, or Cargo.toml.
        required: false
        type: string
        default: '.'
      versions:
        description: >-
          Optional JSON toolchain pin, e.g. {"go":"1.24.1","python":"3.13"}.
          Unset keys use the toolchain default.
        required: false
        type: string
        default: '{}'
      coverage-fail-under:
        description: >-
          Minimum coverage percent, 0-100. Defaults to 0 so adoption never
          blocks a repo on day one; raise it in your caller. A gate that can
          never fail is not a gate, so do not leave this at 0.
        required: false
        type: string
        default: '0'
      ruby-coverage-command:
        description: >-
          Command the Ruby job runs for its coverage gate, e.g.
          'bundle exec rake coverage'. Empty ('') means no coverage step,
          for a repository whose coverage policy is per-file rather than a
          whole-repo percentage. Defaults to 'bundle exec rake coverage' so
          adoption never turns a green repo red and a caller that wants the
          check keeps getting it.
        required: false
        type: string
        default: 'bundle exec rake coverage'
      ruby-prepare-command:
        description: >-
          Command the Ruby job runs BEFORE its test step, to put the database
          in the state the suite expects. Empty ('') by default, so a repository
          whose suite needs no preparation is unaffected.
          MEASURED, on anywaye/box — the first Rails caller of this job: the job
          provisions a Postgres service (the service block below) and the suite
          then failed with 'Database not found: box_test', because a fresh
          Postgres has no database in it. box's own gate runs
          'bin/setup --skip-server' (bundle + 'db:prepare') before 'bin/ci', and
          this input is where a caller names that step for THIS job. A caller
          with a per-run database name — box passes a URL whose database is
          suffixed with the run id — has the database created by whatever
          command it names here.
        required: false
        type: string
        default: ''
      test-packages:
        description: >-
          Extra apt packages the Go tests EXEC rather than dial. Space-separated
          apt package names, e.g. 'redis-server', installed with
          'sudo apt-get install -y' BEFORE 'go test ./...' in the Go job.
          The tests that need them FAIL rather than skip when the binary is
          absent (gateway's 'internal/httpapi/runtime_session_test.go' execs a
          real 'redis-server' on a free port), so a shared job that runs the
          same 'go test ./...' without the binary is red on a missing apt
          package rather than on a defect. The same package is installed
          directly in the service's own 'prime' job, because 'bin/prime' runs
          its own 'go test' and never passes through kit.
          No other language job reads this input. Empty (the default) installs
          nothing, so adoption never turns a green repo red.
        required: false
        type: string
        default: ''
      required-tier:
        description: >-
          Gate variable that demands a tier, e.g. 'REQUIRED_DB'. Exported as
          '1' on the test step, and a tier that then runs zero tests fails the
          build naming this variable. Empty (the default) demands nothing.
          Adopting this also commits the repo to the normalised result format.
        required: false
        type: string
        default: ''
      telemetry:
        description: >-
          'Run the W3C traceparent conformance job as well: "true" or "false".
          Off by default so adopting kit never turns a green repo red. Turn it
          on in a repo that has copied templates/otel/<lang>/ into its tree.'
        required: false
        type: string
        default: 'false'
      zizmor:
        description: >-
          'Run the zizmor GitHub Actions security audit as well: "true" or
          "false". Off by default so a repo adopts kit without inheriting a red
          build for a finding in a workflow kit did not write. Turn it on once
          your own workflows are clean; every finding but unpinned-uses is
          fatal, and unpinned-uses is recorded, never baselined.'
        required: false
        type: string
        default: 'false'
      tenancy:
        description: >-
          'Run core's tenancy checker against this repository: "true" or
          "false". Off by default so a repo adopts kit without inheriting a red
          build for a declaration it has not written yet. Turn it on once your
          tenancy.yml is green; the checker exits 1 on any failure and 2 when it
          cannot run, and both are fatal.'
        required: false
        type: string
        default: 'false'
      kit-core-ref:
        description: >-
          Git ref to read core's tenancy checker from, e.g. 'master' or a
          commit SHA. Pin it to the core ref you have verified the checker
          against. The checker is fetched, never vendored, so a change to it
          lands on every opted-in repo on its next run.
        required: false
        type: string
        default: 'master'
permissions:
  contents: read

concurrency:
  group: kit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COVERAGE_FAIL_UNDER: ${{ inputs.coverage-fail-under }}
  GOFLAGS: '-buildvcs=false'
  # The demanded gate variable's NAME, not its value. It is exported as `1` on
  # each test step rather than set here, because an env block cannot have a key
  # that is a variable — and setting it here would export it to every step in
  # the job, including the ones that are not running the tier.
  REQUIRED_TIER: ${{ inputs.required-tier }}
  KIT_LINT_DIR: ${{ inputs.working-dir }}/.kit
  KIT_LINT_ARGS: ${{ inputs.lint-args }}


jobs:
  language:
    name: language
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: the language is one this file has a job for
        env:
          REQUESTED: ${{ inputs.language }}
        run: |
          set -euo pipefail
          case "$REQUESTED" in
            go|ruby|elixir|python|node|bun|rust|none)
              echo "language: $REQUESTED"
              ;;
            '')
              echo "::error::no language was passed. This input is required; see" >&2
              echo "::error::the workflow_call block at the top of this file." >&2
              exit 1
              ;;
            *)
              echo "::error::language '$REQUESTED' is not one this workflow has a" >&2
              echo "::error::job for. Every job below is gated on" >&2
              echo "::error::inputs.language == '<name>', so a value that matches" >&2
              echo "::error::none of them runs NO toolchain and leaves a run that" >&2
              echo "::error::looks green. One of:" >&2
              echo "::error::  go  ruby  elixir  python  node  bun  rust  none" >&2
              echo "::error::'none' is for a repository with no service manifest." >&2
              exit 1
              ;;
          esac

  none:
    name: none
    if: ${{ inputs.language == 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 5s
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: install the toolchains the lint proofs exec
        run: |
          set -euo pipefail
          host="github.com/golangci"
          go install "${host}/golangci-lint/v2/cmd/golangci-lint@v2.14.0"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          sudo gem install --no-document rubocop
          "$(go env GOPATH)/bin/golangci-lint" version
          rubocop --version
      - name: provision tenancy substrate (alpha, beta)
        env:
          KIT_POSTGRES_DATABASES: alpha,beta
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          PGHOST: localhost
          PGPORT: 5432
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get install -y postgresql-client
          fi
          bash templates/compose/postgres/initdb/10-cluster.sh
          for svc in alpha beta; do
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -tAX \
              -c "SELECT count(*) FROM pg_database WHERE datname = '$svc'" | grep -qx 1
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -tAX \
              -c "SELECT count(*) FROM pg_roles WHERE rolname = '${svc}_app' AND rolcanlogin AND NOT rolsuper" \
              | grep -qx 1
          done
          PGPASSWORD=postgres psql -h localhost -U alpha -d alpha -v ON_ERROR_STOP=1 \
            -c "SET ROLE alpha_app; SHOW ROLE;" | grep -q alpha_app
          echo "provisioned KIT_POSTGRES_DATABASES=$KIT_POSTGRES_DATABASES: one database and two roles each"
      - name: kit gate
        working-directory: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          if [ ! -f tests/validate.sh ]; then
            echo "::error::language 'none' runs this repository's own gate, and"
            echo "::error::tests/validate.sh does not exist. Either ship the gate,"
            echo "::error::or pass a real language."
            exit 1
          fi
          bash tests/validate.sh

  go:
    name: go
    if: ${{ inputs.language == 'go' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ fromJSON(inputs.versions).go || 'stable' }}
          cache-dependency-path: ${{ inputs.working-dir }}/go.sum
      - name: install
        working-directory: ${{ inputs.working-dir }}
        run: go mod download
      - name: no generate version pin without a declared shape
        working-directory: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          # A Go `//go:generate` that names a module version (`@v…`) resolves in a
          # throwaway module context whose transitive graph lives nowhere in this
          # tree, so a gate that fetches it on demand cannot run where the cache
          # is cold. Two legitimate shapes exist:
          #
          #   1. DECLARED (applications): the tool is a blank import in tools.go
          #      with `//go:build tools`, `go mod tidy` records its graph,
          #      `go mod download` fills the cache, and the `//go:generate` line
          #      runs as `go run <module>` with no `@<version>`. See gateway/tools.go.
          #
          #   2. WARMED OUT OF BAND (libraries): the service is a library — consumers
          #      import it and a `require` would pollute their graph
          #      (identity/client, TestTheGeneratorIsNotAModuleDependency). The
          #      `//go:generate` line keeps `@v`, and the gate warms the cache out of
          #      band: it reads the module@version from the generate line (never
          #      retyped), creates a throwaway module that requires it, runs
          #      `go mod download all`, and discards the temp dir. GOMODCACHE is
          #      shared so `go run <module>@<version>` hits the cache offline.
          #      See identity/bin/prime. A library takes the second because the first
          #      would ship ten thousand lines of generator into every consumer.
          #
          # A `//go:generate` may name `@v` ONLY if the gate warms the cache
          # (shape 2), and must NOT name it when the tool is a declared dependency
          # (shape 1). The check fails when neither shape is present — the defect
          # the guard exists for.
          if grep -rn --include='*.go' '^//go:generate.*@v' . >/dev/null; then
            if grep -q 'GOMODCACHE\|go mod download all' bin/prime 2>/dev/null || grep -q 'GOMODCACHE\|go mod download all' ci/ci.yml 2>/dev/null; then
            else
              echo "::error::a //go:generate line pins @v but no cache-warming step was found — a library must warm the generator's graph out of band (throwaway module, GOMODCACHE is shared) or an application must declare the tool in tools.go and run as go run <module> without @v. See identity/bin/prime and gateway/tools.go." >&2
              exit 1
            fi
          fi
      - name: build
        working-directory: ${{ inputs.working-dir }}
        run: go build ./...
      - name: kit (lint config)
        uses: actions/checkout@v7
        with:
          repository: anywaye/kit
          ref: ${{ inputs.kit-lint-ref }}
          path: ${{ env.KIT_LINT_DIR }}
          sparse-checkout: lint
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: lint-args guard
        run: |
          set -euo pipefail
          [ -n "${KIT_LINT_ARGS:-}" ] || exit 0
          for tok in $KIT_LINT_ARGS; do
            name="${tok%%=*}"
            case "$name" in
              --config|-c|--no-config|--no-config-lookup|--force-default-config|\
              --issues-exit-code|--fail-level|--quiet|\
              --no-error-on-unmatched-pattern|--auto-gen-config|--regenerate-todo|\
              --new|--new-from-rev|--new-from-patch|--new-from-merge-base)
                echo "::error::lint-args may not contain '$name'." >&2
                echo "::error::The seam is for a STRICTER setting. '$name' changes" >&2
                echo "::error::which config is read, what is linted, or whether a" >&2
                echo "::error::finding fails the build — so a green build would stop" >&2
                echo "::error::meaning what it says it means." >&2
                echo "::error::If the fleet should have it, add it to kit/lint and" >&2
                echo "::error::every service gets it free. See README.md," >&2
                echo "::error::'The deviation seam'." >&2
                exit 1
                ;;
            esac
          done
      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: ${{ inputs.working-dir }}
          args: --config=${{ github.workspace }}/${{ env.KIT_LINT_DIR }}/lint/golangci.yml ${{ env.KIT_LINT_ARGS }}
      - name: test-packages
        if: ${{ inputs.test-packages != '' }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y ${{ inputs.test-packages }}
      - name: test
        working-directory: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          if [ -n "${REQUIRED_TIER:-}" ]; then export "$REQUIRED_TIER=1"; fi
          go test -race -count=1 -coverprofile=coverage.out ./... 2>&1 \
            | tee "$RUNNER_TEMP/kit-tier.log"
          exit "${PIPESTATUS[0]}"
      - name: tier demand
        working-directory: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          [ -n "${REQUIRED_TIER:-}" ] || exit 0
          log="$RUNNER_TEMP/kit-tier.log"
          if [ ! -f "$log" ]; then
            echo "::error::$REQUIRED_TIER was set and there is no run log at $log." >&2
            echo "::error::A demanded tier with no log is a green build that" >&2
            echo "::error::verified nothing, whatever the test step printed." >&2
            exit 1
          fi
          if ! grep -qE '^ran[[:space:]]' "$log"; then
            echo "::error::$REQUIRED_TIER was set and no 'ran <tier> <suite> <test>'" >&2
            echo "::error::line reached this log. A gate variable that is set and a" >&2
            echo "::error::tier that ran zero tests is a green build that verified" >&2
            echo "::error::nothing. See templates/tier/README.md." >&2
            exit 1
          fi
      - name: coverage
        working-directory: ${{ inputs.working-dir }}
        run: |
          go tool cover -func=coverage.out |
            awk -v min="$COVERAGE_FAIL_UNDER" '
              /total:/ { gsub(/%/, "", $3); if ($3 + 0 < min + 0) { print "coverage " $3 "% < " min "%"; bad = 1 } }
              END { exit bad }
            '
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: coverage-go
          path: ${{ inputs.working-dir }}/coverage.out
          if-no-files-found: ignore

  rust:
    name: rust
    if: ${{ inputs.language == 'rust' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: install
        working-directory: ${{ inputs.working-dir }}
        run: cargo fetch
      - name: lint
        working-directory: ${{ inputs.working-dir }}
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      - name: test
        working-directory: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          if [ -n "${REQUIRED_TIER:-}" ]; then export "$REQUIRED_TIER=1"; fi
          cargo test 2>&1 | tee "$RUNNER_TEMP/kit-tier.log"
          exit "${PIPESTATUS[0]}"
      - name: tier demand
        working-directory: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          [ -n "${REQUIRED_TIER:-}" ] || exit 0
          log="$RUNNER_TEMP/kit-tier.log"
          if [ ! -f "$log" ]; then
            echo "::error::$REQUIRED_TIER was set and there is no run log at $log." >&2
            echo "::error::A demanded tier with no log is a green build that" >&2
            echo "::error::verified nothing, whatever the test step printed." >&2
            exit 1
          fi
          if ! grep -qE '^ran[[:space:]]' "$log"; then
            echo "::error::$REQUIRED_TIER was set and no 'ran <tier> <suite> <test>'" >&2
            echo "::error::line reached this log. A gate variable that is set and a" >&2
            echo "::error::tier that ran zero tests is a green build that verified" >&2
            echo "::error::nothing. See templates/tier/README.md." >&2
            exit 1
          fi
      - name: install coverage tool
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: coverage
        working-directory: ${{ inputs.working-dir }}
        run: cargo llvm-cov --fail-under-lines "$COVERAGE_FAIL_UNDER"
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: coverage-rust
          path: ${{ inputs.working-dir }}/coverage.out
          if-no-files-found: ignore

  ruby:
    name: ruby
    if: ${{ inputs.language == 'ruby' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 5s
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: ${{ inputs.working-dir }}
          bundler-cache: true
      - name: install
        working-directory: ${{ inputs.working-dir }}
        run: bundle install
      - name: kit (lint config)
        uses: actions/checkout@v7
        with:
          repository: anywaye/kit
          ref: ${{ inputs.kit-lint-ref }}
          path: ${{ env.KIT_LINT_DIR }}
          sparse-checkout: lint
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: lint-args guard
        run: |
          set -euo pipefail
          [ -n "${KIT_LINT_ARGS:-}" ] || exit 0
          for tok in $KIT_LINT_ARGS; do
            name="${tok%%=*}"
            case "$name" in
              --config|-c|--no-config|--no-config-lookup|--force-default-config|\
              --issues-exit-code|--fail-level|--quiet|\
              --no-error-on-unmatched-pattern|--auto-gen-config|--regenerate-todo|\
              --new|--new-from-rev|--new-from-patch|--new-from-merge-base)
                echo "::error::lint-args may not contain '$name'." >&2
                echo "::error::The seam is for a STRICTER setting. '$name' changes" >&2
                echo "::error::which config is read, what is linted, or whether a" >&2
                echo "::error::finding fails the build — so a green build would stop" >&2
                echo "::error::meaning what it says it means." >&2
                echo "::error::If the fleet should have it, add it to kit/lint and" >&2
                echo "::error::every service gets it free. See README.md," >&2
                echo "::error::'The deviation seam'." >&2
                exit 1
                ;;
            esac
          done
      - name: lint
        working-directory: ${{ inputs.working-dir }}
        run: bundle exec rubocop --parallel --config "$KIT_LINT_DIR/lint/rubocop.yml" ${{ env.KIT_LINT_ARGS }}
      - name: prepare
        if: ${{ inputs.ruby-prepare-command != '' }}
        working-directory: ${{ inputs.working-dir }}
        run: ${{ inputs.ruby-prepare-command }}
      - name: test
        working-directory: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          if [ -n "${REQUIRED_TIER:-}" ]; then export "$REQUIRED_TIER=1"; fi
          bundle exec rake 2>&1 | tee "$RUNNER_TEMP/kit-tier.log"
          exit "${PIPESTATUS[0]}"
      - name: tier demand
        working-directory: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          [ -n "${REQUIRED_TIER:-}" ] || exit 0
          log="$RUNNER_TEMP/kit-tier.log"
          if [ ! -f "$log" ]; then
            echo "::error::$REQUIRED_TIER was set and there is no run log at $log." >&2
            echo "::error::A demanded tier with no log is a green build that" >&2
            echo "::error::verified nothing, whatever the test step printed." >&2
            exit 1
          fi
          if ! grep -qE '^ran[[:space:]]' "$log"; then
            echo "::error::$REQUIRED_TIER was set and no 'ran <tier> <suite> <test>'" >&2
            echo "::error::line reached this log. A gate variable that is set and a" >&2
            echo "::error::tier that ran zero tests is a green build that verified" >&2
            echo "::error::nothing. See templates/tier/README.md." >&2
            exit 1
          fi
      - name: coverage
        if: ${{ inputs.ruby-coverage-command != '' }}
        working-directory: ${{ inputs.working-dir }}
        run: ${{ inputs.ruby-coverage-command }}
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: coverage-ruby
          path: ${{ inputs.working-dir }}/coverage
          if-no-files-found: ignore

  elixir:
    name: elixir
    if: ${{ inputs.language == 'elixir' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ fromJSON(inputs.versions).elixir || '1.18' }}
          otp-version: ${{ fromJSON(inputs.versions).erlang || '27' }}
      - name: install
        working-directory: ${{ inputs.working-dir }}
        run: mix deps.get
      - name: lint
        working-directory: ${{ inputs.working-dir }}
        run: mix format --check-formatted
      - name: test
        working-directory: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          if [ -n "${REQUIRED_TIER:-}" ]; then export "$REQUIRED_TIER=1"; fi
          mix test 2>&1 | tee "$RUNNER_TEMP/kit-tier.log"
          exit "${PIPESTATUS[0]}"
      - name: tier demand
        working-directory: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          [ -n "${REQUIRED_TIER:-}" ] || exit 0
          log="$RUNNER_TEMP/kit-tier.log"
          if [ ! -f "$log" ]; then
            echo "::error::$REQUIRED_TIER was set and there is no run log at $log." >&2
            echo "::error::A demanded tier with no log is a green build that" >&2
            echo "::error::verified nothing, whatever the test step printed." >&2
            exit 1
          fi
          if ! grep -qE '^ran[[:space:]]' "$log"; then
            echo "::error::$REQUIRED_TIER was set and no 'ran <tier> <suite> <test>'" >&2
            echo "::error::line reached this log. A gate variable that is set and a" >&2
            echo "::error::tier that ran zero tests is a green build that verified" >&2
            echo "::error::nothing. See templates/tier/README.md." >&2
            exit 1
          fi
      - name: coverage
        working-directory: ${{ inputs.working-dir }}
        run: mix coveralls --minimum-coverage "$COVERAGE_FAIL_UNDER"
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: coverage-elixir
          path: ${{ inputs.working-dir }}/cover
          if-no-files-found: ignore

  python:
    name: python
    if: ${{ inputs.language == 'python' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          working-directory: ${{ inputs.working-dir }}
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ fromJSON(inputs.versions).python || '3.13' }}
      - name: install
        working-directory: ${{ inputs.working-dir }}
        run: |
          if command -v uv >/dev/null 2>&1; then uv sync --frozen; else pip install -e '.[dev]'; fi
      - name: lint
        uses: astral-sh/ruff-action@v4.1.0
        with:
          src: ${{ inputs.working-dir }}
      - name: test
        working-directory: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          if [ -n "${REQUIRED_TIER:-}" ]; then export "$REQUIRED_TIER=1"; fi
          if command -v uv >/dev/null 2>&1; then
            uv run pytest --cov --cov-report=xml 2>&1 | tee "$RUNNER_TEMP/kit-tier.log"
          else
            pytest --cov --cov-report=xml 2>&1 | tee "$RUNNER_TEMP/kit-tier.log"
          fi
          exit "${PIPESTATUS[0]}"
      - name: tier demand
        working-directory: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          [ -n "${REQUIRED_TIER:-}" ] || exit 0
          log="$RUNNER_TEMP/kit-tier.log"
          if [ ! -f "$log" ]; then
            echo "::error::$REQUIRED_TIER was set and there is no run log at $log." >&2
            echo "::error::A demanded tier with no log is a green build that" >&2
            echo "::error::verified nothing, whatever the test step printed." >&2
            exit 1
          fi
          if ! grep -qE '^ran[[:space:]]' "$log"; then
            echo "::error::$REQUIRED_TIER was set and no 'ran <tier> <suite> <test>'" >&2
            echo "::error::line reached this log. A gate variable that is set and a" >&2
            echo "::error::tier that ran zero tests is a green build that verified" >&2
            echo "::error::nothing. See templates/tier/README.md." >&2
            exit 1
          fi
      - name: coverage
        working-directory: ${{ inputs.working-dir }}
        run: |
          if command -v uv >/dev/null 2>&1; then uv run coverage report --fail-under="$COVERAGE_FAIL_UNDER"; fi
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: coverage-python
          path: ${{ inputs.working-dir }}/coverage.xml
          if-no-files-found: ignore

  node:
    name: node
    if: ${{ inputs.language == 'node' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ fromJSON(inputs.versions).node || '22' }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-dir }}/package-lock.json
      - name: install
        working-directory: ${{ inputs.working-dir }}
        run: npm ci
      - name: kit (lint config)
        uses: actions/checkout@v7
        with:
          repository: anywaye/kit
          ref: ${{ inputs.kit-lint-ref }}
          path: ${{ env.KIT_LINT_DIR }}
          sparse-checkout: lint
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: lint-args guard
        run: |
          set -euo pipefail
          [ -n "${KIT_LINT_ARGS:-}" ] || exit 0
          for tok in $KIT_LINT_ARGS; do
            name="${tok%%=*}"
            case "$name" in
              --config|-c|--no-config|--no-config-lookup|--force-default-config|\
              --issues-exit-code|--fail-level|--quiet|\
              --no-error-on-unmatched-pattern|--auto-gen-config|--regenerate-todo|\
              --new|--new-from-rev|--new-from-patch|--new-from-merge-base)
                echo "::error::lint-args may not contain '$name'." >&2
                echo "::error::The seam is for a STRICTER setting. '$name' changes" >&2
                echo "::error::which config is read, what is linted, or whether a" >&2
                echo "::error::finding fails the build — so a green build would stop" >&2
                echo "::error::meaning what it says it means." >&2
                echo "::error::If the fleet should have it, add it to kit/lint and" >&2
                echo "::error::every service gets it free. See README.md," >&2
                echo "::error::'The deviation seam'." >&2
                exit 1
                ;;
            esac
          done
      - name: lint
        working-directory: ${{ inputs.working-dir }}
        run: npx --no-install eslint --config "$KIT_LINT_DIR/lint/eslint.config.mjs" . ${{ env.KIT_LINT_ARGS }}
      - name: test
        working-directory: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          if [ -n "${REQUIRED_TIER:-}" ]; then export "$REQUIRED_TIER=1"; fi
          npm test 2>&1 | tee "$RUNNER_TEMP/kit-tier.log"
          exit "${PIPESTATUS[0]}"
      - name: tier demand
        working-directory: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          [ -n "${REQUIRED_TIER:-}" ] || exit 0
          log="$RUNNER_TEMP/kit-tier.log"
          if [ ! -f "$log" ]; then
            echo "::error::$REQUIRED_TIER was set and there is no run log at $log." >&2
            echo "::error::A demanded tier with no log is a green build that" >&2
            echo "::error::verified nothing, whatever the test step printed." >&2
            exit 1
          fi
          if ! grep -qE '^ran[[:space:]]' "$log"; then
            echo "::error::$REQUIRED_TIER was set and no 'ran <tier> <suite> <test>'" >&2
            echo "::error::line reached this log. A gate variable that is set and a" >&2
            echo "::error::tier that ran zero tests is a green build that verified" >&2
            echo "::error::nothing. See templates/tier/README.md." >&2
            exit 1
          fi
      - name: coverage
        working-directory: ${{ inputs.working-dir }}
        run: npm run coverage --if-present
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: coverage-node
          path: ${{ inputs.working-dir }}/coverage
          if-no-files-found: ignore

  bun:
    name: bun
    if: ${{ inputs.language == 'bun' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ fromJSON(inputs.versions).bun || '1.3.12' }}
      - name: install
        working-directory: ${{ inputs.working-dir }}
        run: bun install --frozen-lockfile
      - name: typecheck
        working-directory: ${{ inputs.working-dir }}
        run: bun run typecheck
      - name: test
        working-directory: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          if [ -n "${REQUIRED_TIER:-}" ]; then export "$REQUIRED_TIER=1"; fi
          bun test 2>&1 | tee "$RUNNER_TEMP/kit-tier.log"
          exit "${PIPESTATUS[0]}"
      - name: tier demand
        working-directory: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          [ -n "${REQUIRED_TIER:-}" ] || exit 0
          log="$RUNNER_TEMP/kit-tier.log"
          if [ ! -f "$log" ]; then
            echo "::error::$REQUIRED_TIER was set and there is no run log at $log." >&2
            echo "::error::A demanded tier with no log is a green build that" >&2
            echo "::error::verified nothing, whatever the test step printed." >&2
            exit 1
          fi
          if ! grep -qE '^ran[[:space:]]' "$log"; then
            echo "::error::$REQUIRED_TIER was set and no 'ran <tier> <suite> <test>'" >&2
            echo "::error::line reached this log. A gate variable that is set and a" >&2
            echo "::error::tier that ran zero tests is a green build that verified" >&2
            echo "::error::nothing. See templates/tier/README.md." >&2
            exit 1
          fi
      - name: coverage
        working-directory: ${{ inputs.working-dir }}
        run: bun run --if-present coverage
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: coverage-bun
          path: ${{ inputs.working-dir }}/coverage
          if-no-files-found: ignore

  telemetry:
    name: telemetry (${{ matrix.language }})
    if: ${{ inputs.telemetry == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        language:
          - go
          - ruby
          - elixir
          - python
          - node
          - rust
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: install go
        if: ${{ matrix.language == 'go' }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ fromJSON(inputs.versions).go || 'stable' }}
      - name: install ruby
        if: ${{ matrix.language == 'ruby' }}
        uses: ruby/setup-ruby@v1
      - name: install elixir
        if: ${{ matrix.language == 'elixir' }}
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ fromJSON(inputs.versions).elixir || '1.18' }}
          otp-version: ${{ fromJSON(inputs.versions).erlang || '27' }}
      - name: install python
        if: ${{ matrix.language == 'python' }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ fromJSON(inputs.versions).python || '3.13' }}
      - name: install node
        if: ${{ matrix.language == 'node' }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ fromJSON(inputs.versions).node || '22' }}
      - name: install rust
        if: ${{ matrix.language == 'rust' }}
        uses: dtolnay/rust-toolchain@stable
      - name: kit (conformance fallback)
        env:
          KIT_REF: ${{ inputs.kit-lint-ref }}
          KIT_SPARSE: templates/otel
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          KIT_TREE_DIR="$RUNNER_TEMP/kit"
          git init --quiet "$KIT_TREE_DIR"
          git -C "$KIT_TREE_DIR" remote add origin https://github.com/anywaye/kit.git
          git -C "$KIT_TREE_DIR" sparse-checkout set --no-cone "$KIT_SPARSE"
          git -C "$KIT_TREE_DIR" fetch --depth 1 --filter=blob:none --quiet origin "$KIT_REF"
          git -C "$KIT_TREE_DIR" checkout --quiet FETCH_HEAD
          echo "KIT_TREE_DIR=$KIT_TREE_DIR" >> "$GITHUB_ENV"
      - name: conformance suite
        working-directory: ${{ inputs.working-dir }}
        env:
          KIT_TELEMETRY_DIR: ${{ inputs.working-dir }}/templates/otel/${{ matrix.language }}
        run: |
          set -euo pipefail
          dir="$KIT_TELEMETRY_DIR"
          if [ ! -d "$dir" ]; then
            echo "::notice::no $dir in this repo; running kit's own copy of the suite"
            dir="$KIT_TREE_DIR/templates/otel/${KIT_TELEMETRY_LANG:-${{ matrix.language }}}"
          fi
          case "${{ matrix.language }}" in
            go)
              GOFLAGS=-mod=mod GOPROXY=off GOTOOLCHAIN=local go test "$dir/..." ;;
            ruby)
              ruby "$dir/test_traceparent.rb" ;;
            elixir)
              elixir -r "$dir/traceparent.ex" "$dir/test_traceparent.exs" ;;
            python)
              python3 "$dir/test_traceparent.py" ;;
            node)
              node --test "$dir/traceparent.test.mjs" ;;
            rust)
              rustc --test --edition 2021 -o "$RUNNER_TEMP/kit-telemetry" "$dir/traceparent.rs"
              "$RUNNER_TEMP/kit-telemetry" ;;
          esac

  zizmor:
    name: zizmor
    if: ${{ inputs.zizmor == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: install zizmor (pinned)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check 'zizmor==1.30.1'
      - name: kit (gate scripts)
        env:
          KIT_REF: ${{ inputs.kit-lint-ref }}
          KIT_SPARSE: tests
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          KIT_TREE_DIR="$RUNNER_TEMP/kit"
          git init --quiet "$KIT_TREE_DIR"
          git -C "$KIT_TREE_DIR" remote add origin https://github.com/anywaye/kit.git
          git -C "$KIT_TREE_DIR" sparse-checkout set --no-cone "$KIT_SPARSE"
          git -C "$KIT_TREE_DIR" fetch --depth 1 --filter=blob:none --quiet origin "$KIT_REF"
          git -C "$KIT_TREE_DIR" checkout --quiet FETCH_HEAD
          echo "KIT_TREE_DIR=$KIT_TREE_DIR" >> "$GITHUB_ENV"
      - name: zizmor (unpinned-uses recorded, everything else fatal)
        env:
          PY: python3
        run: bash "$KIT_TREE_DIR/tests/zizmor_gate.sh" "$GITHUB_WORKSPACE" "$(command -v zizmor)"

  tenancy:
    name: tenancy
    if: ${{ inputs.tenancy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: core (harness)
        env:
          CORE_REF: ${{ inputs.kit-core-ref }}
          CORE_SPARSE: harness
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          CORE_TREE_DIR="$RUNNER_TEMP/core"
          git init --quiet "$CORE_TREE_DIR"
          git -C "$CORE_TREE_DIR" remote add origin https://github.com/anywaye/core.git
          git -C "$CORE_TREE_DIR" sparse-checkout set --no-cone "$CORE_SPARSE"
          git -C "$CORE_TREE_DIR" fetch --depth 1 --filter=blob:none --quiet origin "$CORE_REF"
          git -C "$CORE_TREE_DIR" checkout --quiet FETCH_HEAD
          echo "CORE_TREE_DIR=$CORE_TREE_DIR" >> "$GITHUB_ENV"
      - name: tenancy-check
        env:
          CORE_TREE_DIR: ${{ env.CORE_TREE_DIR }}
        run: |
          set -euo pipefail
          json="$RUNNER_TEMP/tenancy.json"
          status=0
          "$CORE_TREE_DIR/harness/bin/tenancy-check" --json . > "$json" || status=$?
          python3 - "$json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys

          try:
              with open(sys.argv[1], encoding="utf-8") as fh:
                  data = json.load(fh)
          except Exception as exc:
              print(f"### tenancy-check — no JSON to report ({exc})")
              sys.exit(0)

          counts = data.get("counts") or {}
          print(
              f"### tenancy-check — {counts.get('fail', 0)} failure(s), "
              f"{counts.get('warn', 0)} warning(s)"
          )
          print()
          if data.get("couldNotRun"):
              print(f"**could not run:** {data['couldNotRun']}")
              print()
          findings = data.get("findings") or []
          if findings:
              print("| severity | id | message |")
              print("| --- | --- | --- |")
              for f in findings:
                  msg = str(f.get("message", "")).replace("|", "\\|")
                  print(f"| {f.get('severity', '')} | {f.get('id', '')} | {msg} |")
          else:
              print("no findings")
          PY
          if [ "$status" -ne 0 ]; then
            echo "::error::tenancy-check exited $status — the findings are in the step" >&2
            echo "::error::summary and the tenancy-findings artifact." >&2
            exit "$status"
          fi
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: tenancy-findings
          path: ${{ runner.temp }}/tenancy.json
          if-no-files-found: warn
