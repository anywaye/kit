---
name: publish

on:
  workflow_call:
    inputs:
      push:
        description: >-
          Publish both artifacts. FALSE by default and it stays that way: a
          caller that wants a publish says so at the call site, and a workflow
          nobody opted into cannot write to the registry.
        required: false
        type: boolean
        default: false
      registry:
        description: >-
          The OCI registry charts are pushed to, including the oci:// scheme.
          The default is the PREFIX every service Argo CD Application builds
          its source.repoURL from — `helm push` appends the chart's name, so an
          Application's repoURL is this string plus "/<chart>". Images are
          always pushed to ghcr.io — the image
          workflow derives the name from github.repository and takes no
          registry input.
        required: false
        type: string
        default: 'oci://ghcr.io/anywaye/charts'
      chart-dir:
        description: >-
          The directory holding Chart.yaml, relative to the repository root.
          'chart/' is where `cafe gen chart` writes.
        required: false
        type: string
        default: 'chart/'

permissions:
  contents: read
  packages: write

concurrency:
  group: kit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    name: resolve (read the chart's appVersion)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      app-version: ${{ steps.read.outputs.app-version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: read the chart's appVersion
        id: read
        env:
          CHART_DIR: ${{ inputs.chart-dir }}
        run: |
          set -euo pipefail
          chart="$CHART_DIR/Chart.yaml"
          if [ ! -f "$chart" ]; then
            {
              echo "### no chart at \`$chart\`"
              echo
              echo "The image publishes with its sha/branch/latest tags only."
              echo "The chart job below still requires a Chart.yaml at that"
              echo "path — the same refusal it made before this job existed."
            } >>"$GITHUB_STEP_SUMMARY"
            echo "publish: no Chart.yaml at $chart — no image version tag"
            echo "app-version=" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          app="$(grep -m1 '^appVersion:' "$chart" | sed 's/^appVersion:[[:space:]]*//' | tr -d "\"'" || true)"
          if [ -z "$app" ]; then
            echo "publish: $chart has no appVersion — its values.yaml pins an image tag this workflow" >&2
            echo "could never produce: there is no appVersion to read the tag from" >&2
            exit 1
          fi
          echo "publish: chart appVersion $app — the image gets that tag so the chart's values.yaml resolves"
          echo "app-version=$app" >>"$GITHUB_OUTPUT"

  image:
    name: image
    needs: resolve
    uses: ./ci/image.reusable.yml
    with:
      push: ${{ inputs.push }}
      app-version: ${{ needs.resolve.outputs.app-version }}
  chart:
    name: chart
    needs: [resolve, image]
    uses: ./ci/chart.reusable.yml
    with:
      push: ${{ inputs.push }}
      registry: ${{ inputs.registry }}
      chart-dir: ${{ inputs.chart-dir }}
      image-digest: ${{ needs.image.outputs.digest }}
