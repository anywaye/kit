---
name: image

on:
  workflow_call:
    inputs:
      push:
        description: >-
          Publish the image to ghcr.io. FALSE by default and it stays that way:
          a caller that wants an image published says so at the call site, and
          a workflow nobody opted into cannot write to the registry.
        required: false
        type: boolean
        default: false
      app-version:
        description: >-
          One EXTRA tag on the published image, and the reason it exists is
          a seam this workflow cannot see from inside: every service chart's
          values.yaml pins `image.tag` to the chart's own appVersion, so a
          box that pulls the published chart asks the registry for
          `ghcr.io/<org>/<repo>:<appVersion>` — a tag nothing publishes,
          and the symptom is `ImagePullBackOff` with nothing pointing at
          the publish path. The value is DERIVED, never typed at a call
          site: publish.reusable.yml reads it from `<chart-dir>/Chart.yaml`
          and passes it in, so the tag a chart pins and the tag a publish
          produces are one fact read from one file. The three tags below
          are unchanged; this adds a fourth. EMPTY by default, and it stays
          that way: a service with an image and no chart — or any direct
          caller of this workflow — gets the original tag set exactly as
          before, and nothing here depends on a chart existing.
        required: false
        type: string
        default: ''
      context:
        description: >-
          Build context, relative to the repository root. '.' unless a service
          keeps its Dockerfile in a subdirectory with its own context.
        required: false
        type: string
        default: '.'
      dockerfile:
        description: >-
          Path to the Dockerfile, relative to the repository root. Read by
          docker/build-push-action; the default is the conventional one.
        required: false
        type: string
        default: './Dockerfile'
      platforms:
        description: >-
          Comma-separated platforms for the manifest list. The default builds
          BOTH amd64 and arm64, which is not a guess about this fleet's boxes:
          every `config/deploy.yml` says `builder.arch: arm64` while GitHub's
          runners are amd64, so an arm64-only build is only reachable through
          QEMU emulation and an amd64-only build cannot run on the box that
          deploy.yml names. Both is the one answer that is right either way.
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'
      cache-from:
        description: >-
          BuildKit cache source. 'type=gha' by default, which is the Actions
          cache service and needs no registry credential.
        required: false
        type: string
        default: 'type=gha'
      cache-to:
        description: >-
          BuildKit cache destination. 'type=gha' by default, for the same
          reason. Note this is the ACTIONS cache, not the `registry` cache mode
          in `config/deploy.yml`'s builder block — two different caches for two
          different builders, and conflating them is a question this comment
          exists to pre-empt.
        required: false
        type: string
        default: 'type=gha'
      kit-version:
        description: >-
          The version of kit's TEMPLATES that shaped this image, stamped as
          `com.anywaye.kit.template.version`. It is the one field that says
          which build STANDARD produced the bytes rather than which source they
          came from, and it is an input rather than a constant because kit is
          not an org-wide lockfile: a service pins the template version it
          adopted, and a wrong value here is refused by the grammar rather than
          published. Empty means `unknown`, which is honest and is asserted
          against rather than accepted by a consumer.
        required: false
        type: string
        default: ''
    outputs:
      digest:
        description: >-
          The manifest list's sha256 digest, which is the only immutable name a
          deploy can pin. Empty when `push` is false, because nothing was
          written to read a digest from.
        value: ${{ jobs.build.outputs.digest }}
      image:
        description: >-
          The full image reference that was (or would have been) pushed, e.g.
          ghcr.io/anywaye/site. A follow-on job that needs the image — a
          smoke test, a deploy — should take this output rather than
          reconstructing the string.
        value: ${{ jobs.build.outputs.image }}

permissions:
  contents: read

jobs:
  build:
    name: build (and publish, if asked)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: resolve image
        id: resolve
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          image="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "image=$image" >>"$GITHUB_OUTPUT"
          echo "pushing to $image" >>"$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: log in to ghcr.io with this workflow's own token
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.resolve.outputs.image }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: add the chart's appVersion as a tag
        id: apptag
        env:
          IMAGE: ${{ steps.resolve.outputs.image }}
          APP_VERSION: ${{ inputs.app-version }}
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          tags="$META_TAGS"
          if [ -n "$APP_VERSION" ]; then
            tags="$(printf '%s\n' "$tags" | awk -v want="$IMAGE:$APP_VERSION" '$0 != want')"
            tags="$(printf '%s\n%s' "$tags" "$IMAGE:$APP_VERSION")"
          fi
          {
            echo 'tags<<TAGS_EOF'
            printf '%s\n' "$tags"
            echo 'TAGS_EOF'
          } >>"$GITHUB_OUTPUT"

      - name: kit (the provenance stamper)
        env:
          KIT_REF: ${{ job.workflow_sha }}
          KIT_SPARSE: docker
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          kit_dir="$RUNNER_TEMP/kit-provenance"
          git init --quiet "$kit_dir"
          git -C "$kit_dir" remote add origin "https://github.com/anywaye/kit.git"
          git -C "$kit_dir" sparse-checkout set --no-cone "$KIT_SPARSE"
          git -C "$kit_dir" fetch --depth 1 --filter=blob:none --quiet origin "$KIT_REF"
          git -C "$kit_dir" checkout --quiet FETCH_HEAD
          script="$kit_dir/docker/provenance.sh"
          if [ ! -f "$script" ]; then
            echo "image: kit's provenance stamper is not at $script" >&2
            echo "image: fetched anywaye/kit@$KIT_REF (sparse '$KIT_SPARSE') with no docker/provenance.sh" >&2
            echo "image: the stamp cannot run without it; an unstamped image is worse than a refusal" >&2
            exit 1
          fi
          echo "KIT_PROVENANCE_SCRIPT=$script" >>"$GITHUB_ENV"

      - name: stamp provenance
        id: provenance
        env:
          KIT_PROVENANCE_SOURCE: ${{ github.repository }}
          KIT_PROVENANCE_REVISION: ${{ github.sha }}
          KIT_PROVENANCE_TEMPLATE_VERSION: ${{ inputs.kit-version }}
        run: |
          set -euo pipefail
          KIT_PROVENANCE_BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export KIT_PROVENANCE_BUILT_AT
          KIT_PROVENANCE_SOURCE_DIRTY=clean sh "$KIT_PROVENANCE_SCRIPT" --validate
          {
            echo "source=$KIT_PROVENANCE_SOURCE"
            echo "revision=$KIT_PROVENANCE_REVISION"
            echo "built_at=$KIT_PROVENANCE_BUILT_AT"
            echo "template_version=$KIT_PROVENANCE_TEMPLATE_VERSION"
          } >>"$GITHUB_OUTPUT"

      - name: build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push && github.event_name != 'pull_request' }}
          tags: ${{ steps.apptag.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            KIT_PROVENANCE_SOURCE=${{ steps.provenance.outputs.source }}
            KIT_PROVENANCE_REVISION=${{ steps.provenance.outputs.revision }}
            KIT_PROVENANCE_BUILT_AT=${{ steps.provenance.outputs.built_at }}
            KIT_PROVENANCE_SOURCE_DIRTY=clean
            KIT_PROVENANCE_TEMPLATE_VERSION=${{ steps.provenance.outputs.template_version }}
          cache-from: ${{ inputs.cache-from }}
          cache-to: ${{ inputs.cache-to }}
          provenance: mode=max
          sbom: true

      - name: say what landed
        if: inputs.push && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          {
            echo '### image published'
            echo
            echo "image: \`$IMAGE\`"
            echo
            echo "digest: \`$DIGEST\`"
          } >>"$GITHUB_STEP_SUMMARY"
          echo "published $IMAGE at $DIGEST"
        env:
          IMAGE: ${{ steps.resolve.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
