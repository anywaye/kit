---

apiVersion: 1

groups:

  - orgId: 1
    name: anywaye-boundary
    folder: anywaye
    interval: 1m
    rules:
      - uid: anywaye-no-content-attributes
        title: "A content-shaped attribute reached Loki"
        condition: C
        for: 0m
        annotations:
          summary: "A log record carries a content-shaped attribute on {{ $labels.service_name }}"
          description: >-
            The collector's redaction processor strips every attribute not on
            core's log allowlist, so a record here carrying one means the
            boundary was bypassed — a service exporting straight to Loki, or an
            allowlist that grew a name core's redaction schema forbids. Same
            reasoning as a canary test that can only fail: a boundary nobody
            watches is a boundary that has already been removed.
        labels:
          severity: critical
          anywaye_layer: boundary
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              refId: A
              expr: '{service_name=~".+"} |~ "(?i)prompt|completion|transcript|system_prompt"'
              queryType: range
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: count
                  type: query
