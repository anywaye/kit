---
# kit template — Loki CONFIGURATION for the local anywaye stack.
#
#   tempo.yaml / loki-config.yaml are CONFIGURATION, which AGPL-3.0
#   expressly permits. They are mounted read-only over stock `grafana/*` images.
#   Nothing here patches, forks or rebrands a vendor binary; the gate fails if
#   any of these four services grows a `build:` stanza.
#
# WHAT THIS IS
#   Loki is the LOG store, and it owns two of PLAN.md §7b's three error layers:
#   an SDK's own log records, and the crash layer that arrives over syslog from
#   every container's stderr with no per-language SDK at all.
#
# THE ONE THING TO KNOW ABOUT LOKI'S RETENTION MODEL
#   Loki does not expire data by age at query time. It deletes chunks from
#   object storage on a schedule driven by a compactor, and that schedule only
#   runs if `compactor.compaction_interval` is set AND the compactor is
#   reachable. A dev config that sets `retention_period` without a compactor
#   deletes nothing, which is the shape of a laptop that fills its disk after a
#   long weekend.
#
#   So: retention is 24h, the compactor runs, and the retention_enforced flag is
#   on. Which is to say the disk usage is bounded by a day of logs, not by how
#   many times you ran the test suite.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn
  grpc_server_max_recv_msg_size: 8388608

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 24h
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  max_query_series: 1000
  max_query_lookback: 168h
  max_line_size: 256kb
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  allow_structured_metadata: true
  volume_enabled: true

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

ruler:
  enable_api: false
  rule_path: /loki/rules-temp

analytics:
  reporting_enabled: false
