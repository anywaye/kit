---
# kit template — the local infrastructure every cafaye service joins.
#
#   IT IS NOT COPIED. `bin/dev` fetches this file, and the rest of this
#   directory, from a PINNED kit ref, and runs it beside the service's own
#   `docker-compose.yml`:
#
#     docker compose -f <kit>/templates/compose/docker-compose.yml \
#                    -f ./docker-compose.yml up -d --wait
#
#   The second file is an OVERRIDE, not a fork. What the service owns — its own
#   image, its own port, its own database name — is the only thing in it. See
#   "WHAT A SERVICE MAY OVERRIDE" below, and the gate in kit's tests/validate.sh
#   that holds both halves of it.
#
# WHAT THIS IS
#   Postgres, NATS with JetStream, Redis, the OpenTelemetry collector, and the
#   three services that make a developer's traces, logs and errors visible
#   without installing anything. One stack, one set of credentials, one command.
#   A service joins it by adding a `depends_on` and copying its connection URLs
#   into .env.
#
#   THE THREE BACKENDS ARE OFF BY DEFAULT. `bin/dev` starts postgres, nats,
#   redis and the collector; the observability profile — tempo, loki, grafana —
#   is `KIT_DEV_PROFILES=observability bin/dev up`.
#
#   That is a reversal, and the numbers are why. As defaults they cost every
#   developer's first run: grafana downloading a plugin zip on first boot
#   (20s once, over 180s another time), 130s of the metrics store's readiness
#   budget before it was removed, 65s of
#   Tempo's, 16s of Loki's — against a 180s deadline for the whole stack. A
#   default that taxes everyone's startup to serve a view they did not open is
#   a default that gets switched off fleet-wide, and the telemetry goes with it.
#   The escape hatch existed the whole time and was the documented good path.
#   So the hatch is now the default and observability is the deliberate spelling.
#
#   WHAT DOES NOT CHANGE. `<SERVICE>_OTEL_ENDPOINT` is still the only contract,
#   its default is still this collector, and the collector is still NOT behind
#   the profile: on the cheap path telemetry still arrives, is still run through
#   the redaction allowlist — which drops high-cardinality dimensions at INGEST,
#   before anything would be stored — and is then dropped because there is no
#   store to hand it to. Losing a span is better than becoming a slow service,
#   and cheaper than paying 130 seconds for the privilege of keeping it.
#
#   It is still not MANDATORY, in either direction. `<SERVICE>_OTEL_ENDPOINT` is
#   the only contract and the collector below is just that variable's default
#   value, so a self-hoster already running Datadog, Honeycomb or Grafana Cloud
#   sets the variable in their service and this stack goes quiet. Bring-your-own
#   is a supported deployment, not a degraded mode.
#
# WHAT THIS IS NOT
#   It is not production. Volumes are named, not replicated; passwords are the
#   development defaults in .env.example; nothing is exposed outside the host
#   loopback. It exists so `bin/dev` is one command and CI is one image.
#
# STRICTNESS NOTES — READ BEFORE EDITING
#   - EVERY published port is a ${KIT_*:default} substitution. A literal port in
#     this file is a collision the second developer on the machine hits, and the
#     gate fails on one. Change the port in .env, not here.
#   - EVERY image is pinned to an exact tag. Never `latest`: a stack that
#     changes under you between two runs of the same command is not a dev
#     environment, it is a coin flip. Bump the pin in .env.example when you
#     bump the tag.
#   - EVERY service has a healthcheck. `docker compose up --wait` can only mean
#     something if there is a health signal to wait for, and the gate fails on
#     a service without one.
#   - The collector publishes NO host port on purpose. Services reach it over
#     the compose network by service name; a host port would expose an OTLP
#     receiver to anything else on the machine.
#   - Service names here are infrastructure names, not cafaye service names.
#     Hostnames are the adopting repo's business — a template that picks them is
#     a template six repos disagree with.
#   - Credentials live in .env (git-ignored), never in this file. .env.example
#     documents every placeholder with a default, so a fresh clone runs without
#     a hand-written .env.
#   - NOTHING BUT THE COLLECTOR MAY BE IN A READINESS PATH. A service that
#     waits for the collector serves no traffic while the collector is down,
#     which is strictly worse than serving traffic with no traces. So no
#     `depends_on: [otel-collector]` anywhere below, and no healthcheck
#     probes an OTLP port. The gate fails on both. The live half of the proof
#     is tests/no_telemetry_in_readiness.sh, which kills the collector and
#     shows a service still serving.
#
# WHAT A SERVICE MAY OVERRIDE, AND WHAT IT MAY NOT
#   Two files, merged by `docker compose -f kit -f yours`. The merge is per-key
#   and it is NOT symmetric, so the rules below are measured against
#   `docker compose config`, not assumed. Each was run; the surprises are called
#   out because the unsurprising ones are the ones that bite.
#
#   MAY — set `image:` on a service (wholesale, and a different tag is a
#         different postgres major, which is a real thing a service needs).
#   MAY — add keys to YOUR OWN service's `environment:` (a connection string for
#         the database the init script gave you is the case that matters). What
#         is NOT yours is the `postgres` service's own `environment:` below —
#         see the fourth MAY NOT.
#   MAY — add a `depends_on` with `condition: service_healthy`, and declare a
#         new service of your own.
#   MAY — change a published port, BUT ONLY BY CHANGING THE VARIABLE in `.env`.
#         This is the sharp one. A `ports:` list in the second file APPENDS to
#         the first rather than replacing it, so a service that writes
#         `ports: ["15433:5432"]` gets postgres listening on 15500 *and* 15433.
#         Measured, not assumed. `KIT_POSTGRES_PORT=15433` in `.env` is the only
#         way to move it, and the gate fails on a `ports:` entry in a service
#         file for that reason.
#   MAY NOT — touch `otel-collector`. Not its `image:`, not its `command:`, and
#         above all not the `volumes:` entry that mounts `otel-collector.yml`.
#         That file carries the redaction allowlist, which is DERIVED from core's
#         schemas; a service that overrides the mount is shipping a telemetry
#         boundary nobody derived, and prompt content leaves the process inside
#         it. The gate fails on any of the three.
#   MAY NOT — override the three AGPL backends. `grafana/*` images unmodified is
#         the licence condition, and a `build:` or a retag is a fork.
#   MAY NOT — set POSTGRES_USER, POSTGRES_DB or POSTGRES_PASSWORD on this
#         service. THIS USED TO BE THE RECOMMENDED FIX and it is the single most
#         expensive piece of wrong advice this file has published, so the reason
#         is written out rather than left to be rediscovered:
#
#           POSTGRES_USER    the official image creates it, and it creates it as
#                            a SUPERUSER. Measured on this cluster's own init
#                            script: a service that overrides it holds
#                            `rolsuper = t` where every provisioned role holds
#                            `f`, and reads another service's table while a
#                            provisioned role is refused at the door. It undoes
#                            `LOGIN NOSUPERUSER ...` in initdb/10-cluster.sh:108.
#           POSTGRES_DB      the image creates that database too, before any init
#                            script runs.
#           Either of those  CREATE ROLE / CREATE DATABASE then fails, the init
#                            script runs during initdb with ON_ERROR_STOP=1, and
#                            THE WHOLE CLUSTER REFUSES TO START. Measured, exit
#                            status 3, `ERROR:  role "identity" already exists`.
#           POSTGRES_PASSWORD
#                            does not do either of those and is still refused: it
#                            is the password handed to EVERY role below, so one
#                            service's file would decide it for all of them.
#
#         The way to get a database is the variable three lines below:
#         `KIT_POSTGRES_DATABASES`, in `.env`. That is how a service gets a role,
#         a database it owns, and the boundary, and it costs no compose file at
#         all. A service that sets any of the three has broken the cluster it
#         shares, and `templates/database/README.md`'s "Adopting this" is the
#         procedure that keeps it out.
#   MAY NOT — set `allow_all_keys`, or add an exporter, by any route. Same
#         reason, and it is the same check that already fails on kit's own file.
#
# WHAT STAYS IN THE SERVICE
#   A service's own `docker-compose.yml` after this change is its own image, its
#   own port, its own environment, its own volume, and its own service entry.
#   Measured on `muse`, the largest adopter: 86 lines to 27, and the 59 that
#   went are postgres, a healthcheck and a volume that kit already ships.
#
# THE PORT BLOCK: 15000-15999
#   kit claims this range for the whole stack, one hundred per service, and
#   every published port is a ${KIT_*:default} inside it. The defaults are NOT
#   5432, 4222 or 6379, and that is the whole point.
#
#   Those three are the two or three most likely things already listening on a
#   developer's machine — a Homebrew postgres, a redis from another project, a
#   database GUI. `bin/dev` is the first command a new person runs on a repo
#   they just cloned, and it is the worst possible moment to discover that
#   someone else owns 5432. Failing at `up` with "port is already allocated" is
#   a bad first five minutes; a stack that comes up on a port nothing else
#   wants is not.
#
#   A high range also makes two checkouts on one laptop a non-event, which
#   matters because a developer working across two services has exactly that.
#   Ports here are published on all interfaces, so the range must not collide
#   with another developer on a shared network; 15000+ is well clear of the
#   IANA dynamic range and of anything a macOS or Linux service binds by
#   default. The gate asserts membership of the block and no reuse, as a
#   RANGE rather than a list of approved ports — a list has to be edited every
#   time a service is added, and a check that must be edited is one that gets
#   skipped.

name: ${KIT_STACK_NAME:-cafaye}

networks:
  platform:
    # `internal: true` would cut the stack off from the internet, which a
    # container build or an apt install inside one would need. Not set: the
    # stack is on the developer's machine, and every collector endpoint is a
    # ${env:} substitution that resolves inside this network.

volumes:
  postgres-data:
  nats-data:
  redis-data:
  # The observability stores. Named volumes like the rest, so `bin/dev nuke`
  # removes them and `bin/dev down` keeps them, with no special-casing.
  tempo-data:
  loki-data:
  grafana-data:

services:
  # ------------------------------------------------------------------ postgres
  #
  # ONE CLUSTER. ONE DATABASE PER SERVICE. ONE ROLE PER SERVICE.
  #
  # This is the whole of kit's data topology, and it is worth being explicit
  # about what it is not: it is not one Postgres per service. There is ONE
  # container here, shared by every service in the fleet, and the DATABASE is
  # the isolation boundary rather than the machine. Two services cannot read
  # each other's rows because `REVOKE ALL ON DATABASE ... FROM PUBLIC` in the
  # init script below refuses role `courier` at the door of database `billing`
  # before a query is parsed — not because they are on different hosts.
  #
  # WHY THE IMAGE IS BUILT AND NOT PULLED. `postgres:17-alpine` cannot carry
  # pgvector: pglayers publishes glibc-linked layers, and the alpine base is
  # musl, so the extension fails to load at run time on an image that builds
  # cleanly. Measured, with the output, in
  # templates/compose/postgres/Dockerfile. The base is therefore `postgres:17`
  # (Debian), which is the official image with exactly one extension layer on it.
  postgres:
    build:
      # `POSTGRES_TAG` and `PGVECTOR_TAG` are ARGs, so a service raises them in
      # its own compose override rather than kit shipping one version for nine
      # services. Nothing is `:latest` and nothing floats.
      #
      # `${KIT_COMPOSE_DIR:-.}`, NOT `./`. This line and the initdb mount below
      # were the only two bare-relative paths in this file, and the only two
      # that were wrong, for the reason the other five services already carry:
      # `bin/dev` runs compose with `--project-directory .` (the SERVICE root),
      # and Docker Compose resolves a relative build context and bind source
      # against the PROJECT DIRECTORY, not against the directory holding the
      # compose file. `./postgres` therefore meant `<service>/postgres`.
      # Measured, on identity, before this was fixed: the image still built -
      # Docker creates a missing bind source as an empty DIRECTORY rather than
      # failing - so the cluster came up, reported itself HEALTHY, and had run
      # NO init script at all. No role, no database, no `REVOKE CONNECT`. The
      # whole provisioning contract, absent behind a green health check.
      context: ${KIT_COMPOSE_DIR:-.}/postgres
      dockerfile: Dockerfile
      args:
        POSTGRES_TAG: ${KIT_POSTGRES_TAG:-17}
        PGVECTOR_TAG: ${KIT_PGVECTOR_TAG:-17-0.8.6}
    # `image:` names the BUILT artefact so `docker compose` can reuse it across
    # the several checkouts a developer runs on one laptop. Without it every
    # checkout builds its own copy of an identical image.
    image: kit-postgres:${KIT_POSTGRES_TAG:-17}
    environment:
      POSTGRES_USER: ${KIT_POSTGRES_USER:-cafaye}
      POSTGRES_PASSWORD: ${KIT_POSTGRES_PASSWORD:-cafaye}
      # The cluster's OWN database. It is not a service's: it holds cluster
      # administration state and nothing a service reads. A service that wants
      # a database names itself in KIT_POSTGRES_DATABASES below.
      POSTGRES_DB: ${KIT_POSTGRES_DB:-cafaye_platform}
      # THE DECLARATION. Comma-separated; each name becomes BOTH a role and a
      # database owned by that role. This is the input the init script reads,
      # and it is the single place a service's database and role come from.
      #
      # A service adds ITS OWN name here and nothing else. It does not get a
      # container, a port, or a volume — the point of one cluster is that the
      # nine services share all three.
      #
      # NO `:-` FALLBACK, AND THAT IS THE POINT. This was
      # `${KIT_POSTGRES_DATABASES:-courier}`, and `courier` is one service in this
      # fleet, not a property of Postgres. A shared-infrastructure template that
      # hardcodes a specific tenant's name as its default does two wrong things
      # at once: every service that adopts kit without overriding this silently
      # provisions COURIER'S database, and the value is then copied into every
      # service's `.env` by `bin/dev`, which outranks the service's own committed
      # declaration. Measured on identity: it asked for `identity` by name, the
      # cluster provisioned `courier`, and identity had no database.
      #
      # The obvious repair — an EMPTY default — is also wrong, and the init
      # script says so. Measured, by bringing this template up with the list
      # empty: `10-cluster.sh:48` refuses it and the container exits 1 with
      #   KIT_POSTGRES_DATABASES: KIT_POSTGRES_DATABASES is unset. Name the
      #   services, comma-separated.
      # which is the CORRECT outcome, because the alternative is a service whose
      # migrations run against a database nobody created. The list is required,
      # so compose passes it through with no default and the script's own
      # message - which names the fix - is what a service that forgot to declare
      # itself sees.
      #
      # Between the two bad defaults, this is the one that fails loudly and names
      # the thing to change, instead of failing silently and pointing at a
      # database belonging to somebody else.
      KIT_POSTGRES_DATABASES: ${KIT_POSTGRES_DATABASES}
      # Extensions, created by the admin role into EVERY database above. They
      # are a CLUSTER decision rather than a per-service one because the
      # extension's binaries are in the image, so they are available to every
      # service on the cluster whether or not anybody creates one. The list
      # decides who pays the disk cost, and that is an operator's call.
      KIT_POSTGRES_EXTENSIONS: ${KIT_POSTGRES_EXTENSIONS:-vector}
      # BLAST RADIUS, PER ROLE. These are the settings that only matter once
      # the cluster is shared, and they are what replaces the isolation a pooler
      # would have provided:
      #
      #   CONNECT LIMIT   one service cannot consume the cluster's connections.
      #   statement_timeout      one service's runaway query cannot occupy
      #                          shared resources until the cluster is unusable.
      #   idle_in_transaction    one service's forgotten BEGIN cannot hold a
      #                          snapshot open and block VACUUM for the other
      #                          eight. On one database per machine this is one
      #                          service's problem; on one cluster it is nine.
      KIT_POSTGRES_ROLE_CONNECTIONS: ${KIT_POSTGRES_ROLE_CONNECTIONS:-10}
      KIT_POSTGRES_STATEMENT_TIMEOUT_MS: ${KIT_POSTGRES_STATEMENT_TIMEOUT_MS:-15000}
      KIT_POSTGRES_IDLE_IN_TRANSACTION_TIMEOUT_MS: ${KIT_POSTGRES_IDLE_IN_TRANSACTION_TIMEOUT_MS:-30000}
    # THERE IS NO POOLER, AND THAT IS A DECISION.
    #
    # `max_connections` is raised from Postgres's 100 and `superuser_reserved_
    # connections` is left alone, because the answer to "one cluster for nine
    # services" is a connection budget with a per-service cap rather than a
    # pooler. The reasoning, the PgBouncer measurements behind it, and the
    # driver-level flags this decision makes unnecessary are in
    # templates/database/README.md; the short version is that PgBouncer's own
    # documentation says the remedy for its worst failure mode is `RECONNECT`
    # on its admin console after a DDL migration, and that is a manual step
    # after every schema change in nine repositories.
    #
    # N is a FLOOR for the cluster, and `KIT_POSTGRES_MAX_CONNECTIONS` is
    # checked against it: with nine services at the per-role limit above, 100 is
    # not enough and raising it is the decision, not an accident.
    command:
      - "postgres"
      - "-c"
      - "max_connections=${KIT_POSTGRES_MAX_CONNECTIONS:-200}"
    ports:
      # Host side is parameterized AND in kit's block; the container side is
      # not, because the image is what fixes it. Only the host side is ever a
      # collision. See the port block note at the top of this file.
      - "${KIT_POSTGRES_PORT:-15500}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # THE INIT SCRIPT. `docker-entrypoint-initdb.d` runs once, on a FRESH
      # volume, which is why the provisions below appear to vanish after a
      # `bin/dev nuke` and reappear after a `bin/dev down`: adding a service to
      # KIT_POSTGRES_DATABASES does not provision its database until the volume
      # is recreated. `bin/dev`'s `db grant` prints the statements for a new
      # database rather than telling anybody to nuke their data.
      #
      # `${KIT_COMPOSE_DIR:-.}`, NOT `./`, and this one line is the whole
      # difference between a cluster with per-service roles and databases in it
      # and a cluster that has none. Read the failure rather than assuming it:
      # with `./`, `bin/dev`'s `--project-directory .` (the service root) made
      # this resolve to `<service>/postgres/initdb`, Docker created that as an
      # EMPTY directory because a missing bind source is not an error, and the
      # entrypoint logged one unread line and moved on. Measured on identity,
      # unfixed: `/docker-entrypoint-initdb.d` empty inside a healthy container,
      # `pg_roles` holding only the superuser, `pg_database` holding only
      # `cafaye_platform`, and `docker compose up --wait` exiting 0. The
      # service asked for a database by name and the cluster agreed, and no
      # role, no database and no boundary was ever created.
      - ${KIT_COMPOSE_DIR:-.}/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # A REAL QUERY, against the database this container actually has.
      #
      # This line was wrong for a long time and the comment above it said so out
      # loud: "`pg_isready` alone returns true before the init scripts finish …
      # The -U/-d pair makes it check the real thing." Measured, inside the
      # container, against a database and a role that DO NOT EXIST:
      #
      #   $ pg_isready -U identity -d nosuchdb -q ; echo $?
      #   0
      #   $ psql -U identity -d nosuchdb -tAc 'select 1' >/dev/null ; echo $?
      #   2
      #
      # `pg_isready` reports whether the server is ACCEPTING CONNECTIONS. Its
      # `-U` and `-d` do not authenticate and do not select — they are
      # diagnostics, and the readiness answer is 0 either way. So the `-U/-d`
      # pair bought nothing, and the claim that this probe "makes it check the
      # real thing" was decoration: the stack reported postgres ready on a
      # container whose named database did not exist, which is the exact
      # "migrations failed against a database that was not ready" flake the
      # comment says it exists to prevent.
      #
      # `psql … -tAc 'select 1'` is what actually connects, authenticates as the
      # role, and opens the named database. Against a database that does not
      # exist it exits 2; against the real one it exits 0. That is the difference
      # between a probe and a decoration.
      #
      # `$$`, because compose interpolates `$VAR` in this file before YAML is
      # parsed, so quoting does not protect it — `$POSTGRES_USER` rendered as
      # `-U ""`. `$$` renders one literal `$` and the container's shell expands
      # it against the MERGED environment, which is what makes the probe follow a
      # service that renamed its own database instead of checking kit's default
      # inside someone else's container.
      test:
        - CMD-SHELL
        - pg_isready -q -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" &&
          psql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc 'select 1' >/dev/null
      interval: 5s
      timeout: 3s
      # retries * interval is the readiness budget: 30s to accept connections,
      # 10s to become visibly unhealthy. Long enough for a first-time initdb on a
      # cold volume, short enough that a hung postgres fails the stack quickly.
      retries: 6
      start_period: 10s
    networks: [platform]

  # ----------------------------------------------------------------- nats + js
  nats:
    # JetStream is the `-js` flag. Without it a service that publishes and then
    # crashes loses the message, and courier's at-least-once guarantee quietly
    # becomes at-most-once.
    image: nats:${KIT_NATS_TAG:-2.10.24-alpine}
    command:
      - "-js"
      - "-sd"
      - "/data"
      - "-m"
      - "8222"
    ports:
      - "${KIT_NATS_CLIENT_PORT:-15600}:4222"
      - "${KIT_NATS_MONITOR_PORT:-15700}:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      # The monitoring port answers 200 only once the server is up, which is a
      # stronger signal than a TCP connect to the client port.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    networks: [platform]

  # --------------------------------------------------------------------- redis
  redis:
    image: redis:${KIT_REDIS_TAG:-7.4.1-alpine}
    # Appendonly on: a cache that loses its writes on restart is fine, but the
    # rate limiter and the idempotency keys in billing are not, and one flag here
    # is cheaper than debugging a duplicate charge.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${KIT_REDIS_PORT:-15800}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    networks: [platform]

  # -------------------------------------------------------- otel collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:${KIT_OTEL_COLLECTOR_TAG:-0.115.1}
    # No `ports:` on purpose. OTLP receivers accept spans from anything that can
    # reach them; keeping this one off the host loopback is the whole privacy
    # posture of the local stack. Services use
    # http://otel-collector:${KIT_OTEL_HTTP_PORT:-4318} instead.
    command: ["--config=/etc/otel/otel-collector.yml"]
    # REQUIRED, and easy to miss. otel-collector.yml interpolates its values from
    # the collector's OWN process environment, not from the compose file's.
    # Docker Compose reads .env to expand the placeholders in the compose file
    # itself; it does not inject those into containers. Without this block every
    # placeholder in the collector config resolves to an empty string and the
    # collector exits with:
    #
    #   invalid configuration: processors::memory_limiter: 'limit_mib' or
    #   'limit_percentage' must be greater than zero
    #
    # which names a memory limiter and not the missing environment, so it reads
    # like a config error rather than the wiring error it is.
    #
    # Each value is `${KIT_*:default}` for the same reason as everything else in
    # this file: one place to change it, and .env.example documents it.
    environment:
      KIT_OTEL_GRPC_ENDPOINT: ${KIT_OTEL_GRPC_ENDPOINT:-0.0.0.0:4317}
      KIT_OTEL_HTTP_ENDPOINT: ${KIT_OTEL_HTTP_ENDPOINT:-0.0.0.0:4318}
      # The crash layer's intake. NOT published to the host and not a
      # `${KIT_*}` port: it is the endpoint Docker's syslog log driver
      # delivers to over the compose network, which is why every service below
      # sets `logging:`. A host port here would be an unauthenticated log
      # injection point for anything else on the machine.
      KIT_OTEL_SYSLOG_ENDPOINT: ${KIT_OTEL_SYSLOG_ENDPOINT:-0.0.0.0:15514}
      KIT_OTEL_MEMORY_LIMIT_PERCENTAGE: ${KIT_OTEL_MEMORY_LIMIT_PERCENTAGE:-75}
      KIT_OTEL_MEMORY_SPIKE_PERCENTAGE: ${KIT_OTEL_MEMORY_SPIKE_PERCENTAGE:-15}
      KIT_OTEL_REDACTION_SUMMARY: ${KIT_OTEL_REDACTION_SUMMARY:-info}
      KIT_OTEL_BATCH_TIMEOUT: ${KIT_OTEL_BATCH_TIMEOUT:-5s}
      KIT_OTEL_BATCH_SIZE: ${KIT_OTEL_BATCH_SIZE:-512}
      KIT_OTEL_METRIC_NAMESPACE: ${KIT_OTEL_METRIC_NAMESPACE:-cafaye}
      KIT_OTEL_METRICS_FLUSH_INTERVAL: ${KIT_OTEL_METRICS_FLUSH_INTERVAL:-15s}
      KIT_TEMPO_OTLP_ENDPOINT: ${KIT_TEMPO_OTLP_ENDPOINT:-tempo:4317}
      KIT_LOKI_OTLP_ENDPOINT: ${KIT_LOKI_OTLP_ENDPOINT:-http://loki:3100/otlp}
      # TWO backends now, not three, and the one that left is worth a note.
      #
      # THERE IS NO METRICS ENDPOINT VARIABLE ANY MORE. The metrics store cost
      # 130 seconds of readiness budget per cold start (its own healthcheck:
      # retries 12 x interval 10s), against a 180s deadline for the whole stack,
      # and 384m of memory — for a set of series this fleet does not have, on a
      # machine that is also running a compiler and a browser. It is REMOVED,
      # not disabled: no service, no volume, no port, no `mimir.yaml`, and — the
      # part that matters — no collector exporter still dialling `mimir:8080`.
      # An exporter pointed at a host with nothing behind it is a connection
      # refused per flush, forever, in a log nobody reads.
      #
      # The metrics pipeline still DERIVES span metrics, still runs the full
      # redaction allowlist and the ingest deny set over them, and exports them
      # to the collector's own stdout. Restoring a store is one endpoint variable
      # here, one exporter block in `otel-collector.yml`, one `exporters:` line
      # on the metrics pipeline, and one datasource in Grafana's provisioning.
      #
      # The two remaining backends speak plaintext OTLP to each other inside the
      # compose network. A self-hoster who terminates TLS does it here, and a
      # literal endpoint never appears in the collector config.
      KIT_OTEL_TLS_INSECURE: ${KIT_OTEL_TLS_INSECURE:-true}
      KIT_OTEL_EXPORT_TIMEOUT: ${KIT_OTEL_EXPORT_TIMEOUT:-5s}
      KIT_OTEL_DEBUG_VERBOSITY: ${KIT_OTEL_DEBUG_VERBOSITY:-normal}
      KIT_OTEL_HEALTH_ENDPOINT: ${KIT_OTEL_HEALTH_ENDPOINT:-0.0.0.0:13133}
      KIT_OTEL_LOG_LEVEL: ${KIT_OTEL_LOG_LEVEL:-info}
      # Not a `ports:` entry and not a published port. The collector publishes
      # nothing to the host; these are the endpoints it BINDS inside the
      # compose network, which is why the compose port check ignores values in
      # an `environment:` block.
    volumes:
      # `${KIT_COMPOSE_DIR:-.}` and not `./`. This file is no longer copied into
      # the service, so a bare `./` is no longer the service's root — it is
      # whatever `bin/dev` was told to run compose from, and `bin/dev` runs it
      # from the service root so the service's own `build: context: .` resolves.
      # The collector's config would then be looked for in the service, where it
      # no longer is, and Docker creates an empty DIRECTORY at a missing bind
      # source. The collector then exits with
      #   failed to read configFile /etc/tempo/tempo.yaml: is a directory
      # which names a file type and not the thing that is wrong. Found by
      # RUNNING the stack; `docker compose config` renders the same project and
      # every check in kit's gate was green.
      #
      # The default `.` is the directory holding THIS file, which is what it has
      # always meant, and is what keeps a hand-copied stack working unchanged.
      # `bin/dev` sets it to the fetched tree's compose directory. It is the
      # COMPOSE directory and not the kit root, deliberately: naming it after the
      # thing it points at rather than after the repository it came from is what
      # makes the default and the fetched case the same path with a different
      # prefix, rather than two different shapes.
      - ${KIT_COMPOSE_DIR:-.}/otel-collector.yml:/etc/otel/otel-collector.yml:ro
    # Bounded, and the number is one a laptop can spare. The collector is the
    # one process every service's telemetry passes through, so an unbounded
    # one is a process that takes the whole dev machine with it and gets
    # blamed for whatever else was running.
    mem_limit: ${KIT_OTEL_MEMORY_LIMIT:-384m}
    healthcheck:
      # The health_check extension's real endpoint, not `components`. `up
      # --wait` is meant to be waiting for the pipelines to be wired; asking
      # the binary to print its component list proves the binary starts, which
      # is a weaker claim that reads as a stronger one.
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otel/otel-collector.yml"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 5s
    networks: [platform]

  # =========================================================================
  # The three backing services: Tempo (traces), Loki (logs and the crash
  # layer), Grafana (the views).
  #
  # ALL THREE ARE AGPL-3.0 AND ARE SHIPPED UNMODIFIED. That is the condition
  # the licence cares about and it is the reason for three rules below that
  # look fussy:
  #
  #   - `image:` is a stock `grafana/<name>:<pinned tag>`. No `build:` stanza
  #     anywhere on these services, and the gate fails on one. Building
  #     the image is how a fork happens, and a fork is the thing that would
  #     make this a licensing problem for the people we sell this to. The gate
  #     asserts it, so "we didn't modify it" is a checked fact rather than a
  #     claim in a README.
  #   - The configuration files under loki/, tempo/ and grafana/ are
  #     CONFIGURATION, which the licence expressly permits, mounted read-only.
  #     They set retention, limits and paths. They do not patch anything.
  #   - Nothing is overridden onto the vendor's own image contents.
  #
  # AGPL attaches to the Grafana SERVER, not to the applications it observes,
  # so this is compatible with cafaye being MIT/Apache. The obligation runs in
  # one direction: we may use these; a self-hoster using our code is not
  # thereby offered a modified Grafana.
  #
  # WHY A PROFILE, AND WHY IT IS OFF BY DEFAULT. These are the expensive half —
  # three images, three processes, real disk, and a first boot that is not fast
  # on a cold volume. `profiles: [observability]` means the default path is
  # postgres/nats/redis/collector and the backends are one deliberate variable:
  #
  #     KIT_DEV_PROFILES=observability bin/dev up
  #
  # The readiness budgets below are the argument, and they are the compose
  # file's own numbers rather than a report's: tempo 65s, loki 16s, grafana up
  # to 180s, and — until mimir was removed, see its entry — mimir 130s. Summed
  # against a 180s deadline for the whole stack, the default was the tax and the
  # escape hatch was the good path.
  #
  # WHY BOUNDED. A dev machine running six services plus three more needs every
  # one of them capped, or the kernel kills the largest and the whole thing
  # gets attributed to something else. `mem_limit` here is a per-service cap,
  # deliberately conservative: this is a laptop, and disk is the other half.
  #
  # The `depends_on` graph among the three is health-based, not sleeps, and it
  # runs BACKWARDS from the usual intuition: nothing here depends on the
  # collector. A collector whose Tempo is down is a collector that has lost
  # spans, not one that is unhealthy, and gating `up --wait` on Tempo would
  # make an observability backend a precondition for starting a database.

  # --------------------------------------------------------------------- tempo
  tempo:
    image: grafana/tempo:${KIT_TEMPO_TAG:-2.7.2}
    # NOT in depends_on for anything, and never in anyone's readiness path.
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ${KIT_COMPOSE_DIR:-.}/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      # The HTTP/OTLP port, so a developer can open Tempo directly and read a
      # raw trace. Container-side 3200 is Tempo's own HTTP+OTLP port.
      - "${KIT_TEMPO_PORT:-15900}:3200"
    mem_limit: ${KIT_TEMPO_MEMORY_LIMIT:-256m}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3200/ready"]
      interval: 5s
      timeout: 5s
      # 12 * 5s plus a 5s start period is a 65s budget. Tempo initialises its WAL
      # and waits for the ingester ring before reporting ready, and on a cold
      # volume that is tens of seconds on a loaded laptop. A tighter budget here
      # does not make the stack start faster; it makes it fail to start.
      retries: 12
      start_period: 5s
    profiles: [observability]
    networks: [platform]

  # ---------------------------------------------------------------------- loki
  loki:
    image: grafana/loki:${KIT_LOKI_TAG:-3.2.1}
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ${KIT_COMPOSE_DIR:-.}/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "${KIT_LOKI_PORT:-15901}:3100"
    mem_limit: ${KIT_LOKI_MEMORY_LIMIT:-256m}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 5s
      timeout: 5s
      # 12 * 5s plus a 5s start period. MEASURED, not guessed: Loki 3.2.1 takes
      # ~16s to report ready from cold because it waits for the ring to
      # stabilise before starting the compactor, and that is on an idle laptop.
      # kit-02's 6 retries at 10s looked more generous and was not.
      retries: 12
      start_period: 5s
    profiles: [observability]
    networks: [platform]

  # ------------------------------------------------------------------- grafana
  grafana:
    image: grafana/grafana:${KIT_GRAFANA_TAG:-11.3.0}
    environment:
      # Bring your own password in .env; the default is a dev credential for a
      # port on the developer's own machine and nothing else. The gate asserts
      # every ${KIT_*} the stack interpolates is documented in .env.example with
      # a non-empty default, so a fresh clone runs with no hand-written .env.
      GF_SECURITY_ADMIN_USER: ${KIT_GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${KIT_GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # The whole point of the packet: provisioning is FILES, so a dashboard
      # works on first load without anyone clicking it together by hand. A
      # dashboard a self-hoster has to rebuild is not a dashboard we shipped.
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      # Anonymous view is the default a developer expects from a local stack.
      # Bound to the compose network and the published 15000-range port only.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # A dev stack should not phone home to a Grafana Cloud account or prompt
      # about an upgrade. Both are one setting, and both are a self-hoster's
      # first complaint.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Grafana 11.3 ships `[plugins] preinstall = grafana-lokiexplore-app` and
      # installs it on FIRST BOOT, which means the dev stack downloads a plugin
      # zip from the internet before it is usable. Measured, on a cold volume:
      # 20 seconds once, and over 180 seconds another time, because the install
      # holds the same sqlite lock Grafana's own migrations want — the log shows
      # a 19-second gap with no line in it, between "Update plugin_setting table
      # charset" and "create server_lock table".
      #
      # So the slowest thing in this stack was a network call nobody asked for,
      # and it made the cold-start time unpredictable rather than merely slow. An
      # air-gapped developer — which `bin/dev`'s offline mode exists to serve —
      # could not start this at all.
      #
      # Nothing kit ships uses it. Both provisioned dashboards read Loki through
      # the provisioned `loki` datasource, and the alert rules are PromQL. The
      # LogQL Explore app is a UI convenience in the Grafana UI, not a data path.
      #
      # This is CONFIGURATION, not modification: it is an env var the vendor
      # documents for exactly this, and the AGPL condition this file already
      # argues is about not building a `grafana/*` image. See the note above on
      # `build:`.
      GF_INSTALL_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ${KIT_COMPOSE_DIR:-.}/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${KIT_GRAFANA_PORT:-15000}:3000"
    mem_limit: ${KIT_GRAFANA_MEMORY_LIMIT:-256m}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      # 6 × 10s plus a 5s start period, and MEASURED rather than guessed — the
      # same discipline as the Tempo and Loki budgets above. The number is
      # defensible because the cause of the slowness was removed rather than
      # budgeted for: see `GF_INSTALL_PLUGINS_PREINSTALL_DISABLED` above. Grafana's
      # first boot was downloading a plugin over the network and holding the
      # sqlite lock while it did, which made this service take anywhere from 20s
      # to over 180s to answer `/api/health` on a cold volume.
      #
      # With that gone, measured cold on a cold volume with all eight containers
      # starting together, the endpoint first answers at ~26s, and the whole stack
      # is up and healthy in 76s. Comfortably inside this 65s budget, so the
      # budget is left exactly as it was.
      #
      # Worth recording because the wrong fix was available and looked entirely
      # reasonable. A cold start failing against a 65s budget reads exactly like a
      # flake, and the obvious response is to raise the retries. That would have
      # hidden a network call inside the dev loop and left the loop unusable
      # offline — which is the one thing this packet exists to make true. Found by
      # RUNNING the fetched stack (tests/stack_live_test.sh); `docker compose
      # config` renders the same project and every static check was green.
      retries: 6
      start_period: 5s
    profiles: [observability]
    networks: [platform]
