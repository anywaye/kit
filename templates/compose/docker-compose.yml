---
# kit template — the local infrastructure every anywaye service joins.
#
#   IT IS NOT COPIED. `bin/dev` fetches this file, and the rest of this
#   directory, from a PINNED kit ref, and runs it beside the service's own
#   `docker-compose.yml`:
#
#     docker compose -f <kit>/templates/compose/docker-compose.yml \
#                    -f ./docker-compose.yml up -d --wait
#
#   The second file is an OVERRIDE, not a fork. What the service owns — its own
#   image, its own port, its own database name — is the only thing in it. See
#   "WHAT A SERVICE MAY OVERRIDE" below, and the gate in kit's tests/validate.sh
#   that holds both halves of it.
#
# WHAT THIS IS
#   Postgres, NATS with JetStream, the one-shot that defines the stream the
#   fleet publishes to, Redis, the OpenTelemetry collector, and the three
#   services that make a developer's traces, logs and errors visible
#   without installing anything. One stack, one set of credentials, one command.
#   A service joins it by adding a `depends_on` and copying its connection URLs
#   into .env.
#
#   THE OBSERVABILITY BACKENDS ARE OFF BY DEFAULT. `bin/dev` starts postgres,
#   nats, redis and the collector; the LGTM profile — tempo, loki, grafana — is
#   `KIT_DEV_PROFILES=observability bin/dev up`, and the single-pane ClickStack
#   view is `KIT_DEV_PROFILES=clickstack bin/dev up`. The profiles are
#   independent of each other; the collector forwards to whichever endpoints
#   are up and stays silent about the ones that are not.
#
#   That is a reversal, and the numbers are why. As defaults they cost every
#   developer's first run: grafana downloading a plugin zip on first boot
#   (20s once, over 180s another time), 130s of the metrics store's readiness
#   budget before it was removed, 65s of
#   Tempo's, 16s of Loki's — against a 180s deadline for the whole stack. A
#   default that taxes everyone's startup to serve a view they did not open is
#   a default that gets switched off fleet-wide, and the telemetry goes with it.
#   The escape hatch existed the whole time and was the documented good path.
#   So the hatch is now the default and observability is the deliberate spelling.
#
#   WHAT DOES NOT CHANGE. `<SERVICE>_OTEL_ENDPOINT` is still the only contract,
#   its default is still this collector, and the collector is still NOT behind
#   the profile: on the cheap path telemetry still arrives, is still run through
#   the redaction allowlist — which drops high-cardinality dimensions at INGEST,
#   before anything would be stored — and is then dropped because there is no
#   store to hand it to. Losing a span is better than becoming a slow service,
#   and cheaper than paying 130 seconds for the privilege of keeping it.
#
#   It is still not MANDATORY, in either direction. `<SERVICE>_OTEL_ENDPOINT` is
#   the only contract and the collector below is just that variable's default
#   value, so a self-hoster already running Datadog, Honeycomb or Grafana Cloud
#   sets the variable in their service and this stack goes quiet. Bring-your-own
#   is a supported deployment, not a degraded mode.
#
# WHAT THIS IS NOT
#   It is not production. Volumes are named, not replicated; passwords are the
#   development defaults in .env.example; nothing is exposed outside the host
#   loopback. It exists so `bin/dev` is one command and CI is one image.
#
# STRICTNESS NOTES — READ BEFORE EDITING
#   - EVERY published port is a ${KIT_*:default} substitution. A literal port in
#     this file is a collision the second developer on the machine hits, and the
#     gate fails on one. Change the port in .env, not here.
#   - EVERY image is pinned to an exact tag. Never `latest`: a stack that
#     changes under you between two runs of the same command is not a dev
#     environment, it is a coin flip. Bump the pin in .env.example when you
#     bump the tag.
#   - EVERY service has a healthcheck. `docker compose up --wait` can only mean
#     something if there is a health signal to wait for, and the gate fails on
#     a service without one.
#   - The collector publishes NO host port on purpose. Services reach it over
#     the compose network by service name; a host port would expose an OTLP
#     receiver to anything else on the machine.
#   - Service names here are infrastructure names, not anywaye service names.
#     Hostnames are the adopting repo's business — a template that picks them is
#     a template six repos disagree with.
#   - Credentials live in .env (git-ignored), never in this file. .env.example
#     documents every placeholder with a default, so a fresh clone runs without
#     a hand-written .env.
#   - NOTHING BUT THE COLLECTOR MAY BE IN A READINESS PATH. A service that
#     waits for the collector serves no traffic while the collector is down,
#     which is strictly worse than serving traffic with no traces. So no
#     `depends_on: [otel-collector]` anywhere below, and no healthcheck
#     probes an OTLP port. The gate fails on both. The live half of the proof
#     is tests/no_telemetry_in_readiness.sh, which kills the collector and
#     shows a service still serving.
#
# WHAT A SERVICE MAY OVERRIDE, AND WHAT IT MAY NOT
#   Two files, merged by `docker compose -f kit -f yours`. The merge is per-key
#   and it is NOT symmetric, so the rules below are measured against
#   `docker compose config`, not assumed. Each was run; the surprises are called
#   out because the unsurprising ones are the ones that bite.
#
#   MAY — set `image:` on a service (wholesale, and a different tag is a
#         different postgres major, which is a real thing a service needs).
#   MAY — add keys to YOUR OWN service's `environment:` (a connection string for
#         the database the init script gave you is the case that matters). What
#         is NOT yours is the `postgres` service's own `environment:` below —
#         see the fourth MAY NOT.
#   MAY — add a `depends_on` with `condition: service_healthy`, and declare a
#         new service of your own.
#   MAY — change a published port, BUT ONLY BY CHANGING THE VARIABLE in `.env`.
#         This is the sharp one. A `ports:` list in the second file APPENDS to
#         the first rather than replacing it, so a service that writes
#         `ports: ["15433:5432"]` gets postgres listening on 15500 *and* 15433.
#         Measured, not assumed. `KIT_POSTGRES_PORT=15433` in `.env` is the only
#         way to move it, and the gate fails on a `ports:` entry in a service
#         file for that reason.
#   MAY NOT — touch `otel-collector`. Not its `image:`, not its `command:`, and
#         above all not the `volumes:` entry that mounts `otel-collector.yml`.
#         That file carries the redaction allowlist, which is DERIVED from core's
#         schemas; a service that overrides the mount is shipping a telemetry
#         boundary nobody derived, and prompt content leaves the process inside
#         it. The gate fails on any of the three.
#   MAY NOT — override the three AGPL backends. `grafana/*` images unmodified is
#         the licence condition, and a `build:` or a retag is a fork.
#   MAY NOT — set POSTGRES_USER, POSTGRES_DB or POSTGRES_PASSWORD on this
#         service. THIS USED TO BE THE RECOMMENDED FIX and it is the single most
#         expensive piece of wrong advice this file has published, so the reason
#         is written out rather than left to be rediscovered:
#
#           POSTGRES_USER    the official image creates it, and it creates it as
#                            a SUPERUSER. Measured on this cluster's own init
#                            script: a service that overrides it holds
#                            `rolsuper = t` where every provisioned role holds
#                            `f`, and reads another service's table while a
#                            provisioned role is refused at the door. It undoes
#                            `LOGIN NOSUPERUSER ...` in initdb/10-cluster.sh:108.
#           POSTGRES_DB      the image creates that database too, before any init
#                            script runs.
#           Either of those  CREATE ROLE / CREATE DATABASE then fails, the init
#                            script runs during initdb with ON_ERROR_STOP=1, and
#                            THE WHOLE CLUSTER REFUSES TO START. Measured, exit
#                            status 3, `ERROR:  role "identity" already exists`.
#           POSTGRES_PASSWORD
#                            does not do either of those and is still refused: it
#                            is the password handed to EVERY role below, so one
#                            service's file would decide it for all of them.
#
#         The way to get a database is the variable three lines below:
#         `KIT_POSTGRES_DATABASES`, in `.env`. That is how a service gets a role,
#         a database it owns, and the boundary, and it costs no compose file at
#         all. A service that sets any of the three has broken the cluster it
#         shares, and `templates/database/README.md`'s "Adopting this" is the
#         procedure that keeps it out.
#   MAY NOT — set `allow_all_keys`, or add an exporter, by any route. Same
#         reason, and it is the same check that already fails on kit's own file.
#
# WHAT STAYS IN THE SERVICE
#   A service's own `docker-compose.yml` after this change is its own image, its
#   own port, its own environment, its own volume, and its own service entry.
#   Measured on `muse`, the largest adopter: 86 lines to 27, and the 59 that
#   went are postgres, a healthcheck and a volume that kit already ships.
#
# THE PORT BLOCK: 15000-15999
#   kit claims this range for the whole stack, one hundred per service, and
#   every published port is a ${KIT_*:default} inside it. The defaults are NOT
#   5432, 4222 or 6379, and that is the whole point.
#
#   Those three are the two or three most likely things already listening on a
#   developer's machine — a Homebrew postgres, a redis from another project, a
#   database GUI. `bin/dev` is the first command a new person runs on a repo
#   they just cloned, and it is the worst possible moment to discover that
#   someone else owns 5432. Failing at `up` with "port is already allocated" is
#   a bad first five minutes; a stack that comes up on a port nothing else
#   wants is not.
#
#   A high range also makes two checkouts on one laptop a non-event, which
#   matters because a developer working across two services has exactly that.
#   Ports here are published on all interfaces, so the range must not collide
#   with another developer on a shared network; 15000+ is well clear of the
#   IANA dynamic range and of anything a macOS or Linux service binds by
#   default. The gate asserts membership of the block and no reuse, as a
#   RANGE rather than a list of approved ports — a list has to be edited every
#   time a service is added, and a check that must be edited is one that gets
#   skipped.

name: ${KIT_STACK_NAME:-anywaye}

networks:
  platform:

volumes:
  postgres-data:
  nats-data:
  redis-data:
  tempo-data:
  loki-data:
  grafana-data:

services:
  postgres:
    build:
      context: ${KIT_COMPOSE_DIR:-.}/postgres
      dockerfile: Dockerfile
      args:
        POSTGRES_TAG: ${KIT_POSTGRES_TAG:-17}
        PGVECTOR_TAG: ${KIT_PGVECTOR_TAG:-17-0.8.6}
    image: kit-postgres:${KIT_POSTGRES_TAG:-17}
    environment:
      POSTGRES_USER: ${KIT_POSTGRES_USER:-anywaye}
      POSTGRES_PASSWORD: ${KIT_POSTGRES_PASSWORD:-anywaye}
      POSTGRES_DB: ${KIT_POSTGRES_DB:-anywaye_platform}
      KIT_POSTGRES_DATABASES: ${KIT_POSTGRES_DATABASES}
      KIT_POSTGRES_EXTENSIONS: ${KIT_POSTGRES_EXTENSIONS:-vector}
      KIT_POSTGRES_ROLE_CONNECTIONS: ${KIT_POSTGRES_ROLE_CONNECTIONS:-10}
      KIT_POSTGRES_STATEMENT_TIMEOUT_MS: ${KIT_POSTGRES_STATEMENT_TIMEOUT_MS:-15000}
      KIT_POSTGRES_IDLE_IN_TRANSACTION_TIMEOUT_MS: ${KIT_POSTGRES_IDLE_IN_TRANSACTION_TIMEOUT_MS:-30000}
    command:
      - "postgres"
      - "-c"
      - "max_connections=${KIT_POSTGRES_MAX_CONNECTIONS:-200}"
    ports:
      - "${KIT_POSTGRES_PORT:-15500}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ${KIT_COMPOSE_DIR:-.}/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -q -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" &&
          psql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc 'select 1' >/dev/null
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks: [platform]

  nats:
    image: nats:${KIT_NATS_TAG:-2.10.24-alpine}
    command:
      - "-js"
      - "-sd"
      - "/data"
      - "-m"
      - "8222"
    ports:
      - "${KIT_NATS_CLIENT_PORT:-15600}:4222"
      - "${KIT_NATS_MONITOR_PORT:-15700}:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    networks: [platform]

  nats-stream-init:
    image: natsio/nats-box:${KIT_NATS_BOX_TAG:-0.20.0}
    environment:
      NATS_URL: nats://nats:4222
    depends_on:
      nats:
        condition: service_healthy
    restart: "no"
    command:
      - sh
      - -c
      - 'nats stream info anywaye >/dev/null 2>&1 || nats stream add anywaye --subjects "identity.>,billing.>,courier.>,muse.>,darkroom.>" --storage file --retention limits --max-age 7d --discard old --replicas 1 --defaults'
    healthcheck:
      test: ["CMD", "nats", "stream", "info", "anywaye"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    networks: [platform]

  redis:
    image: redis:${KIT_REDIS_TAG:-7.4.1-alpine}
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${KIT_REDIS_PORT:-15800}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    networks: [platform]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:${KIT_OTEL_COLLECTOR_TAG:-0.115.1}
    command: ["--config=/etc/otel/otel-collector.yml"]
    environment:
      KIT_OTEL_GRPC_ENDPOINT: ${KIT_OTEL_GRPC_ENDPOINT:-0.0.0.0:4317}
      KIT_OTEL_HTTP_ENDPOINT: ${KIT_OTEL_HTTP_ENDPOINT:-0.0.0.0:4318}
      KIT_OTEL_SYSLOG_ENDPOINT: ${KIT_OTEL_SYSLOG_ENDPOINT:-0.0.0.0:15514}
      KIT_OTEL_MEMORY_LIMIT_PERCENTAGE: ${KIT_OTEL_MEMORY_LIMIT_PERCENTAGE:-75}
      KIT_OTEL_MEMORY_SPIKE_PERCENTAGE: ${KIT_OTEL_MEMORY_SPIKE_PERCENTAGE:-15}
      KIT_OTEL_REDACTION_SUMMARY: ${KIT_OTEL_REDACTION_SUMMARY:-info}
      KIT_OTEL_BATCH_TIMEOUT: ${KIT_OTEL_BATCH_TIMEOUT:-5s}
      KIT_OTEL_BATCH_SIZE: ${KIT_OTEL_BATCH_SIZE:-512}
      KIT_OTEL_METRIC_NAMESPACE: ${KIT_OTEL_METRIC_NAMESPACE:-anywaye}
      KIT_OTEL_METRICS_FLUSH_INTERVAL: ${KIT_OTEL_METRICS_FLUSH_INTERVAL:-15s}
      KIT_TEMPO_OTLP_ENDPOINT: ${KIT_TEMPO_OTLP_ENDPOINT:-tempo:4317}
      KIT_LOKI_OTLP_ENDPOINT: ${KIT_LOKI_OTLP_ENDPOINT:-http://loki:3100/otlp}
      KIT_CLICKSTACK_OTLP_ENDPOINT: ${KIT_CLICKSTACK_OTLP_ENDPOINT:-clickstack:4317}
      KIT_OTEL_TLS_INSECURE: ${KIT_OTEL_TLS_INSECURE:-true}
      KIT_OTEL_EXPORT_TIMEOUT: ${KIT_OTEL_EXPORT_TIMEOUT:-5s}
      KIT_OTEL_DEBUG_VERBOSITY: ${KIT_OTEL_DEBUG_VERBOSITY:-normal}
      KIT_OTEL_HEALTH_ENDPOINT: ${KIT_OTEL_HEALTH_ENDPOINT:-0.0.0.0:13133}
      KIT_OTEL_LOG_LEVEL: ${KIT_OTEL_LOG_LEVEL:-info}
    volumes:
      - ${KIT_COMPOSE_DIR:-.}/otel-collector.yml:/etc/otel/otel-collector.yml:ro
    mem_limit: ${KIT_OTEL_MEMORY_LIMIT:-384m}
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otel/otel-collector.yml"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 5s
    networks: [platform]

  # =========================================================================
  # The three backing services: Tempo (traces), Loki (logs and the crash
  # layer), Grafana (the views).
  #
  # ALL THREE ARE AGPL-3.0 AND ARE SHIPPED UNMODIFIED. That is the condition
  # the licence cares about and it is the reason for three rules below that
  # look fussy:
  #
  #   - `image:` is a stock `grafana/<name>:<pinned tag>`. No `build:` stanza
  #     anywhere on these services, and the gate fails on one. Building
  #     the image is how a fork happens, and a fork is the thing that would
  #     make this a licensing problem for the people we sell this to. The gate
  #     asserts it, so "we didn't modify it" is a checked fact rather than a
  #     claim in a README.
  #   - The configuration files under loki/, tempo/ and grafana/ are
  #     CONFIGURATION, which the licence expressly permits, mounted read-only.
  #     They set retention, limits and paths. They do not patch anything.
  #   - Nothing is overridden onto the vendor's own image contents.
  #
  # AGPL attaches to the Grafana SERVER, not to the applications it observes,
  # so this is compatible with anywaye being MIT/Apache. The obligation runs in
  # one direction: we may use these; a self-hoster using our code is not
  # thereby offered a modified Grafana.
  #
  # WHY A PROFILE, AND WHY IT IS OFF BY DEFAULT. These are the expensive half —
  # three images, three processes, real disk, and a first boot that is not fast
  # on a cold volume. `profiles: [observability]` means the default path is
  # postgres/nats/redis/collector and the backends are one deliberate variable:
  #
  #     KIT_DEV_PROFILES=observability bin/dev up
  #
  # The readiness budgets below are the argument, and they are the compose
  # file's own numbers rather than a report's: tempo 65s, loki 16s, grafana up
  # to 180s, and — until mimir was removed, see its entry — mimir 130s. Summed
  # against a 180s deadline for the whole stack, the default was the tax and the
  # escape hatch was the good path.
  #
  # WHY BOUNDED. A dev machine running six services plus three more needs every
  # one of them capped, or the kernel kills the largest and the whole thing
  # gets attributed to something else. `mem_limit` here is a per-service cap,
  # deliberately conservative: this is a laptop, and disk is the other half.
  #
  # The `depends_on` graph among the three is health-based, not sleeps, and it
  # runs BACKWARDS from the usual intuition: nothing here depends on the
  # collector. A collector whose Tempo is down is a collector that has lost
  # spans, not one that is unhealthy, and gating `up --wait` on Tempo would
  # make an observability backend a precondition for starting a database.

  tempo:
    image: grafana/tempo:${KIT_TEMPO_TAG:-2.7.2}
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ${KIT_COMPOSE_DIR:-.}/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "${KIT_TEMPO_PORT:-15900}:3200"
    mem_limit: ${KIT_TEMPO_MEMORY_LIMIT:-256m}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3200/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    profiles: [observability]
    networks: [platform]

  loki:
    image: grafana/loki:${KIT_LOKI_TAG:-3.2.1}
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ${KIT_COMPOSE_DIR:-.}/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "${KIT_LOKI_PORT:-15901}:3100"
    mem_limit: ${KIT_LOKI_MEMORY_LIMIT:-256m}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    profiles: [observability]
    networks: [platform]

  grafana:
    image: grafana/grafana:${KIT_GRAFANA_TAG:-11.3.0}
    environment:
      GF_SECURITY_ADMIN_USER: ${KIT_GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${KIT_GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Grafana 11.3 ships `[plugins] preinstall = grafana-lokiexplore-app` and
      # installs it on FIRST BOOT, which means the dev stack downloads a plugin
      # zip from the internet before it is usable. Measured, on a cold volume:
      # 20 seconds once, and over 180 seconds another time, because the install
      # holds the same sqlite lock Grafana's own migrations want — the log shows
      # a 19-second gap with no line in it, between "Update plugin_setting table
      # charset" and "create server_lock table".
      #
      # So the slowest thing in this stack was a network call nobody asked for,
      # and it made the cold-start time unpredictable rather than merely slow. An
      # air-gapped developer — which `bin/dev`'s offline mode exists to serve —
      # could not start this at all.
      #
      # Nothing kit ships uses it. Both provisioned dashboards read Loki through
      # the provisioned `loki` datasource, and the alert rules are PromQL. The
      # LogQL Explore app is a UI convenience in the Grafana UI, not a data path.
      #
      # This is CONFIGURATION, not modification: it is an env var the vendor
      # documents for exactly this, and the AGPL condition this file already
      # argues is about not building a `grafana/*` image. See the note above on
      # `build:`.
      GF_INSTALL_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ${KIT_COMPOSE_DIR:-.}/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${KIT_GRAFANA_PORT:-15000}:3000"
    mem_limit: ${KIT_GRAFANA_MEMORY_LIMIT:-256m}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    profiles: [observability]
    networks: [platform]

  # ----------------------------------------------------------------- clickstack
  #
  # The SECOND observability view, and why it exists beside Tempo/Loki/Grafana
  # rather than replacing them: the LGTM stack is a VIEW per signal, stitched by
  # datasource provisioning, and ClickStack (ClickHouse + the HyperDX UI) is a
  # SINGLE pane over all three signals, where a trace, the log line next to it,
  # and the span metrics derived from it are one query apart. Developers who
  # want "why is this request slow" open this one; the LGTM stack stays for the
  # provisioned dashboards and the alert rules, and either can be removed later
  # without moving the contract — `<SERVICE>_OTEL_ENDPOINT` still names the
  # collector, and the collector decides where the redacted bytes go.
  #
  # `hyperdx/hyperdx-local` is the vendor's own single-container dev flavour of
  # ClickStack: ClickHouse, the HyperDX UI/API and an OTLP intake in one image.
  # MIT (UI) and Apache-2.0 (ClickHouse) — the licence posture the AGPL notes
  # above exist to reason about does not even arise here. LOCAL MODE MEANS:
  # no auth to view or send (it is a port on the developer's own machine),
  # single-user, no alerting, and NO PERSISTENCE — telemetry dies with the
  # container. That is the deal, stated in the vendor's own LOCAL.md, and it
  # matches this file's rule that losing a span is strictly better than a slow
  # service. A developer who wants persisted or alerted observability runs the
  # full ClickStack compose deployment in their own repo; the collector-side
  # wiring is identical, because it is one OTLP exporter.
  #
  # THE COLLECTOR, AND THE POINT: services still point at `otel-collector`.
  # The redaction boundary is not bypassed by a second backend, and nothing
  # here is in anyone's readiness path. The collector forwards to
  # `KIT_CLICKSTACK_OTLP_ENDPOINT`; with this profile OFF that endpoint is a
  # dead hostname and the exporter's failure is the same accepted silence
  # Tempo's absence already is.
  #
  # `USAGE_STATS_ENABLED: "false"` — the stack that exists to prove redaction
  # does not phone home itself. Same posture as GF_ANALYTICS_REPORTING_ENABLED
  # on the grafana service above.
  clickstack:
    image: hyperdx/hyperdx-local:${KIT_CLICKSTACK_TAG:-2.40.0}
    environment:
      USAGE_STATS_ENABLED: "false"
    ports:
      - "${KIT_CLICKSTACK_PORT:-15910}:8080"
    mem_limit: ${KIT_CLICKSTACK_MEMORY_LIMIT:-2g}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    profiles: [clickstack]
    networks: [platform]
