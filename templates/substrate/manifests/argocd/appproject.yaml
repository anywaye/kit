apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: argocd
spec:
  # The default project for the cafaye substrate — the only project the eight
  # Applications name. core-install.yaml ships the AppProject CRD but no
  # AppProject object (neither does the full install.yaml — both are CRD-only;
  # the controller auto-creates a maximal default in some installs, but the
  # core variant does not, so without this nothing syncs and step 11 times out
  # waiting for deployment/identity that Argo never creates:
  #   Application referencing project default which does not exist
  # ).
  #
  # WHY LEAST PRIVILEGE, AND WHY IT IS TIGHTER THAN THE HAND-FIX.
  # The manager's hand-fix was sourceRepos *, destinations */*, clusterResourceWhitelist
  # */* — maximal, because that is the shape `kubectl get applications` stops
  # complaining on without thinking about what the Applications actually need.
  # That shape is the controller's own auto-created default, and it is the
  # right default for a cluster that has to run unknown Applications. This
  # substrate is not that cluster: it runs eight known Applications whose
  # charts and namespaces are enumerated in this repository, so the project
  # can be scoped to exactly those.
  #
  #   sourceRepos        what the eight Applications name and no other: the
  #                      two upstream Helm repos for the observability four,
  #                      and a chart-path GLOB for the four service charts
  #                      (oci://ghcr.io/cafaye/charts/*) — because each
  #                      Application names its own chart's PATH
  #                      (oci://ghcr.io/cafaye/charts/gateway, …/courier, …),
  #                      not the registry root. A project that allows * lets an
  #                      Application pull from a repo this repository never
  #                      reviewed; this project refuses it before a chart is
  #                      fetched.
  #
  # WHY A GLOB AND NOT FOUR NAMES — AND WHY IT IS NOT A `*`.
  #   The four OCI paths are one chart per service, and a fifth service must
  #   not require an edit here. Enumerating the four names would
  #   make this file a second list to keep in step with manifests/applications/,
  #   and the packet that moved the Applications from the registry ROOT to
  #   per-chart paths is exactly the seam where a second list drifts. Argo CD's
  #   `sourceRepos` is glob-aware, and the `*` here does NOT open the project:
  #   it is anchored after the registry and org this repo owns
  #   (`oci://ghcr.io/cafaye/charts/`), and Argo matches with `/` as the glob
  #   separator, so `*` matches ONE chart-name segment and cannot cross a `/`
  #   into a different registry, org or nested path.
  #
  # THE EVIDENCE, FROM THE PINNED ARGO, NOT FROM DOCUMENTATION.
  #   install.sh installs Argo CD `v3.5.4`. In that tag,
  #   `pkg/apis/application/v1alpha1/app_project_types.go` resolves a source
  #   with `IsSourcePermitted`, which normalises BOTH the source and each
  #   `sourceRepos` entry through `git.NormalizeGitURL` (lower-case, trim a
  #   `.git` suffix — `util/git/git.go`) and then matches them with
  #   `util/glob.Match(pattern, value, '/')` — gobwas/glob with `/` as the
  #   separator. So `*` matches any run of characters that is not a `/`. The
  #   normaliser leaves the wildcard intact:
  #   `oci://ghcr.io/cafaye/charts/*` → `oci://ghcr.io/cafaye/charts/*`.
  #   Measured against gobwas/glob (the library that tag imports):
  #     oci://ghcr.io/cafaye/charts/gateway   matches
  #     oci://ghcr.io/cafaye/charts/courier   matches
  #     oci://ghcr.io/cafaye/charts/a/b       does NOT (a `*` cannot cross a `/`)
  #     oci://ghcr.io/cafaye/other/gateway    does NOT
  #     oci://ghcr.io/evil/charts/gateway     does NOT
  #   tests/substrate_test.sh §21 asserts every Application's source.repoURL is
  #   permitted by these patterns, with the pre-fix bare-root spelling as a red
  #   control.
  #
  #   destinations       the five namespaces the Applications deploy into
  #                      (observability, identity, gateway, courier, parlor)
  #                      on the one cluster this substrate runs
  #                      (https://kubernetes.default.svc). A project that
  #                      allows */* lets an Application deploy into kube-system
  #                      or argocd itself; this one does not.
  #
  #   clusterResourceWhitelist / namespaceResourceWhitelist
  #                      not listed, so the defaults apply: no cluster-scoped
  #                      resources and all namespaced resources. The service
  #                      charts create Deployments, Services, ConfigMaps and
  #                      Secrets in their own namespace and nothing
  #                      cluster-scoped; the observability charts do the same
  #                      inside observability. Allowing a clusterResource would
  #                      let a chart create a ClusterRole that binds to any
  #                      namespace, which is exactly the privilege the
  #                      database-per-service boundary exists to prevent.
  #                      If a chart later needs a cluster-scoped kind, that
  #                      kind is added here explicitly, with the reason beside
  #                      it — the project is the one place a cluster-scoped
  #                      grant is visible.
  #
  # If the maximal shape is ever needed again, the reason must be written
  # beside it — a project that allows * is a project that has stopped being
  # a boundary.
  description: "The default project for the cafaye substrate — the eight Applications' project"
  sourceRepos:
    - https://grafana.github.io/helm-charts
    - https://prometheus-community.github.io/helm-charts
    # One chart-name segment under the registry root this repo owns; NOT `*`
    # (see "WHY A GLOB" above). Argo v3.5.4 matches this with `/` as the glob
    # separator, so it permits `…/gateway` and refuses `…/a/b`.
    - oci://ghcr.io/cafaye/charts/*
  destinations:
    - namespace: observability
      server: https://kubernetes.default.svc
    - namespace: identity
      server: https://kubernetes.default.svc
    - namespace: gateway
      server: https://kubernetes.default.svc
    - namespace: courier
      server: https://kubernetes.default.svc
    - namespace: parlor
      server: https://kubernetes.default.svc
