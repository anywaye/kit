apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  annotations:
    # The cluster-scoped kinds this chart creates, rendered with the pinned
    # version below (defaults, --include-crds — the flags Argo passes):
    # CustomResourceDefinition podlogs.monitoring.grafana.com, ClusterRole
    # alloy, ClusterRoleBinding alloy. The AppProject whitelists exactly
    # these; §28 fails the run when the two disagree.
    anywaye.io/cluster-resources: "apiextensions.k8s.io/CustomResourceDefinition, rbac.authorization.k8s.io/ClusterRole, rbac.authorization.k8s.io/ClusterRoleBinding"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.13.0
    helm:
      values: |
        alloy:
          configMap:
            content: |
              otelcol.receiver.otlp "default" {
                grpc { endpoint = "0.0.0.0:4317" }
                http { endpoint = "0.0.0.0:4318" }
                output {
                  metrics = [otelcol.processor.batch.default.input]
                  logs    = [otelcol.processor.batch.default.input]
                  traces  = [otelcol.processor.batch.default.input]
                }
              }
              otelcol.processor.batch "default" {
                output {
                  metrics = [otelcol.exporter.prometheus.default.input]
                  logs    = [otelcol.exporter.loki.default.input]
                  traces  = [otelcol.exporter.otlp.tempo.input]
                }
              }
              otelcol.exporter.loki "default" {
                forward_to = [loki.write.default.receiver]
              }
              loki.write "default" {
                endpoint {
                  url = "http://loki:3100/loki/api/v1/push"
                }
              }
              otelcol.exporter.otlp "tempo" {
                client {
                  endpoint = "tempo:4317"
                  tls { insecure = true }
                }
              }
              otelcol.exporter.prometheus "default" {
                forward_to = [prometheus.remote_write.default.receiver]
              }
              prometheus.remote_write "default" {
                endpoint {
                  url = "http://prometheus:9090/api/v1/write"
                }
              }
          extraPorts:
            - name: otlp-grpc
              port: 4317
              targetPort: 4317
              protocol: TCP
            - name: otlp-http
              port: 4318
              targetPort: 4318
              protocol: TCP
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
