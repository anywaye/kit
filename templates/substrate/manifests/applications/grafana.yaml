apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  annotations:
    # The cluster-scoped kinds this chart creates, rendered with the pinned
    # version below (defaults, --include-crds): ClusterRole
    # grafana-clusterrole, ClusterRoleBinding grafana-clusterrolebinding, no
    # CRDs. The AppProject whitelists exactly these; §28 fails the run when
    # the two disagree.
    cafaye.io/cluster-resources: "rbac.authorization.k8s.io/ClusterRole, rbac.authorization.k8s.io/ClusterRoleBinding"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: grafana
    targetRevision: 10.5.15
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
