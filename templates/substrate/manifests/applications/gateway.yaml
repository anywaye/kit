apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: oci://ghcr.io/anywaye/charts/gateway
    chart: gateway
    targetRevision: 0.1.0
    helm:
      values: |
        env:
          OTEL_SDK_DISABLED: "true"
          IDENTITY_URL: "http://identity.identity.svc.cluster.local:8080"
          IDENTITY_JWKS_URL: "http://identity.identity.svc.cluster.local:8080/.well-known/jwks.json"
          OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy.observability:4318"
          GATEWAY_ERROR_REPORTING_DSN: "http://da15bbe5-6b70-4b2f-92a5-ce8a8365fecf@glitchtip.default:8095/2"
          GATEWAY_RELEASE: "0.1.0"
          DEPLOYMENT_ENVIRONMENT: "production"
  destination:
    server: https://kubernetes.default.svc
    namespace: gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
