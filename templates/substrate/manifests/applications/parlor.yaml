apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parlor
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: oci://ghcr.io/anywaye/charts/website
    chart: website
    targetRevision: 0.1.0
    helm:
      values: |
        env:
          IDENTITY_URL: "http://identity.identity.svc.cluster.local:8080"
          BILLING_URL: "http://billing.billing.svc.cluster.local"
          OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy.observability:4318"
          OTEL_SERVICE_NAME: "website"
  destination:
    server: https://kubernetes.default.svc
    namespace: parlor
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
