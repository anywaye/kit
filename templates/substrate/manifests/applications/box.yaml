apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: box
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: oci://ghcr.io/cafaye/charts/box
    chart: box
    targetRevision: 0.1.0
    helm:
      values: |
        imagePullSecrets: ghcr-pull-secret
  destination:
    server: https://kubernetes.default.svc
    namespace: box
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
