apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  annotations:
    # The cluster-scoped kinds this chart creates, rendered with the pinned
    # version below (defaults, --include-crds): ClusterRole +
    # ClusterRoleBinding x2 (kube-state-metrics, server), no CRDs. The
    # AppProject whitelists exactly these; §28 fails the run when the two
    # disagree.
    cafaye.io/cluster-resources: "rbac.authorization.k8s.io/ClusterRole, rbac.authorization.k8s.io/ClusterRoleBinding"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: 29.36.0
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
