apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pantry
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: oci://ghcr.io/cafaye/charts/pantry
    chart: pantry
    targetRevision: 0.1.0
    # THE PULL SECRET, AND WHY IT IS NAMED HERE. The chart defaults
    # `imagePullSecrets` to `pantry-ghcr`, a secret "created once, out of
    # band" per its values.yaml — a manual kubectl on the box, outside every
    # check in this tree. The installer already exchanges a short-lived
    # registry credential on every run and writes it as `ghcr-pull-secret`
    # in every pulling namespace; naming it here is that secret, kept fresh
    # by the installer rather than created by hand once and left to expire.
    # A chart key with no writer is a pod that never starts, and an
    # out-of-band writer is a writer no test can see.
    helm:
      values: |
        imagePullSecrets: ghcr-pull-secret
  destination:
    server: https://kubernetes.default.svc
    namespace: pantry
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
