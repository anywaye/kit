---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: data
spec:
  instances: 1

  resources:
    requests:
      memory: 256Mi
      cpu: 500m
    limits:
      memory: 1Gi
      cpu: 1000m

  storage:
    size: 20Gi
    storageClass: local-path

  postgresql:
    parameters:
      max_connections: "200"

  bootstrap:
    initdb:
      database: app
      owner: app
      postInitSQL:
        - CREATE ROLE "identity" WITH LOGIN
        - CREATE ROLE "identity_app" WITH LOGIN
        - CREATE DATABASE "identity" OWNER "identity"
        - REVOKE ALL ON DATABASE "identity" FROM PUBLIC
        - GRANT CONNECT, TEMPORARY ON DATABASE "identity" TO "identity"
        - GRANT CONNECT, TEMPORARY ON DATABASE "identity" TO "identity_app"
        - ALTER ROLE "identity" CONNECTION LIMIT 10
        - ALTER ROLE "identity" SET statement_timeout = '15000ms'
        - ALTER ROLE "identity" SET idle_in_transaction_session_timeout = '30000ms'
        - ALTER ROLE "identity_app" SET statement_timeout = '15000ms'
        - ALTER ROLE "identity_app" SET idle_in_transaction_session_timeout = '30000ms'
        - CREATE ROLE "gateway" WITH LOGIN
        - CREATE ROLE "gateway_app" WITH LOGIN
        - CREATE DATABASE "gateway" OWNER "gateway"
        - REVOKE ALL ON DATABASE "gateway" FROM PUBLIC
        - GRANT CONNECT, TEMPORARY ON DATABASE "gateway" TO "gateway"
        - GRANT CONNECT, TEMPORARY ON DATABASE "gateway" TO "gateway_app"
        - ALTER ROLE "gateway" CONNECTION LIMIT 10
        - ALTER ROLE "gateway" SET statement_timeout = '15000ms'
        - ALTER ROLE "gateway" SET idle_in_transaction_session_timeout = '30000ms'
        - ALTER ROLE "gateway_app" SET statement_timeout = '15000ms'
        - ALTER ROLE "gateway_app" SET idle_in_transaction_session_timeout = '30000ms'
        - CREATE ROLE "courier" WITH LOGIN
        - CREATE ROLE "courier_app" WITH LOGIN
        - CREATE DATABASE "courier" OWNER "courier"
        - REVOKE ALL ON DATABASE "courier" FROM PUBLIC
        - GRANT CONNECT, TEMPORARY ON DATABASE "courier" TO "courier"
        - GRANT CONNECT, TEMPORARY ON DATABASE "courier" TO "courier_app"
        - ALTER ROLE "courier" CONNECTION LIMIT 10
        - ALTER ROLE "courier" SET statement_timeout = '15000ms'
        - ALTER ROLE "courier" SET idle_in_transaction_session_timeout = '30000ms'
        - ALTER ROLE "courier_app" SET statement_timeout = '15000ms'
        - ALTER ROLE "courier_app" SET idle_in_transaction_session_timeout = '30000ms'
        - CREATE ROLE "parlor" WITH LOGIN
        - CREATE ROLE "parlor_app" WITH LOGIN
        - CREATE DATABASE "parlor" OWNER "parlor"
        - REVOKE ALL ON DATABASE "parlor" FROM PUBLIC
        - GRANT CONNECT, TEMPORARY ON DATABASE "parlor" TO "parlor"
        - GRANT CONNECT, TEMPORARY ON DATABASE "parlor" TO "parlor_app"
        - ALTER ROLE "parlor" CONNECTION LIMIT 10
        - ALTER ROLE "parlor" SET statement_timeout = '15000ms'
        - ALTER ROLE "parlor" SET idle_in_transaction_session_timeout = '30000ms'
        - ALTER ROLE "parlor_app" SET statement_timeout = '15000ms'
        - ALTER ROLE "parlor_app" SET idle_in_transaction_session_timeout = '30000ms'
        - CREATE ROLE "billing" WITH LOGIN
        - CREATE ROLE "billing_app" WITH LOGIN
        - CREATE DATABASE "billing" OWNER "billing"
        - REVOKE ALL ON DATABASE "billing" FROM PUBLIC
        - GRANT CONNECT, TEMPORARY ON DATABASE "billing" TO "billing"
        - GRANT CONNECT, TEMPORARY ON DATABASE "billing" TO "billing_app"
        - ALTER ROLE "billing" CONNECTION LIMIT 10
        - ALTER ROLE "billing" SET statement_timeout = '15000ms'
        - ALTER ROLE "billing" SET idle_in_transaction_session_timeout = '30000ms'
        - ALTER ROLE "billing_app" SET statement_timeout = '15000ms'
        - ALTER ROLE "billing_app" SET idle_in_transaction_session_timeout = '30000ms'
  managed:
    roles:
      - name: identity
        ensure: present
        login: true
        inRoles:
          - identity_app
        passwordSecret:
          name: postgres-role-identity
      - name: identity_app
        ensure: present
        login: true
        passwordSecret:
          name: postgres-role-identity-app
      - name: gateway
        ensure: present
        login: true
        inRoles:
          - gateway_app
        passwordSecret:
          name: postgres-role-gateway
      - name: gateway_app
        ensure: present
        login: true
        passwordSecret:
          name: postgres-role-gateway-app
      - name: courier
        ensure: present
        login: true
        inRoles:
          - courier_app
        passwordSecret:
          name: postgres-role-courier
      - name: courier_app
        ensure: present
        login: true
        passwordSecret:
          name: postgres-role-courier-app
      - name: parlor
        ensure: present
        login: true
        inRoles:
          - parlor_app
        passwordSecret:
          name: postgres-role-parlor
      - name: parlor_app
        ensure: present
        login: true
        passwordSecret:
          name: postgres-role-parlor-app
      - name: billing
        ensure: present
        login: true
        inRoles:
          - billing_app
        passwordSecret:
          name: postgres-role-billing
      - name: billing_app
        ensure: present
        login: true
        passwordSecret:
          name: postgres-role-billing-app
