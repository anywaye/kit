---
# kit gating itself, with proportional feedback per change.
#
# THE SHAPE. `route` classifies the change (tests/route.sh: pure bash, no
# venv, no gate) into one of four routes. Exactly one of the four proving
# jobs runs; `gate` — the stable required check — passes iff the selected
# route's job passed, and prints which checks ran and which did not.
#
#   ROUTE=docs     prose only            -> `docs`: git diff --check, nothing else
#   ROUTE=tier     templates/tier/**     -> `focused-tier`: family syntax proof
#   ROUTE=publish  templates/publish/**  -> `focused-publish`: family proof
#   ROUTE=full     everything else       -> `full`: the reusable workflow below,
#                                           which runs `bash tests/validate.sh`
#                                           with no flags (the release proof)
#
# Empty/uncomputable diffs, unknown paths, mixed families, workflows, tests,
# and every non-PR event (push, schedule, workflow_dispatch) are all `full`:
# merge-queue, scheduled and manual runs are the release proof and are never
# narrowed. The weekly schedule below keeps that proof green on a quiet tree.
#
# WHAT THIS FILE DOES NOT DO. It does not change
# `.github/workflows/ci.reusable.yml` — that file is a public standard other
# repositories may call, so its inputs and behavior are frozen by this packet.
# All routing lives here, in kit-owned local jobs. Service repositories are
# independent: calling kit's reusable workflows is optional and versioned,
# never a condition for a service repo to build.
#
# REQUIRED STATUS. `gate` is the required check and always runs. The proving
# jobs are conditional, so branch protection must require only `ci / gate` —
# never the conditional jobs, which are legitimately skipped on every run
# that does not take their route.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  # A caller that adds an input this file does not pass still runs; nothing here
  # gates on a path that may stop existing. Kept explicit so the trigger list is
  # readable rather than inferred.
  workflow_dispatch:
  # The release proof, on a schedule: the full gate with no flags, on the
  # tree as it stands, whether or not anyone pushed that week.
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The classifier. Always runs; its only output is the route. No Python, no
  # venv, no gate — tests/route.sh takes argv and prints one ROUTE= line, and
  # tests/route_test.sh (run inside the full gate) proves every class without
  # ever launching the gate itself.
  route:
    name: route
    runs-on: ubuntu-latest
    # Checkout (full depth) and one `git diff`: seconds of work. A 10-minute
    # ceiling bounds billed minutes if the runner wedges — it does not bound
    # the classifier, which never launches the gate (tests/route.sh).
    timeout-minutes: 10
    outputs:
      route: ${{ steps.classify.outputs.route }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: classify
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "event '${{ github.event_name }}' is the release proof; ROUTE=full"
            echo "route=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="origin/${{ github.base_ref }}"
          if ! git diff --name-only "$base"...HEAD > /tmp/changed.txt; then
            echo "uncomputable diff against $base; failing closed to ROUTE=full"
            echo "route=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Empty diff (or one xargs would not run for) fails closed: route.sh
          # with no paths is ROUTE=full, and it must actually be invoked.
          if ! grep -q '[^[:space:]]' /tmp/changed.txt; then
            echo "empty changed-path list; failing closed to ROUTE=full"
            echo "route=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tr '\n' '\0' < /tmp/changed.txt | xargs -0 bash tests/route.sh --event pull_request -- | tee /tmp/route.txt
          echo "route=$(sed 's/^ROUTE=//' /tmp/route.txt)" >> "$GITHUB_OUTPUT"

  # Prose only. `git diff --check` (whitespace errors) and nothing else. No
  # venv, no tests/validate.sh. A green docs run is NOT a platform-test pass
  # and the gate verdict below says exactly that.
  docs:
    name: docs
    needs: route
    if: ${{ needs.route.outputs.route == 'docs' }}
    runs-on: ubuntu-latest
    # Prose only: checkout, then `git diff --check`. Seconds; 10 bounds a hang.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: whitespace check
        run: |
          set -euo pipefail
          git diff --check "origin/${{ github.base_ref }}"...HEAD
          echo "docs-only; platform checks not run"

  # Tier family only. The family syntax proof; unrelated checks do not run.
  focused-tier:
    name: focused-tier
    needs: route
    if: ${{ needs.route.outputs.route == 'tier' }}
    runs-on: ubuntu-latest
    # The tier family syntax proof (templates/tier fixtures), not a full gate
    # run; 15 covers a cold checkout with room to spare.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: tier focused proof
        run: bash tests/focused_tier.sh

  # Publish family only. Family syntax plus the gate's exact chart-publish
  # check; unrelated checks do not run.
  focused-publish:
    name: focused-publish
    needs: route
    if: ${{ needs.route.outputs.route == 'publish' }}
    runs-on: ubuntu-latest
    # tests/focused_publish.sh: two YAML parses plus the chart-publish and
    # publish-seam checkers (each with its own controls). 20 is generous for
    # a script the gate itself runs in ~a minute.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: publish focused proof
        run: bash tests/focused_publish.sh

  # Everything else: the full release proof, unchanged. The reusable workflow
  # is called exactly as before (language: none runs tests/validate.sh with
  # no flags); this packet adds no input and changes no behavior there.
  full:
    name: full
    needs: route
    if: ${{ needs.route.outputs.route == 'full' }}
    # NO `timeout-minutes` HERE, AND IT IS NOT AN OMISSION. GitHub's grammar
    # for a job that calls a reusable workflow permits only
    # name/uses/with/secrets/needs/if/permissions (verified against actionlint,
    # which reports "timeout-minutes is not available" on this very job). The
    # 360-minute default a caller cannot override is exactly why the bound
    # lives ONE LEVEL DOWN, in the callee: every job in ci.reusable.yml carries
    # its own ceiling, so this waiting job ends when the bounded `none` job it
    # calls does. `tests/workflow_timeouts_check.sh` enforces both halves —
    # every runs-on job bounded, and no uses job carrying the illegal key.
    uses: ./.github/workflows/ci.reusable.yml
    with:
      language: none
      working-dir: .

  # The stable required check. Always runs; passes iff the selected route's
  # proving job passed. Its log is the routing record: which checks ran and
  # which did not, in exact lines.
  gate:
    name: gate
    needs: [route, docs, focused-tier, focused-publish, full]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    # A `case` over the needs' results and three echo lines. 5 is ample and
    # still bounds a stuck runner.
    timeout-minutes: 5
    steps:
      - name: routing verdict
        run: |
          set -euo pipefail
          route='${{ needs.route.outputs.route }}'
          case "$route" in
            docs)
              verdict='${{ needs.docs.result }}'
              echo "ROUTE=docs — ran: git diff --check. NOT RUN: platform checks (telemetry, observability, lint, tenancy, substrate, chart publish, all families). docs-only is not a platform-test pass."
              ;;
            tier)
              verdict='${{ needs.focused-tier.result }}'
              echo "ROUTE=tier — ran: templates/tier focused proof (family syntax). NOT RUN: telemetry, observability, lint, tenancy, substrate, chart publish, every other family. Focused proof only, not a platform-test pass."
              ;;
            publish)
              verdict='${{ needs.focused-publish.result }}'
              echo "ROUTE=publish — ran: templates/publish focused proof (family syntax + chart publish check). NOT RUN: tier, telemetry, observability, lint, tenancy, substrate, every other check. Focused proof only, not a platform-test pass."
              ;;
            full)
              verdict='${{ needs.full.result }}'
              echo "ROUTE=full — ran: bash tests/validate.sh with no flags (the full release proof). Nothing omitted."
              ;;
            *)
              echo "ROUTE=<unknown: '$route'> — the route job did not produce a route; failing closed."
              exit 1
              ;;
          esac
          if [ "$verdict" = "success" ]; then
            echo "gate: ROUTE=$route proved by its job ($verdict)."
          else
            echo "gate: ROUTE=$route job result was '$verdict'; failing."
            exit 1
          fi
