---
# kit — the publish path every cafaye service repo runs, both halves in one call.
#
# Consumers do not copy this file; they call it, exactly as they call
# `.github/workflows/ci.reusable.yml`:
#
#   # .github/workflows/publish.yml
#   name: publish
#   on:
#     push:
#       branches: [master]
#   permissions:
#     contents: read
#     packages: write          # REQUIRED, and the caller's to grant — see below
#   concurrency:
#     group: ${{ github.workflow }}-${{ github.ref }}
#     cancel-in-progress: true
#   jobs:
#     publish:
#       uses: cafaye/kit/.github/workflows/publish.reusable.yml@master
#       with:
#         push: true
#
# WHY ONE CALLER FOR TWO ARTIFACTS. A service publishes two things — the image
# `config/deploy.yml` deploys and the chart the Argo CD `Application` pulls —
# and two separate caller files would be two places to remember, two
# concurrency groups to keep apart, and two `packages: write` grants to forget.
# The composition lives here so a service's `publish.yml` is one `uses:` and the
# decision "what does a push publish" is made once, in kit.
#
# A REUSABLE WORKFLOW CALLING A REUSABLE WORKFLOW. GitHub allows a
# `workflow_call` workflow to call another, and that is what makes "one caller,
# two artifacts" possible: each half keeps its own file, its own header and its
# own pin, and this file only threads `push` through. The alternative — one
# workflow with the image steps and the chart steps inlined — would be a second
# copy of both, which is the drift kit exists to prevent.
#
# PERMISSIONS, AND THE CEILING THAT IS NOT A GRANT. This file declares
# `contents: read` + `packages: write` at the top level, and each called
# workflow declares its own job-level ceiling. A reusable workflow can request a
# permission but cannot grant itself one, and GitHub's rule for a chain of
# reusable workflows is that permissions can only be maintained or reduced,
# never elevated: the effective permission at each level is the caller's grant
# intersected with that level's declaration. This file therefore declares the
# FULL set it needs — not a subset — so the nested image and chart jobs keep
# `packages: write` all the way down. A caller that omits `packages: write`
# gets read-only and a 401 at the push that reads like a wrong password rather
# than like a missing grant — which is why the example above shows the
# permission on the caller.
#
# THE THREE SEAMS, AND WHY EVERY END LIVES IN KIT.
#   1. The registry string. `chart.reusable.yml` pushes to a registry; every
#      Argo CD Application in `templates/substrate/manifests/applications/`
#      pulls from `oci://ghcr.io/cafaye/charts`. Both files are in kit, which is
#      what makes this provable in this repository's own gate — the check
#      compares the workflow's default registry against every Application's
#      `source.repoURL` and fails on a disagreement.
#   2. The chart version. Each Application pins `targetRevision: 0.1.0`, and a
#      generated chart's `Chart.yaml` carries `version: 0.1.0`. The OCI tag of a
#      Helm chart is its `version`, so the push tag and the pull
#      `targetRevision` must be the chart's version — not a git sha, not
#      `latest`. A chart pushed as `0.1.1` while the Application says `0.1.0`
#      is a service that never deploys, and Argo reports no error: it just
#      never finds the artifact.
#   3. The image tag. The chart's `values.yaml` pins `image.tag` to the chart's
#      own `appVersion` — a value a release commits, never `latest` — so the
#      publish that serves that chart must produce an image tag by that exact
#      name, or the box asks the registry for a tag nothing published and sits
#      in `ImagePullBackOff` with nothing in the failure naming this workflow.
#      `image.reusable.yml` publishes that tag when this file gives it the
#      value, and this file is the place that reads it: the composer is the
#      only party that knows `chart-dir`, so it reads `Chart.yaml`'s
#      `appVersion` in a resolved job below and passes it down. No second
#      place holds the number, and a service with no chart still composes —
#      the read resolves to empty and the image keeps its sha/branch/latest
#      three. `sha-<40>` is untouched.
name: publish

on:
  workflow_call:
    inputs:
      push:
        description: >-
          Publish both artifacts. FALSE by default and it stays that way: a
          caller that wants a publish says so at the call site, and a workflow
          nobody opted into cannot write to the registry.
        required: false
        type: boolean
        default: false
      registry:
        description: >-
          The OCI registry charts are pushed to, including the oci:// scheme.
          The default is the exact string every Argo CD Application carries as
          source.repoURL. Images are always pushed to ghcr.io — the image
          workflow derives the name from github.repository and takes no
          registry input.
        required: false
        type: string
        default: 'oci://ghcr.io/cafaye/charts'
      chart-dir:
        description: >-
          The directory holding Chart.yaml, relative to the repository root.
          'chart/' is where `caf gen chart` writes.
        required: false
        type: string
        default: 'chart/'

permissions:
  contents: read
  packages: write

# THE CONCURRENCY GROUP, AND WHY IT BEGINS WITH `kit-`. A reusable workflow's
# group is namespaced so it can never collide with a CALLER's: the caller
# declares `group: ${{ github.workflow }}-${{ github.ref }}` and this file
# declares the same string prefixed, which is the rule `ci.reusable.yml` states
# at length — a caller and callee sharing one group is a job that is refused
# before it starts, producing no check-run and no log line. `cancel-in-progress`
# is on because a second push makes the first run's artifacts irrelevant: the
# image and the chart it would publish are superseded by the newer commit.
concurrency:
  group: kit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # THE READ, AND WHY IT IS A JOB OF ITS OWN. A job whose whole body is
  # `uses:` cannot carry steps — GitHub permits only `name/uses/with/
  # secrets/strategy/needs/if/concurrency/permissions/cache-mode` on it —
  # so the Chart.yaml read is a small runner job whose OUTPUT feeds the
  # composed image call. `needs:` is one of the few keywords a `uses:` job
  # may carry, which is what makes the hand-off legal.
  #
  # IT REFUSES A CHART WITH NO appVersion, AND ONLY THAT. A chart whose
  # Chart.yaml carries no appVersion is a chart whose values pin a tag
  # nobody can produce — the exact defect this file exists to close — so
  # the read fails and names the field. A MISSING chart is different and
  # is not a failure: there is nothing to publish a chart for, the image
  # half still runs (this job succeeded, output empty), and the chart job
  # below still refuses loudly on its own, exactly as it did before this
  # job existed. An image-only service therefore does not break, and a
  # mis-located chart does not pass silently.
  resolve:
    name: resolve (read the chart's appVersion)
    runs-on: ubuntu-latest
    outputs:
      app-version: ${{ steps.read.outputs.app-version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: read the chart's appVersion
        id: read
        env:
          CHART_DIR: ${{ inputs.chart-dir }}
        run: |
          set -euo pipefail
          chart="$CHART_DIR/Chart.yaml"
          if [ ! -f "$chart" ]; then
            {
              echo "### no chart at \`$chart\`"
              echo
              echo "The image publishes with its sha/branch/latest tags only."
              echo "The chart job below still requires a Chart.yaml at that"
              echo "path — the same refusal it made before this job existed."
            } >>"$GITHUB_STEP_SUMMARY"
            echo "publish: no Chart.yaml at $chart — no image version tag"
            echo "app-version=" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # `|| true`: a grep with no match exits 1, and under set -e that
          # would take the step down before the empty check can say which
          # field is missing. The empty check is the real refusal.
          app="$(grep -m1 '^appVersion:' "$chart" | sed 's/^appVersion:[[:space:]]*//' | tr -d "\"'" || true)"
          if [ -z "$app" ]; then
            echo "publish: $chart has no appVersion — its values.yaml pins an image tag this workflow" >&2
            echo "could never produce: there is no appVersion to read the tag from" >&2
            exit 1
          fi
          echo "publish: chart appVersion $app — the image gets that tag so the chart's values.yaml resolves"
          echo "app-version=$app" >>"$GITHUB_OUTPUT"

  # THE PATHS ARE ROOT-RELATIVE, AND THAT IS GITHUB'S GRAMMAR, NOT A STYLE
  # CHOICE. GitHub resolves a local reusable workflow relative to the
  # repository root as `./.github/workflows/<file>`; anything else — a
  # repo-relative path that omits `.github/workflows`, or a subdirectory —
  # cannot be resolved, and GitHub rejects the run at workflow-resolution
  # time. That rejection is the silent failure this file once shipped: the
  # four services' publish runs failed on EVERY push since they were
  # created with `referenced_workflows: []` — no jobs, no check-runs, no
  # log line, because nothing ever started. Verified against GitHub's
  # "Reuse workflows" how-to, whose local syntax is exactly
  # `./.github/workflows/{filename}` (and `$/...` for GHEC), and measured
  # on this tree with `actionlint`, which resolves the same path and
  # reports `could not read reusable workflow file` on any other spelling.
  image:
    name: image
    needs: resolve
    uses: ./.github/workflows/image.reusable.yml
    with:
      push: ${{ inputs.push }}
      # Derived above, never a knob. A caller that could pass this would
      # be a caller that could publish a chart pinning a tag nothing made.
      app-version: ${{ needs.resolve.outputs.app-version }}
  chart:
    name: chart
    uses: ./.github/workflows/chart.reusable.yml
    with:
      push: ${{ inputs.push }}
      registry: ${{ inputs.registry }}
      chart-dir: ${{ inputs.chart-dir }}
