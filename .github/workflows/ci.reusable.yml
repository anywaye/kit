---
# kit — the CI path every cafaye service repo runs.
#
# Consumers do not copy this file; they call it (repo: github.com/cafaye/<svc>):
#
#   # .github/workflows/ci.yml
#   name: ci
#   on: [push, pull_request]
#   permissions:
#     contents: read
#   jobs:
#     ci:
#       uses: cafaye/kit/.github/workflows/ci.reusable.yml@master
#       with:
#         language: go
#         working-dir: .
#
# If you also declare `concurrency`, your group must NOT begin with `kit-`. Every
# other spelling is yours. The whole fleet wrote
# `${{ github.workflow }}-${{ github.ref }}`, this file wrote the same string, and
# for four days the `uses:` job above produced no job, no check-run and no log in
# any repository — see the long comment on `concurrency` at the bottom of this
# file for the measurement.
#
# The `.github/workflows/` in that path is not decoration. GitHub resolves a
# reusable workflow at `{owner}/{repo}/.github/workflows/{file}@{ref}` and
# documents that subdirectories of the workflows directory are not supported, so
# this file has no reachable path from anywhere else in the tree. It is also the
# only place a workflow may live at all if the repository that defines it is to
# call it with `uses: ./.github/workflows/ci.reusable.yml`.
#
# One job per language exists on purpose: six services, six toolchains, and a
# `language` x `version` matrix would multiply CI minutes the org cannot spend.
# Every job is gated on `inputs.language`, so exactly one runs per call.
#
# STRICTNESS NOTES (read before loosening anything)
#   - No job builds or pushes an image, and no job writes to the default branch.
#     Release work is a separate workflow so a red test can never publish.
#   - The coverage gate is a PLACEHOLDER (0) so adoption never blocks a repo on
#     day one, and it is an INPUT (coverage-fail-under) so a repo raises it in
#     its caller rather than forking this file. A gate left at 0 fails nothing.
#   - Action refs are floating major tags where the upstream publishes them and
#     exact tags where it does not (astral-sh/*). Dependabot upgrades are
#     one-line diffs; full-SHA pinning is a service repo's own choice.
#     zizmor disagrees about all of this and says so on every run; the
#     disagreement is recorded, not resolved, in DECISIONS.md under MD10.
#   - Every `actions/checkout` sets `persist-credentials: false`. No job in this
#     file pushes, so a token left on disk after a checkout is a credential that
#     outlives the job for no reason, and every job here runs `upload-artifact`
#     — which is the combination zizmor's `artipacked` audit exists to catch.
#   - Every step that can run offline does. Nothing here reaches a cafaye
#     service, so this workflow needs no secrets. The `secrets` job's scanner is
#     a static binary that reads a repository and matches regexes: it makes no
#     network call, which is why it is gitleaks and not trufflehog.
#   - The `secrets` job is the only job here with no opt-in, on purpose. It is
#     the one job that must not be something a repo has to remember to ask for.
name: ci
on:
  workflow_call:
    inputs:
      language:
        # THE LEGAL VALUES ARE IN THIS PROSE BECAUSE `workflow_call` HAS NO
        # `options` KEY, and saying so is cheaper than the two days it cost.
        #
        # This file carried an `options:` list here from 2026-09-30 until
        # kit-33. `options` is a `workflow_dispatch` input feature;
        # `workflow_call` inputs accept only `description`, `required`, `type`
        # and `default`. GitHub rejects the WHOLE FILE at parse time for an
        # unknown key, so the result was not "the language picker is missing" —
        # it was that no job in this file ever started, for any caller, in any
        # repository. Every service in the fleet calls this file, so the whole
        # fleet's CI was a zero-check-run failure for two days and the run
        # summary said only "This run likely failed because of a workflow file
        # issue."
        #
        # The list is still enforced, by a job rather than by a picker: see the
        # `language` job below, which fails on a value that is not one of the
        # eight. That is a STRONGER guarantee than the picker was, because an
        # unknown value used to skip all eight language jobs and leave a green
        # run that had tested nothing.
        description: >-
          Toolchain to build, lint, and test. One job runs; the rest skip. Use
          'none' for a repository with no service manifest at all. One of:
          'go', 'ruby', 'elixir', 'python', 'node', 'bun', 'rust', 'none'.
          Anything else fails the `language` job rather than quietly running
          no toolchain at all.
        required: true
        type: string
      # The kit ref the LINT CONFIGS are read from, as opposed to the ref this
      # workflow file itself was fetched at.
      #
      # These are two different things and the difference is the whole reason
      # this input exists. `uses: cafaye/kit/.github/workflows/ci.reusable.yml@X`
      # pins the WORKFLOW at X. GitHub does not hand a called workflow its own
      # ref — `github.workflow_ref` inside a reusable workflow is the CALLER's
      # workflow, and `GITHUB_ACTION_PATH` is documented as composite-action-only
      # — so the configs have to be fetched by a name, and the name has to be an
      # input. Defaulting it to `master` matches every caller in the fleet,
      # which is written `uses: cafaye/kit/...@master`.
      #
      # THIS PARAGRAPH WAS RIGHT AND FOUR `run:` BODIES CONTRADICTED IT. The
      # `secrets`, `zizmor` and `telemetry` jobs all reached into kit's tree with
      # `${GITHUB_ACTION_PATH}` — the variable this comment names as unavailable —
      # and did so under `set -euo pipefail`, where an unset variable is not an
      # empty path but a fatal on the step's first line. Measured in `cafaye/site`
      # run 37236386666 and `cafaye/parlor` run 37230458669: the `secrets` job
      # failed four days after the concurrency fix in ad3e320 released the jobs
      # that had never run. The reasoning above was applied to the lint configs
      # and not to these five lines, which is the whole of it: a rule written
      # down once, obeyed in one place, and contradicted in another by nobody
      # reading the other place. `kit_gate_tree_check` in tests/validate.sh now
      # asserts the variable appears in no `run:` body in this file, so the
      # paragraph and the code cannot disagree again.
      #
      # Raise it to a SHA when you pin the `uses:` line to one. It is NOT a
      # second, independent pin: a caller who pins the workflow to a SHA and
      # leaves this at `master` gets that SHA's workflow with today's lint
      # policy, which is a real and specific failure. Nothing detects it
      # automatically, so it is documented here and in README.md rather than
      # pretended to be automatic.
      kit-lint-ref:
        description: >-
          Git ref to read kit's lint configs from, e.g. 'master' or a commit
          SHA. Pin it to the SAME ref you pinned the `uses:` line to. Changing
          it changes a service's lint policy without touching the service.
        required: false
        type: string
        default: 'master'
      # Extra arguments appended to the linter's own command line, after kit's.
      #
      # THIS IS THE DEVIATION SEAM, and its narrowness is the point:
      #
      #   - It comes LAST, so a service can add flags (`-E gosec`) and cannot
      #     remove the `--config` that precedes it. Anything appended here is an
      #     addition to kit's invocation, not a replacement of it.
      #   - It is a string, not a path, so there is no service-side config file
      #     for a linter to read and therefore none to rot. The failure this
      #     packet ends is a file nobody propagates; a seam that reintroduces
      #     the file reinstates the failure.
      #   - It may not be used to turn kit's config off, to lint a diff instead
      #     of the tree, or to stop a finding from failing the build. The
      #     `lint-args guard` step in every lint job refuses those flags, and it
      #     is in the WORKFLOW rather than in kit's gate because `lint-args` is
      #     the caller's value and kit has never got it. The guard's token list
      #     is asserted against a copy in `tests/validate.sh`, so shortening it is
      #     a red build rather than a quiet widening of this input.
      #
      # What it is FOR: a repository that needs a stricter setting than the
      # fleet's, and nothing else. If a flag is wanted often enough to be
      # common, it belongs in lint/ and every service gets it for free.
      lint-args:
        description: >-
          Extra arguments appended to the linter's command line, after kit's
          own flags, for a service that needs a STRICTER setting than the
          fleet's. May not change which config is read, what is linted, or
          whether a finding fails the build: the `lint-args guard` step that
          runs before every linter refuses those flags, and kit's gate fails
          if that step is ever deleted, moved after the linter, or shortened.
          A value here is a place a per-service lint policy can rot, so prefer
          a change in kit, where every service gets it free.
        required: false
        type: string
        default: ''
      # Descriptions are folded, not quoted: a long description that is reflowed
      # to fit line-length is unreadable, and Actions has no width limit on
      # `description`. Our own lint/yamllint.yml caps source lines at 120.
      working-dir:
        description: >-
          Directory holding the service manifest: go.mod, Gemfile, mix.exs,
          pyproject.toml, package.json, or Cargo.toml.
        required: false
        type: string
        default: '.'
      versions:
        description: >-
          Optional JSON toolchain pin, e.g. {"go":"1.24.1","python":"3.13"}.
          Unset keys use the toolchain default.
        required: false
        type: string
        default: '{}'
      coverage-fail-under:
        description: >-
          Minimum coverage percent, 0-100. Defaults to 0 so adoption never
          blocks a repo on day one; raise it in your caller. A gate that can
          never fail is not a gate, so do not leave this at 0.
        required: false
        type: string
        default: '0'
      # The tier a service DEMANDS, by gate-variable name: `REQUIRED_DB`, not
      # `db`. Demanded rather than inferred, on purpose.
      #
      # Inference is the failure this replaces. Identity derives its database
      # tier by grepping the tree for `dbtest.Pool|Schema|EnvVar|TEST_DATABASE_URL`,
      # and that fails OPEN: a test that reaches Postgres through a helper two
      # files away, or through a fixture, does not match, so its package never
      # enters the required list and the run is never required to contain it.
      # The test is written. It is not gated. Nobody finds out.
      #
      # So the caller NAMES the variable and this workflow exports it as `1` on
      # the test step of every language job, which is gateway's
      # GATEWAY_REDIS_REQUIRED pattern: it fails at tier-invocation time, before a
      # report exists, so nothing downstream can misreport the run.
      #
      # Setting it commits the repo to the normalised result format
      # (templates/tier/README.md): the `tier demand` step below reads a `ran`
      # line out of the run log and fails NAMING THIS VARIABLE when the tier ran
      # zero tests. A gate variable that is set, and a tier that ran nothing, is
      # a green build that verified nothing.
      #
      # A string, empty by default. Adoption cannot turn a green repo red,
      # because an unset variable demands nothing and the `tier demand` step
      # exits 0 without reading a log.
      required-tier:
        description: >-
          Gate variable that demands a tier, e.g. 'REQUIRED_DB'. Exported as
          '1' on the test step, and a tier that then runs zero tests fails the
          build naming this variable. Empty (the default) demands nothing.
          Adopting this also commits the repo to the normalised result format.
        required: false
        type: string
        default: ''
      # Opt-in by construction. A kit change that breaks every consumer's CI is
      # a kit change that does not ship, so a new job cannot start running in
      # 13 repos the day it lands — the repo has to ask for it by name.
      #
      # A string, not a boolean: `inputs.telemetry == 'true'` reads the way a
      # caller writes it, and GitHub coerces the bare word `false` to a boolean
      # in some positions, which makes `if: inputs.telemetry` a trap. Compare
      # to the string and there is no coercion to reason about.
      telemetry:
        description: >-
          'Run the W3C traceparent conformance job as well: "true" or "false".
          Off by default so adopting kit never turns a green repo red. Turn it
          on in a repo that has copied templates/otel/<lang>/ into its tree.'
        required: false
        type: string
        default: 'false'
      # The GitHub Actions security audit, opt-in for the reason its header
      # gives: it reads the adopting repo's workflows, which kit did not write.
      # A string for the same reason `telemetry` is one, and for the same trap.
      zizmor:
        description: >-
          'Run the zizmor GitHub Actions security audit as well: "true" or
          "false". Off by default so a repo adopts kit without inheriting a red
          build for a finding in a workflow kit did not write. Turn it on once
          your own workflows are clean; every finding but unpinned-uses is
          fatal, and unpinned-uses is recorded, never baselined.'
        required: false
        type: string
        default: 'false'
permissions:
  contents: read

# ===========================================================================
# THE `kit-` PREFIX ON THE CONCURRENCY GROUP IS LOAD-BEARING, and it is here
# because the fleet ran half a CI for four days without anybody noticing.
#
# WHAT WENT WRONG, MEASURED. Every caller in the fleet declares
#
#     concurrency:
#       group: ${{ github.workflow }}-${{ github.ref }}
#       cancel-in-progress: true
#
# and this file declared the identical block from the commit that first
# published it (8ebf4db, 2026-09-30). Inside a reusable workflow `github.workflow`
# is the CALLER's workflow name and `github.ref` is the caller's ref — GitHub does
# not re-scope either to the called file — so caller and callee computed the same
# string, `ci-refs/heads/master`, and asked for the same lock. The caller holds it.
# The called workflow's request is refused, or cancels the holder, and the `uses:`
# job produces NO job, NO check-run and NO log line.
#
# The signature is the reason it survived. In cafaye/parlor, run 37230458669:
#
#     $ gh api repos/cafaye/parlor/actions/runs/37230458669/jobs \
#         --jq '.jobs[] | "\(.name) | \(.status)/\(.conclusion)"'
#     typecheck + build | completed/success
#     bin/prime         | completed/success
#
#     $ gh api repos/cafaye/parlor/actions/runs/37230458669 --jq '.conclusion'
#     failure
#
# Both jobs green, the run red, `gh run view --log-failed` empty — because no step
# failed, and the one job that mattered was never created. The `language` gate
# below is UNCONDITIONAL, so its absence is the unambiguous signal: no caller in
# the fleet has ever produced a job ending `/ language`. Lint, the frozen install
# and the coverage step live behind it. `bin/prime` ran the suite, so tests were
# not entirely absent — but no repository in the fleet has run kit's linter in CI.
#
# Reproduced end to end against this exact file, byte-identical to master
# (git blob f91df58), with one variable changed at a time:
#
#   caller group `${{ github.workflow }}-${{ github.ref }}`   ->  1 job, callee gone, run failure
#   caller group `caller-${{ github.workflow }}-${{ ... }}`   -> 13 jobs, callee present
#
# So the fix is HERE and not in thirteen callers, which is also the only fix that
# reaches a repository nobody remembers exists. It repairs kit's own CI as a side
# effect: `ci.yml`'s group is `ci-<ref>` and this one is now `kit-ci-<ref>`.
#
# AND THE RENAME COSTS NOTHING. A second push must still cancel the first one's
# called jobs, and that was measured rather than assumed, because dropping this
# block would have been the other way to stop a collision and it is the way that
# trades a missing job for an unbounded pile of superseded runs:
#
#   push A -> called job in_progress; push B -> A's called job `cancelled`,
#   run A `cancelled`.
#
# The caller's cancellation propagates into the called workflow, so kit's block is
# a second layer rather than the only one, and renaming the group leaves it working.
#
# THE RULE FOR A CALLER, which is the half this file cannot enforce: if you declare
# `concurrency`, your group must NOT begin with `kit-`. Every other spelling is
# yours. The `no caller and callee share a concurrency group` check in
# tests/validate.sh reads the callers beside this repository and fails on a
# collision in either direction.
# ===========================================================================
concurrency:
  group: kit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholder (0) so adoption never blocks a repo on day one. A service repo
  # raises it with the `coverage-fail-under` input — a value, not a fork of this
  # file. Set in env so all six jobs read one number.
  COVERAGE_FAIL_UNDER: ${{ inputs.coverage-fail-under }}
  # Deterministic builds: do not stamp VCS info into Go binaries.
  GOFLAGS: '-buildvcs=false'
  # The demanded gate variable's NAME, not its value. It is exported as `1` on
  # each test step rather than set here, because an env block cannot have a key
  # that is a variable — and setting it here would export it to every step in
  # the job, including the ones that are not running the tier.
  REQUIRED_TIER: ${{ inputs.required-tier }}
  # Where kit's own tree lands inside the service being built. `.kit` and NOT
  # a path beside the repository, and the reason is measured rather than
  # stylistic: ESLint's flat config is an ES module that does
  # `import js from '@eslint/js'`, and node resolves that import from the
  # CONFIG FILE's own directory upward. A config sitting beside the repository
  # finds no `@eslint/js` and the run dies with ERR_MODULE_NOT_FOUND — a red
  # build that has linted nothing. Inside the tree it walks up into the
  # service's own node_modules and resolves. golangci-lint and rubocop accept
  # the same path happily, so one location serves all three.
  KIT_LINT_DIR: ${{ inputs.working-dir }}/.kit
  # The linter's own extra arguments, from the seam. Empty by default, which is
  # the fleet's current state: every service lints with kit's policy and
  # nothing else.
  KIT_LINT_ARGS: ${{ inputs.lint-args }}

# ===========================================================================
# THE `tier demand` STEP — one body, present in every language job, IDENTICAL
# in all of them.
#
# GitHub reusable workflows have no way to share a step, so this block is
# duplicated. That is a deliberate trade: kit's rule is that callers override
# and never fork, and six hand-maintained copies of a policy block is exactly
# the drift that rule exists to prevent — so the copies are not left to drift.
# `tier_demand_check` in tests/validate.sh asserts the step exists in every
# language job AND that all six bodies are byte-identical. Change one, change
# all six, or the gate goes red.
# ===========================================================================

jobs:
  # -------------------------------------------------------- the language gate
  # THIS JOB IS THE REPLACEMENT FOR A DROPDOWN, and it is a stronger guarantee
  # than the dropdown was.
  #
  # `workflow_call` inputs have no `options` key. That is not a limitation to
  # work around in the UI, it is the reason a wrong value could previously pass
  # SILENTLY: every language job is gated on `inputs.language == '<name>'`, so a
  # caller who wrote `language: golang` — or `Go`, or `nodejs`, or a trailing
  # space — matched no job, ran no toolchain, and got a run whose only steps
  # were telemetry, secrets and zizmor. Those three can be green on a
  # repository that has never been compiled. The header above says "Every job
  # is gated on `inputs.language`, so exactly one runs per call", and nothing
  # verified that one did.
  #
  # It has no `if:`, deliberately. Every other job in this file is conditional
  # on the very value this one checks, so gating this one on it would mean the
  # check runs exactly when it is not needed and is skipped exactly when it is.
  #
  # It is a required check, not an advisory one, and it is deliberately the
  # FIRST job: a caller who misspells their toolchain learns it in seconds
  # rather than after waiting out a full suite that never ran.
  language:
    name: language
    runs-on: ubuntu-latest
    steps:
      - name: the language is one this file has a job for
        # `${{ }}` is deliberately NOT interpolated into this body. zizmor's
        # `template-injection` audit is right that it should not be, and the
        # idiomatic fix is to pass it through `env:` and read the variable.
        env:
          REQUESTED: ${{ inputs.language }}
        run: |
          set -euo pipefail
          case "$REQUESTED" in
            go|ruby|elixir|python|node|bun|rust|none)
              echo "language: $REQUESTED"
              ;;
            '')
              echo "::error::no language was passed. This input is required; see" >&2
              echo "::error::the workflow_call block at the top of this file." >&2
              exit 1
              ;;
            *)
              echo "::error::language '$REQUESTED' is not one this workflow has a" >&2
              echo "::error::job for. Every job below is gated on" >&2
              echo "::error::inputs.language == '<name>', so a value that matches" >&2
              echo "::error::none of them runs NO toolchain and leaves a run that" >&2
              echo "::error::looks green. One of:" >&2
              echo "::error::  go  ruby  elixir  python  node  bun  rust  none" >&2
              echo "::error::'none' is for a repository with no service manifest." >&2
              exit 1
              ;;
          esac

  # ----------------------------------------------------- configuration-only
  # `language: none` — a repository with no service manifest. No go.mod, no
  # Gemfile, no pyproject.toml: the seven jobs above each open with a manifest
  # they cannot find, and a caller passing one of them gets a red build on a
  # repository that has nothing to compile.
  #
  # It exists because of that, and because of a second, sharper reason: this is
  # kit, and the repository that defines the standard should be the first
  # repository held to it. Without it kit could not call its own workflow at
  # all — `uses: ./.github/workflows/ci.reusable.yml` still needs a `language`,
  # `language` is required, and every value in `options` named a toolchain this
  # repository does not have. The repository that ships the standard was
  # structurally excluded from using it.
  #
  # It runs the repository's own gate, `tests/validate.sh`, and FAILS when that
  # file is absent. A caller who asks for the configuration gate and ships no
  # gate has asked for a green checkmark on nothing, which is the same defect
  # as a coverage threshold left at 0. Deliberately strict, and the failure
  # message says which file is missing.
  none:
    name: none
    if: ${{ inputs.language == 'none' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: kit gate
        working-directory: ${{ inputs.working-dir }}
        # The gate bootstraps its own dependencies (PyYAML, yamllint, hadolint)
        # into a gitignored .venv/, so a runner with nothing installed runs
        # the same command a developer runs on a fresh clone. See the header of
        # tests/validate.sh.
        run: |
          set -euo pipefail
          if [ ! -f tests/validate.sh ]; then
            echo "::error::language 'none' runs this repository's own gate, and"
            echo "::error::tests/validate.sh does not exist. Either ship the gate,"
            echo "::error::or pass a real language."
            exit 1
          fi
          bash tests/validate.sh

  # ------------------------------------------------------------- compiled
  go:
    name: go
    if: ${{ inputs.language == 'go' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ fromJSON(inputs.versions).go || 'stable' }}
          cache-dependency-path: ${{ inputs.working-dir }}/go.sum
      - name: install
        working-directory: ${{ inputs.working-dir }}
        run: go mod download
      - name: build
        working-directory: ${{ inputs.working-dir }}
        run: go build ./...
      # Kit's own tree, INSIDE the service, for the lint config below. Sparse,
      # because the only thing read out of it is `lint/` and a full clone of
      # kit on every Go push is a cost paid for files nobody opens.
      #
      # `persist-credentials: false` so kit's checkout leaves no token in a
      # git config inside the tree a service's own later steps run in.
      - name: kit (lint config)
        uses: actions/checkout@v7
        with:
          repository: cafaye/kit
          ref: ${{ inputs.kit-lint-ref }}
          path: ${{ env.KIT_LINT_DIR }}
          sparse-checkout: lint
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # THE SEAM'S OWN GUARD, and it lives HERE rather than in kit's gate
      # because of a fact about the input: `lint-args` is set by the CALLER, and
      # kit never sees that value. A check in `tests/validate.sh` can assert the
      # input exists, is a string and defaults to empty — all of which it does —
      # and it can assert this step exists in three jobs and that the three
      # copies are byte-identical. It cannot check the value, because kit has
      # never got it. So the rule that makes the seam narrow has to run where
      # the value is: in the service.
      #
      # WHAT IT REFUSES, and the one sentence that is the whole policy: the seam
      # may make the lint STRICTER, and it may not change WHICH CONFIG IS READ,
      # WHAT IS LINTED, or WHETHER A FINDING FAILS THE BUILD. Every token below
      # is one of those three, and every one was read out of the linter's own
      # `--help` rather than remembered:
      #
      #   which config   --config / -c (rubocop) / --no-config (golangci-lint)
      #                  / --no-config-lookup (eslint) / --force-default-config
      #   what is linted --new, --new-from-rev, --new-from-patch,
      #                  --new-from-merge-base (a diff, not the tree)
      #   does it fail   --issues-exit-code (golangci-lint; `=0` is a linter that
      #                  cannot fail), --fail-level (rubocop), --quiet (eslint:
      #                  "report errors only", which is looser, not stricter),
      #                  --no-error-on-unmatched-pattern (an unmatched path is
      #                  green, so a renamed file is silently unlinted)
      #
      # `--auto-gen-config` and `--regenerate-todo` are here for a different
      # reason and it is the packet's own reason: both WRITE a config file into
      # the tree. A linter that generates its own config is the copy mechanism
      # arriving through the back door, and it would be a copy nobody reviews.
      #
      # The list is duplicated in `tests/validate.sh` and asserted against this
      # one, so shortening it here is a red build rather than a quiet widening
      # of the seam.
      - name: lint-args guard
        run: |
          set -euo pipefail
          # Empty is the fleet's state, and it is not a failure: every service
          # lints with kit's policy and nothing else.
          [ -n "${KIT_LINT_ARGS:-}" ] || exit 0
