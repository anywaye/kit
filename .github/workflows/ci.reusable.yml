          # command — tee — and a test step that reports tee's status is a gate
          # that can never fail.
          exit "${PIPESTATUS[0]}"
      - name: tier demand
        working-directory: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          # An empty REQUIRED_TIER is the default and demands nothing, so a repo
          # that has not adopted tiers is untouched. Exits before reading a log
          # that need not exist.
          [ -n "${REQUIRED_TIER:-}" ] || exit 0
          log="$RUNNER_TEMP/kit-tier.log"
          if [ ! -f "$log" ]; then
            echo "::error::$REQUIRED_TIER was set and there is no run log at $log." >&2
            echo "::error::A demanded tier with no log is a green build that" >&2
            echo "::error::verified nothing, whatever the test step printed." >&2
            exit 1
          fi
          # The one place the normalised format is read, and it reads only the
          # format kit owns — never a per-language report. A `ran` line is the
          # evidence that something executed; no `ran` line is a tier that ran
          # zero tests, and the failure NAMES THE VARIABLE so the fix is obvious
          # from the log alone.
          if ! grep -qE '^ran[[:space:]]' "$log"; then
            echo "::error::$REQUIRED_TIER was set and no 'ran <tier> <suite> <test>'" >&2
            echo "::error::line reached this log. A gate variable that is set and a" >&2
            echo "::error::tier that ran zero tests is a green build that verified" >&2
            echo "::error::nothing. See templates/tier/README.md." >&2
            exit 1
          fi
