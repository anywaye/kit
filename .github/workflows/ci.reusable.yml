            echo "::error::$REQUIRED_TIER was set and there is no run log at $log." >&2
            echo "::error::A demanded tier with no log is a green build that" >&2
            echo "::error::verified nothing, whatever the test step printed." >&2
            exit 1
          fi
          # The one place the normalised format is read, and it reads only the
          # format kit owns — never a per-language report. A `ran` line is the
          # evidence that something executed; no `ran` line is a tier that ran
          # zero tests, and the failure NAMES THE VARIABLE so the fix is obvious
          # from the log alone.
          if ! grep -qE '^ran[[:space:]]' "$log"; then
            echo "::error::$REQUIRED_TIER was set and no 'ran <tier> <suite> <test>'" >&2
            echo "::error::line reached this log. A gate variable that is set and a" >&2
            echo "::error::tier that ran zero tests is a green build that verified" >&2
            echo "::error::nothing. See templates/tier/README.md." >&2
            exit 1
          fi
      # coveralls is a hex dep the service repo declares; it exits nonzero
      # below the minimum, which is what makes this a gate and not a report.
      - name: coverage
        working-directory: ${{ inputs.working-dir }}
        run: mix coveralls --minimum-coverage "$COVERAGE_FAIL_UNDER"
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: coverage-elixir
          path: ${{ inputs.working-dir }}/cover
          if-no-files-found: ignore

  python:
    name: python
    if: ${{ inputs.language == 'python' }}
    runs-on: ubuntu-latest
    # `uv sync`, lint, the suite and coverage. 25 is ample for a fast
    # toolchain and bounds a hung test.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          working-directory: ${{ inputs.working-dir }}
          enable-cache: true
      # Only for the documented no-uv fallback; uv does not need it.
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ fromJSON(inputs.versions).python || '3.13' }}
      - name: install
        working-directory: ${{ inputs.working-dir }}
        run: |
          if command -v uv >/dev/null 2>&1; then uv sync --frozen; else pip install -e '.[dev]'; fi
      - name: lint
        uses: astral-sh/ruff-action@v4.1.0
        with:
          src: ${{ inputs.working-dir }}
      - name: test
        working-directory: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          # The demand, exported rather than inferred: a tier that cannot run
          # must fail here, at invocation time, rather than report as a pass.
          if [ -n "${REQUIRED_TIER:-}" ]; then export "$REQUIRED_TIER=1"; fi
          if command -v uv >/dev/null 2>&1; then
            uv run pytest --cov --cov-report=xml 2>&1 | tee "$RUNNER_TEMP/kit-tier.log"
          else
            pytest --cov --cov-report=xml 2>&1 | tee "$RUNNER_TEMP/kit-tier.log"
          fi
          # `pipefail` is on, so this step already exits with pytest's status.
          # The PIPESTATUS index is 0 either way, because both arms are a
          # pipeline and the `if` does not reset it.
          exit "${PIPESTATUS[0]}"
      - name: tier demand
        working-directory: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          # An empty REQUIRED_TIER is the default and demands nothing, so a repo
          # that has not adopted tiers is untouched. Exits before reading a log
          # that need not exist.
          [ -n "${REQUIRED_TIER:-}" ] || exit 0
          log="$RUNNER_TEMP/kit-tier.log"
          if [ ! -f "$log" ]; then
            echo "::error::$REQUIRED_TIER was set and there is no run log at $log." >&2
            echo "::error::A demanded tier with no log is a green build that" >&2
            echo "::error::verified nothing, whatever the test step printed." >&2
            exit 1
          fi
          # The one place the normalised format is read, and it reads only the
          # format kit owns — never a per-language report. A `ran` line is the
          # evidence that something executed; no `ran` line is a tier that ran
          # zero tests, and the failure NAMES THE VARIABLE so the fix is obvious
          # from the log alone.
          if ! grep -qE '^ran[[:space:]]' "$log"; then
            echo "::error::$REQUIRED_TIER was set and no 'ran <tier> <suite> <test>'" >&2
            echo "::error::line reached this log. A gate variable that is set and a" >&2
            echo "::error::tier that ran zero tests is a green build that verified" >&2
            echo "::error::nothing. See templates/tier/README.md." >&2
            exit 1
          fi
      - name: coverage
        working-directory: ${{ inputs.working-dir }}
        run: |
          if command -v uv >/dev/null 2>&1; then uv run coverage report --fail-under="$COVERAGE_FAIL_UNDER"; fi
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: coverage-python
          path: ${{ inputs.working-dir }}/coverage.xml
          if-no-files-found: ignore

  node:
    name: node
    if: ${{ inputs.language == 'node' }}
    runs-on: ubuntu-latest
    # `npm ci`, eslint, the suite and coverage. 25 covers a cold install and
    # bounds a hung test.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ fromJSON(inputs.versions).node || '22' }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-dir }}/package-lock.json
      - name: install
        working-directory: ${{ inputs.working-dir }}
        run: npm ci
      # Kit's own tree, inside the service, for the lint config below. Same
      # step, same reason, same shape as the go and ruby jobs'.
      #
      # INSIDE the tree is not a preference here, it is the only thing that
      # works: kit's flat config does `import js from '@eslint/js'`, node
      # resolves that from the CONFIG FILE's directory upward, and a config
      # beside the repository finds nothing and dies with ERR_MODULE_NOT_FOUND.
      # Measured; see tests/lint_test.sh and README.md.
      - name: kit (lint config)
        uses: actions/checkout@v7
        with:
          repository: cafaye/kit
          ref: ${{ inputs.kit-lint-ref }}
          path: ${{ env.KIT_LINT_DIR }}
          sparse-checkout: lint
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # ESLint run DIRECTLY, not `npm run lint`.
      #
      # `npm run lint` is not a linter: it is whatever script the repository
      # happens to define, and a repository that defines none gets a confusing
      # "Missing script" rather than a lint, while one that defines it is
      # running its OWN config — which is the copy this packet exists to end.
      # Naming the tool is what makes the policy kit's.
      #
      # `npx --no-install` and not bare `npx`: without it, a service that has
      # not declared eslint gets a package FETCHED AND RUN at whatever version
      # is current, which is a floating dependency in a build that is otherwise
      # pinned. With it, a missing eslint is a build failure that says so.
      #
      # `.` rather than a path, so the service lints the same tree it tests.
      # THE SEAM'S OWN GUARD, and it lives HERE rather than in kit's gate
      # because of a fact about the input: `lint-args` is set by the CALLER, and
      # kit never sees that value. A check in `tests/validate.sh` can assert the
      # input exists, is a string and defaults to empty — all of which it does —
      # and it can assert this step exists in three jobs and that the three
      # copies are byte-identical. It cannot check the value, because kit has
      # never got it. So the rule that makes the seam narrow has to run where
      # the value is: in the service.
      #
      # WHAT IT REFUSES, and the one sentence that is the whole policy: the seam
      # may make the lint STRICTER, and it may not change WHICH CONFIG IS READ,
      # WHAT IS LINTED, or WHETHER A FINDING FAILS THE BUILD. Every token below
      # is one of those three, and every one was read out of the linter's own
      # `--help` rather than remembered:
      #
      #   which config   --config / -c (rubocop) / --no-config (golangci-lint)
      #                  / --no-config-lookup (eslint) / --force-default-config
      #   what is linted --new, --new-from-rev, --new-from-patch,
      #                  --new-from-merge-base (a diff, not the tree)
      #   does it fail   --issues-exit-code (golangci-lint; `=0` is a linter that
      #                  cannot fail), --fail-level (rubocop), --quiet (eslint:
      #                  "report errors only", which is looser, not stricter),
      #                  --no-error-on-unmatched-pattern (an unmatched path is
      #                  green, so a renamed file is silently unlinted)
      #
      # `--auto-gen-config` and `--regenerate-todo` are here for a different
      # reason and it is the packet's own reason: both WRITE a config file into
      # the tree. A linter that generates its own config is the copy mechanism
      # arriving through the back door, and it would be a copy nobody reviews.
      #
      # The list is duplicated in `tests/validate.sh` and asserted against this
      # one, so shortening it here is a red build rather than a quiet widening
      # of the seam.
      - name: lint-args guard
        run: |
          set -euo pipefail
          # Empty is the fleet's state, and it is not a failure: every service
          # lints with kit's policy and nothing else.
          [ -n "${KIT_LINT_ARGS:-}" ] || exit 0
          # Deliberate word splitting — the seam is a command line, and this is
          # the list the shell will hand the linter. shellcheck disable=SC2086
          # for exactly that one line.
          # shellcheck disable=SC2086
          for tok in $KIT_LINT_ARGS; do
            # `--config=path` and `--config path` are the same request, so the
            # value is stripped before the name is matched.
            name="${tok%%=*}"
            case "$name" in
              --config|-c|--no-config|--no-config-lookup|--force-default-config|\
              --issues-exit-code|--fail-level|--quiet|\
              --no-error-on-unmatched-pattern|--auto-gen-config|--regenerate-todo|\
              --new|--new-from-rev|--new-from-patch|--new-from-merge-base)
                echo "::error::lint-args may not contain '$name'." >&2
                echo "::error::The seam is for a STRICTER setting. '$name' changes" >&2
                echo "::error::which config is read, what is linted, or whether a" >&2
                echo "::error::finding fails the build — so a green build would stop" >&2
                echo "::error::meaning what it says it means." >&2
                echo "::error::If the fleet should have it, add it to kit/lint and" >&2
                echo "::error::every service gets it free. See README.md," >&2
                echo "::error::'The deviation seam'." >&2
                exit 1
                ;;
            esac
          done
      - name: lint
        working-directory: ${{ inputs.working-dir }}
        run: npx --no-install eslint --config "$KIT_LINT_DIR/lint/eslint.config.mjs" . ${{ env.KIT_LINT_ARGS }}
      - name: test
        working-directory: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          # The demand, exported rather than inferred: a tier that cannot run
          # must fail here, at invocation time, rather than report as a pass.
          if [ -n "${REQUIRED_TIER:-}" ]; then export "$REQUIRED_TIER=1"; fi
          npm test 2>&1 | tee "$RUNNER_TEMP/kit-tier.log"
          # `pipefail` is on, so this step already exits with npm's status.
          exit "${PIPESTATUS[0]}"
      - name: tier demand
        working-directory: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          # An empty REQUIRED_TIER is the default and demands nothing, so a repo
          # that has not adopted tiers is untouched. Exits before reading a log
          # that need not exist.
          [ -n "${REQUIRED_TIER:-}" ] || exit 0
          log="$RUNNER_TEMP/kit-tier.log"
          if [ ! -f "$log" ]; then
            echo "::error::$REQUIRED_TIER was set and there is no run log at $log." >&2
            echo "::error::A demanded tier with no log is a green build that" >&2
            echo "::error::verified nothing, whatever the test step printed." >&2
            exit 1
          fi
          # The one place the normalised format is read, and it reads only the
          # format kit owns — never a per-language report. A `ran` line is the
          # evidence that something executed; no `ran` line is a tier that ran
          # zero tests, and the failure NAMES THE VARIABLE so the fix is obvious
          # from the log alone.
          if ! grep -qE '^ran[[:space:]]' "$log"; then
            echo "::error::$REQUIRED_TIER was set and no 'ran <tier> <suite> <test>'" >&2
            echo "::error::line reached this log. A gate variable that is set and a" >&2
            echo "::error::tier that ran zero tests is a green build that verified" >&2
            echo "::error::nothing. See templates/tier/README.md." >&2
            exit 1
          fi
      # --if-present keeps day-one adoption green; drop it once the script exists
      # so a missing coverage step fails the build.
      - name: coverage
        working-directory: ${{ inputs.working-dir }}
        run: npm run coverage --if-present
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: coverage-node
          path: ${{ inputs.working-dir }}/coverage
          if-no-files-found: ignore

  # ------------------------------------------------------------------- bun
  # The job gateway's own CI hand-rolled, because kit had none. gateway ships
  # bun.lock and no package-lock.json, so the `node` job above would have died
  # on `npm ci` on day one and the whole file would have stayed bespoke.
  #
  # It is a separate job rather than a flag on the node one because the two
  # differ in ways a flag hides: a different package manager, a different
  # lockfile name, and a different frozen-install contract.
  bun:
    name: bun
    if: ${{ inputs.language == 'bun' }}
    runs-on: ubuntu-latest
    # `bun install`, typecheck, the suite and coverage. 25, the same shape as
    # node above.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ fromJSON(inputs.versions).bun || '1.3.12' }}
      - name: install
        working-directory: ${{ inputs.working-dir }}
        # Frozen: installs exactly bun.lock and FAILS when the lock and the
        # manifest disagree. Plain `bun install` here would let a lockfile drift
        # reach master unnoticed, which is the entire reason the lockfile exists.
        run: bun install --frozen-lockfile
      - name: typecheck
        # `tsc --noEmit`. --noEmit matters: without it this step publishes
        # .js files next to the .ts sources, and the next step then tests files
        # the compiler invented rather than the ones in the commit.
        working-directory: ${{ inputs.working-dir }}
        run: bun run typecheck
      - name: test
        working-directory: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          # The demand, exported rather than inferred: a tier that cannot run
          # must fail here, at invocation time, rather than report as a pass.
          if [ -n "${REQUIRED_TIER:-}" ]; then export "$REQUIRED_TIER=1"; fi
          bun test 2>&1 | tee "$RUNNER_TEMP/kit-tier.log"
          # `pipefail` is on, so this step already exits with bun's status.
          exit "${PIPESTATUS[0]}"
      - name: tier demand
        working-directory: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          # An empty REQUIRED_TIER is the default and demands nothing, so a repo
          # that has not adopted tiers is untouched. Exits before reading a log
          # that need not exist.
          [ -n "${REQUIRED_TIER:-}" ] || exit 0
          log="$RUNNER_TEMP/kit-tier.log"
          if [ ! -f "$log" ]; then
            echo "::error::$REQUIRED_TIER was set and there is no run log at $log." >&2
            echo "::error::A demanded tier with no log is a green build that" >&2
            echo "::error::verified nothing, whatever the test step printed." >&2
            exit 1
          fi
          # The one place the normalised format is read, and it reads only the
          # format kit owns — never a per-language report. A `ran` line is the
          # evidence that something executed; no `ran` line is a tier that ran
          # zero tests, and the failure NAMES THE VARIABLE so the fix is obvious
          # from the log alone.
          if ! grep -qE '^ran[[:space:]]' "$log"; then
            echo "::error::$REQUIRED_TIER was set and no 'ran <tier> <suite> <test>'" >&2
            echo "::error::line reached this log. A gate variable that is set and a" >&2
            echo "::error::tier that ran zero tests is a green build that verified" >&2
            echo "::error::nothing. See templates/tier/README.md." >&2
            exit 1
          fi
      # --if-present for the same reason as the node job above: day-one adoption
      # must not be blocked by a coverage script that does not exist yet. Drop
      # it once `coverage` is in package.json, or this step is a report.
      - name: coverage
        working-directory: ${{ inputs.working-dir }}
        run: bun run --if-present coverage
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: coverage-bun
          path: ${{ inputs.working-dir }}/coverage
          if-no-files-found: ignore

  # ----------------------------------------------------------------- telemetry
  # Opt-in (see the `telemetry` input). A repo that has copied
  # templates/otel/<lang>/ into its tree runs the W3C traceparent conformance
  # suite for its language on every push, so "we propagate traces" stops being a
  # claim in a README and becomes a red build.
  #
  # A matrix, not six jobs: this is the one place a matrix is right. It runs
  # only when a repo opts in, it is a small stdlib-only suite, and a per-language
  # job here would mean six near-identical blocks to keep in sync. The six
  # language jobs above stay ungated-by-matrix because each one installs a
  # different toolchain, which is the thing a matrix cannot share.
  telemetry:
    name: telemetry (${{ matrix.language }})
    if: ${{ inputs.telemetry == 'true' }}
    runs-on: ubuntu-latest
    # Installs SIX toolchains (go, ruby, elixir, python, node, rust) and then
    # runs one conformance suite. The setup actions dominate; 30 bounds a
    # matrix leg that hangs on a download.
    timeout-minutes: 30
    strategy:
      # One language at a time. Six runners for six stdlib suites costs more
      # than it returns, and a failure is easier to read from a serial log.
      max-parallel: 2
      fail-fast: false
      matrix:
        language:
          - go
          - ruby
          - elixir
          - python
          - node
          - rust
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The toolchain comes from the matrix, so a bun-only repo does not install
      # an entire Go toolchain to run one test file. Each entry is the setup
      # action the language's own job uses, deliberately the same action and the
      # same version default, so the two paths cannot drift.
      - name: install go
        if: ${{ matrix.language == 'go' }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ fromJSON(inputs.versions).go || 'stable' }}
      - name: install ruby
        if: ${{ matrix.language == 'ruby' }}
        uses: ruby/setup-ruby@v1
      - name: install elixir
        if: ${{ matrix.language == 'elixir' }}
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ fromJSON(inputs.versions).elixir || '1.18' }}
          otp-version: ${{ fromJSON(inputs.versions).erlang || '27' }}
      - name: install python
        if: ${{ matrix.language == 'python' }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ fromJSON(inputs.versions).python || '3.13' }}
      - name: install node
        if: ${{ matrix.language == 'node' }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ fromJSON(inputs.versions).node || '22' }}
      - name: install rust
        if: ${{ matrix.language == 'rust' }}
        uses: dtolnay/rust-toolchain@stable
      # Kit's own tree, for the fallback suite below. Fetched by a NAME and never
      # read out of `$GITHUB_ACTION_PATH`, and the reason is the same one the
      # language jobs use: GitHub documents `GITHUB_ACTION_PATH` as
      # composite-action-only, so inside a REUSABLE WORKFLOW it is not set and
      # `${GITHUB_ACTION_PATH}/…` expands to nothing. Under `set -euo pipefail`
      # that is not a missing optional path — it is `unbound variable` and the
      # step dies on its first line. The whole of that argument is in the
      # `kit-gate-tree` comment block on the `zizmor` job's fetch step below.
      #
      # WHY `run:` AND NOT `uses: actions/checkout`, which is the SECOND fatal on
      # this line. The action REFUSES a `path:` outside the workspace, from its own
      # source at v7 `src/input-helper.ts`:
      #
      #   result.repositoryPath = path.resolve(githubWorkspacePath, path)
      #   if (!(result.repositoryPath + path.sep).startsWith(githubWorkspacePath + path.sep))
      #     throw new Error(`Repository path '…' is not under '…'`)
      #
      # It is a guard rather than a quirk — the action cleans up after itself and
      # persists credentials relative to the workspace — and NO input relaxes it.
      # Measured in `cafaye/parlor` run 37249271580, job `ci (kit, node) /
      # secrets`:
      #
      #   ##[error]Repository path '/home/runner/work/_temp/kit' is not under
      #             '/home/runner/work/parlor/parlor'
      #
      # So a `git clone` into `$RUNNER_TEMP` sidesteps the guard entirely and
      # writes wherever it likes, which is the only place this tree may go (see
      # below). `tests/validate.sh`'s `checkout_path_check` now fails on any
      # `actions/checkout` in this directory whose `path:` is not under the
      # workspace, so the shape cannot come back by accident.
      #
      # WHY `$RUNNER_TEMP` AND NOT `.kit` INSIDE THE WORKSPACE. A second git
      # repository nested inside the one under test is a nested-repo question
      # with no good answer: its files are swept by the artifact upload and by
      # any gate step that walks the tree. `$RUNNER_TEMP` is per-job scratch
      # space, emptied when the job ends — the lifetime this file needs.
      #
      # CREDENTIALS. `cafaye/kit` is PUBLIC, so this clone needs no token — which
      # is a stronger position than the `persist-credentials: false` the action
      # was given, because nothing is written to `.git/config` to be cleaned up.
      # `GIT_TERMINAL_PROMPT=0` is set so a future private repo fails instead of
      # hanging on a prompt that cannot be answered in CI.
      - name: kit (conformance fallback)
        env:
          KIT_REF: ${{ inputs.kit-lint-ref }}
          KIT_SPARSE: templates/otel
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          KIT_TREE_DIR="$RUNNER_TEMP/kit"
          git init --quiet "$KIT_TREE_DIR"
          git -C "$KIT_TREE_DIR" remote add origin https://github.com/cafaye/kit.git
          git -C "$KIT_TREE_DIR" sparse-checkout set --no-cone "$KIT_SPARSE"
          git -C "$KIT_TREE_DIR" fetch --depth 1 --filter=blob:none --quiet origin "$KIT_REF"
          git -C "$KIT_TREE_DIR" checkout --quiet FETCH_HEAD
          echo "KIT_TREE_DIR=$KIT_TREE_DIR" >> "$GITHUB_ENV"
      - name: conformance suite
        # The suite the repo copied, not the one in kit: a service that has
        # patched its own middleware runs its own tests. Falls back to kit's
        # copy when the repo has not adopted the template yet, so turning the
        # input on is never a red build for want of a file.
        working-directory: ${{ inputs.working-dir }}
        env:
          KIT_TELEMETRY_DIR: ${{ inputs.working-dir }}/templates/otel/${{ matrix.language }}
        run: |
          set -euo pipefail
          dir="$KIT_TELEMETRY_DIR"
          if [ ! -d "$dir" ]; then
            echo "::notice::no $dir in this repo; running kit's own copy of the suite"
            dir="$KIT_TREE_DIR/templates/otel/${KIT_TELEMETRY_LANG:-${{ matrix.language }}}"
          fi
          case "${{ matrix.language }}" in
            go)
              GOFLAGS=-mod=mod GOPROXY=off GOTOOLCHAIN=local go test "$dir/..." ;;
            ruby)
              ruby "$dir/test_traceparent.rb" ;;
            elixir)
              elixir -r "$dir/traceparent.ex" "$dir/test_traceparent.exs" ;;
            python)
              python3 "$dir/test_traceparent.py" ;;
            node)
              node --test "$dir/traceparent.test.mjs" ;;
            rust)
              rustc --test --edition 2021 -o "$RUNNER_TEMP/kit-telemetry" "$dir/traceparent.rs"
              "$RUNNER_TEMP/kit-telemetry" ;;
          esac

  # ------------------------------------------------------------------ zizmor
  # GitHub Actions' own security audit, run on the adopting repository's own
  # workflows. It is a separate job because it needs kit's own tree to run in,
  # and a language job's matrix has no use for a whole extra checkout. The
  # audit looks at the workflow's own shape — who can write, what is pinned,
  # what persists a credential.
  #
  # It ships with an opt-in, for a reason. The
  # audit's output depends entirely on the adopting repository's workflows,
  # which kit does not control and did not write, so making it fatal on day one
  # would mean a repo inherits a red build for a finding kit introduced. A repo
  # that wants it now asks for it; every repo gets it the moment this stops
  # being true, because the input is already here and the default only ever
  # moves down.
  #
  # `unpinned-uses` is reported and does not fail the job. That is not a
  # baseline: the finding is counted and printed on every run, and the decision
  # it is waiting on is written down in DECISIONS.md under MD10 with all three
  # options costed. Every other audit is fatal.
  zizmor:
    name: zizmor
    if: ${{ inputs.zizmor == 'true' }}
    runs-on: ubuntu-latest
    # `pip install zizmor`, a sparse fetch of kit, and one audit. 15 bounds a
    # stalled network install.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: install zizmor (pinned)
        # From PyPI, not a release archive: zizmor publishes no checksums file,
        # so pinning its archives would mean pinning hashes we computed
        # ourselves, which is a weaker claim than hadolint's published one.
        # The version is exact because an audit whose findings change when the
        # tool is upgraded is an audit nobody can reason about.
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check 'zizmor==1.30.1'
      # Kit's own tree, for `tests/zizmor_gate.sh`. Fetched by a NAME, never
      # `$GITHUB_ACTION_PATH` — the variable is documented as composite-action-only
      # and this is a reusable workflow, so it is not set here and reading it
      # under `set -euo pipefail` is a fatal on the step's first line. The full
      # argument is in the `kit (gate scripts)` step of every language job;
      # `kit (gate scripts)` step; this job is the SECOND one that had the defect
      # and the reason `kit_gate_tree_check` asserts on the variable's absence
      # rather than on either file happening to be correct today.
      #
      # Hand-rolled `git` rather than `uses: actions/checkout`, and this is the
      # THIRD job that carried the same latent fatal: the action refuses a `path:`
      # outside the workspace, and this step pointed one at the runner's scratch
      # directory. It had simply never fired, because this job is opt-in and
      # opt-in job failed first. All three copies are
      # fixed together for the reason AGENTS.md records about the
      # `REUSABLE_WORKFLOWS` list: a fix that leaves two armed is a fix that has
      # not landed, and "nobody has seen it fail" is a fact about which job runs
      # first, not about whether it fails.
      - name: kit (gate scripts)
        env:
          KIT_REF: ${{ inputs.kit-lint-ref }}
          KIT_SPARSE: tests
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          KIT_TREE_DIR="$RUNNER_TEMP/kit"
          git init --quiet "$KIT_TREE_DIR"
          git -C "$KIT_TREE_DIR" remote add origin https://github.com/cafaye/kit.git
          git -C "$KIT_TREE_DIR" sparse-checkout set --no-cone "$KIT_SPARSE"
          git -C "$KIT_TREE_DIR" fetch --depth 1 --filter=blob:none --quiet origin "$KIT_REF"
          git -C "$KIT_TREE_DIR" checkout --quiet FETCH_HEAD
          echo "KIT_TREE_DIR=$KIT_TREE_DIR" >> "$GITHUB_ENV"
      - name: zizmor (unpinned-uses recorded, everything else fatal)
        # `PY` is exported as well as `KIT_TREE_DIR`, and that is a SECOND defect
        # in this job rather than a detail of the first: `tests/zizmor_gate.sh`
        # ends by piping zizmor's JSON report through `"$PY" - …`, and nothing
        # here ever set it. In kit's own gate `PY` comes from
        # `kit_bootstrap_python`, which `validate.sh` calls; a reusable workflow
        # has no such call, so the script reached its own last line and died on
        # `PY: unbound variable`. Both are the same shape — a script written to
        # be called by one caller, run by another that had not been read.
        #
        # `KIT_TREE_DIR` is not re-declared here: the fetch step above exports it
        # through `$GITHUB_ENV`. `PY` still has to be, because no step exports it.
        env:
          PY: python3
        run: bash "$KIT_TREE_DIR/tests/zizmor_gate.sh" "$GITHUB_WORKSPACE" "$(command -v zizmor)"

  # ------------------------------------------------------------------ tenancy
  # Opt-in (see the `tenancy` input). Core's account-isolation declaration
  # checker, run against the adopting repository's own tree.
  #
  # A separate job because it needs core's harness on disk, and a language job's
  # matrix has no use for a whole extra checkout. It is toolchain-independent —
  # the checker is stdlib-only Python — so it runs once, not once per language.
  #
  # THE SUBJECT IS THE CALLER, AND THAT IS THE ARGUMENT FOR THIS JOB LIVING
  # HERE. Every job in this file runs against the caller's tree; a red tenancy
  # finding lands on the repository that owns `tenancy.yml` and can fix it,
  # which is the finding MD36's first reason excludes (a finding nobody in this
  # repository can fix). The alternative — thirteen adopting repositories each
  # hand-rolling a fetch of cafaye/core and each pinning its own ref — is the
  # drift this repository exists to prevent, and it is strictly worse than the
  # one fetch and one pin this job makes.
  #
  # WHAT IT DOES NOT CHECK, said plainly: this job runs `tenancy-check` and
  # nothing else. The sibling `account-scope-check` is a separate checker with
  # a separate adoption state — measured 2026-10-06, identity is green on
  # `tenancy-check` and carries 42 failures from `account-scope-check` in the
  # same tree — and wiring it in is a different packet. Do not read a green
  # here as "this service has adopted tenancy"; read it as "this service's
  # tenancy.yml is true of its tree".
  tenancy:
    name: tenancy
    if: ${{ inputs.tenancy == 'true' }}
    runs-on: ubuntu-latest
    # A sparse fetch of core plus `tenancy-check`. 20 bounds a stalled fetch
    # and leaves the checker room on a large tree.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Core's own tree, for the checker below. Fetched by a NAME and never read
      # out of `$GITHUB_ACTION_PATH`, for the reason the two kit fetches above
      # give: the variable is documented as composite-action-only, so inside a
      # REUSABLE WORKFLOW it is not set, and reading it under `set -euo pipefail`
      # is a fatal on the step's first line. The whole of that argument is in
      # the `kit (conformance fallback)` and `kit (gate scripts)` steps; this
      # is the THIRD hand-rolled fetch in this file and the first that reaches
      # outside kit.
      #
      # WHY CORE AND NOT KIT, AND WHY A FETCH AND NOT A VENDORED COPY. The
      # checker is core's: it reads `tenancy.yml` against
      # `schemas/tenant-isolation.schema.json`, and kit ships no schema and no
      # checker. A copy of `tenancy_check.py` in kit would be a copy that can
      # drift from core's schema — the same reason courier's gate-self-test
      # fetches core rather than vendoring the gate checker. So this job
      # establishes the notion of core's harness for the first time, through the
      # same idiom the kit fetches use: a public repository, no token,
      # `$RUNNER_TEMP` scratch, a pin that is an input.
      #
      # WHAT IT SPARSE-CHECKS OUT, and why `harness` and not the whole tree: the
      # wrapper resolves `tenancy_check.py` and `cafaye_contract.py` beside
      # itself, and the schema's constraints are re-implemented in the Python
      # (the file is stdlib-only), so `harness/` is the whole of what this job
      # reads. A full clone of core on every opt-in push is a cost paid for
      # files nobody opens.
      - name: core (harness)
        env:
          CORE_REF: ${{ inputs.kit-core-ref }}
          CORE_SPARSE: harness
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          CORE_TREE_DIR="$RUNNER_TEMP/core"
          git init --quiet "$CORE_TREE_DIR"
          git -C "$CORE_TREE_DIR" remote add origin https://github.com/cafaye/core.git
          git -C "$CORE_TREE_DIR" sparse-checkout set --no-cone "$CORE_SPARSE"
          git -C "$CORE_TREE_DIR" fetch --depth 1 --filter=blob:none --quiet origin "$CORE_REF"
          git -C "$CORE_TREE_DIR" checkout --quiet FETCH_HEAD
          echo "CORE_TREE_DIR=$CORE_TREE_DIR" >> "$GITHUB_ENV"
      - name: tenancy-check
        # THE EXIT-CODE CONTRACT IS THE WRAPPER'S, AND THIS STEP PASSES IT
        # THROUGH UNTOUCHED. `core/harness/bin/tenancy-check` exits 0 (no
        # failure — warnings may still print), 1 (at least one failure) or 2
        # (the check could not happen), and its header says the one thing a
        # caller branches on is the exit code. So this step captures the status
        # and re-emits it rather than letting `set -e` abort on the first
        # non-zero and lose the summary — a wrapper that turns a refusal into a
        # pass is worse than no wrapper, and the same is true of a step.
        #
        # THE SUMMARY IS PUBLISHED ON EVERY EXIT CODE, including 0. A green run
        # with warnings is a report worth reading — `enumeration-partial` means
        # "this machine could not answer that question" — and a red run is a
        # diagnosis that belongs in the step summary, not only in an artifact
        # somebody has to download. The JSON is uploaded as an artifact below on
        # every exit code, so the findings survive the run.
        #
        # `CORE_TREE_DIR` is not re-declared here: the fetch step above exports
        # it through `$GITHUB_ENV`.
        env:
          CORE_TREE_DIR: ${{ env.CORE_TREE_DIR }}
        run: |
          set -euo pipefail
          json="$RUNNER_TEMP/tenancy.json"
          status=0
          "$CORE_TREE_DIR/harness/bin/tenancy-check" --json . > "$json" || status=$?
          # The summary is best-effort and must not mask the exit code: a
          # checker that could not run (exit 2) writes no JSON, and the step's
          # verdict is the exit code, not the summary. So the reader handles a
          # missing or corrupt file and always exits 0 — the one status this
          # step swallows is the summary's, never the checker's.
          python3 - "$json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys

          try:
              with open(sys.argv[1], encoding="utf-8") as fh:
                  data = json.load(fh)
          except Exception as exc:
              print(f"### tenancy-check — no JSON to report ({exc})")
              sys.exit(0)

          counts = data.get("counts") or {}
          print(
              f"### tenancy-check — {counts.get('fail', 0)} failure(s), "
              f"{counts.get('warn', 0)} warning(s)"
          )
          print()
          if data.get("couldNotRun"):
              print(f"**could not run:** {data['couldNotRun']}")
              print()
          findings = data.get("findings") or []
          if findings:
              print("| severity | id | message |")
              print("| --- | --- | --- |")
              for f in findings:
                  msg = str(f.get("message", "")).replace("|", "\\|")
                  print(f"| {f.get('severity', '')} | {f.get('id', '')} | {msg} |")
          else:
              print("no findings")
          PY
          if [ "$status" -ne 0 ]; then
            echo "::error::tenancy-check exited $status — the findings are in the step" >&2
            echo "::error::summary and the tenancy-findings artifact." >&2
            exit "$status"
          fi
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: tenancy-findings
          path: ${{ runner.temp }}/tenancy.json
          # `warn`, not `error`: a checker that could not run (exit 2) writes no
          # JSON, and the step above has already failed with the real reason. A
          # second failure here would be noise on top of the verdict.
          if-no-files-found: warn
