      # `--auto-gen-config` and `--regenerate-todo` are here for a different
      # reason and it is the packet's own reason: both WRITE a config file into
      # the tree. A linter that generates its own config is the copy mechanism
      # arriving through the back door, and it would be a copy nobody reviews.
      #
      # The list is duplicated in `tests/validate.sh` and asserted against this
      # one, so shortening it here is a red build rather than a quiet widening
      # of the seam.
      - name: lint-args guard
        run: |
          set -euo pipefail
          # Empty is the fleet's state, and it is not a failure: every service
          # lints with kit's policy and nothing else.
          [ -n "${KIT_LINT_ARGS:-}" ] || exit 0
          # Deliberate word splitting — the seam is a command line, and this is
          # the list the shell will hand the linter. shellcheck disable=SC2086
          # for exactly that one line.
          # shellcheck disable=SC2086
          for tok in $KIT_LINT_ARGS; do
            # `--config=path` and `--config path` are the same request, so the
            # value is stripped before the name is matched.
            name="${tok%%=*}"
            case "$name" in
              --config|-c|--no-config|--no-config-lookup|--force-default-config|\
              --issues-exit-code|--fail-level|--quiet|\
              --no-error-on-unmatched-pattern|--auto-gen-config|--regenerate-todo|\
              --new|--new-from-rev|--new-from-patch|--new-from-merge-base)
                echo "::error::lint-args may not contain '$name'." >&2
                echo "::error::The seam is for a STRICTER setting. '$name' changes" >&2
                echo "::error::which config is read, what is linted, or whether a" >&2
                echo "::error::finding fails the build — so a green build would stop" >&2
                echo "::error::meaning what it says it means." >&2
                echo "::error::If the fleet should have it, add it to kit/lint and" >&2
                echo "::error::every service gets it free. See README.md," >&2
                echo "::error::'The deviation seam'." >&2
                exit 1
                ;;
            esac
          done
      - name: lint
        working-directory: ${{ inputs.working-dir }}
        run: bundle exec rubocop --parallel --config "$KIT_LINT_DIR/lint/rubocop.yml" ${{ env.KIT_LINT_ARGS }}
      - name: test
        working-directory: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          # The demand, exported rather than inferred: a tier that cannot run
          # must fail here, at invocation time, rather than report as a pass.
          if [ -n "${REQUIRED_TIER:-}" ]; then export "$REQUIRED_TIER=1"; fi
          bundle exec rake 2>&1 | tee "$RUNNER_TEMP/kit-tier.log"
          # `pipefail` is on, so this step already exits with rake's status.
          exit "${PIPESTATUS[0]}"
      - name: tier demand
        working-directory: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          # An empty REQUIRED_TIER is the default and demands nothing, so a repo
          # that has not adopted tiers is untouched. Exits before reading a log
          # that need not exist.
          [ -n "${REQUIRED_TIER:-}" ] || exit 0
          log="$RUNNER_TEMP/kit-tier.log"
          if [ ! -f "$log" ]; then
            echo "::error::$REQUIRED_TIER was set and there is no run log at $log." >&2
            echo "::error::A demanded tier with no log is a green build that" >&2
            echo "::error::verified nothing, whatever the test step printed." >&2
            exit 1
