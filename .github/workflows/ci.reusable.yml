      #                  --new-from-merge-base (a diff, not the tree)
      #   does it fail   --issues-exit-code (golangci-lint; `=0` is a linter that
      #                  cannot fail), --fail-level (rubocop), --quiet (eslint:
      #                  "report errors only", which is looser, not stricter),
      #                  --no-error-on-unmatched-pattern (an unmatched path is
      #                  green, so a renamed file is silently unlinted)
      #
      # `--auto-gen-config` and `--regenerate-todo` are here for a different
      # reason and it is the packet's own reason: both WRITE a config file into
      # the tree. A linter that generates its own config is the copy mechanism
      # arriving through the back door, and it would be a copy nobody reviews.
      #
      # The list is duplicated in `tests/validate.sh` and asserted against this
      # one, so shortening it here is a red build rather than a quiet widening
      # of the seam.
      - name: lint-args guard
        run: |
          set -euo pipefail
          # Empty is the fleet's state, and it is not a failure: every service
          # lints with kit's policy and nothing else.
          [ -n "${KIT_LINT_ARGS:-}" ] || exit 0
          # Deliberate word splitting — the seam is a command line, and this is
          # the list the shell will hand the linter. shellcheck disable=SC2086
          # for exactly that one line.
          # shellcheck disable=SC2086
          for tok in $KIT_LINT_ARGS; do
            # `--config=path` and `--config path` are the same request, so the
            # value is stripped before the name is matched.
            name="${tok%%=*}"
            case "$name" in
              --config|-c|--no-config|--no-config-lookup|--force-default-config|\
              --issues-exit-code|--fail-level|--quiet|\
              --no-error-on-unmatched-pattern|--auto-gen-config|--regenerate-todo|\
              --new|--new-from-rev|--new-from-patch|--new-from-merge-base)
                echo "::error::lint-args may not contain '$name'." >&2
                echo "::error::The seam is for a STRICTER setting. '$name' changes" >&2
                echo "::error::which config is read, what is linted, or whether a" >&2
                echo "::error::finding fails the build — so a green build would stop" >&2
                echo "::error::meaning what it says it means." >&2
                echo "::error::If the fleet should have it, add it to kit/lint and" >&2
                echo "::error::every service gets it free. See README.md," >&2
                echo "::error::'The deviation seam'." >&2
                exit 1
                ;;
            esac
          done
      - name: lint
        working-directory: ${{ inputs.working-dir }}
        run: npx --no-install eslint --config "$KIT_LINT_DIR/lint/eslint.config.mjs" . ${{ env.KIT_LINT_ARGS }}
      - name: test
        working-directory: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          # The demand, exported rather than inferred: a tier that cannot run
          # must fail here, at invocation time, rather than report as a pass.
          if [ -n "${REQUIRED_TIER:-}" ]; then export "$REQUIRED_TIER=1"; fi
          npm test 2>&1 | tee "$RUNNER_TEMP/kit-tier.log"
          # `pipefail` is on, so this step already exits with npm's status.
          exit "${PIPESTATUS[0]}"
      - name: tier demand
        working-directory: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          # An empty REQUIRED_TIER is the default and demands nothing, so a repo
          # that has not adopted tiers is untouched. Exits before reading a log
          # that need not exist.
          [ -n "${REQUIRED_TIER:-}" ] || exit 0
          log="$RUNNER_TEMP/kit-tier.log"
          if [ ! -f "$log" ]; then
            echo "::error::$REQUIRED_TIER was set and there is no run log at $log." >&2
            echo "::error::A demanded tier with no log is a green build that" >&2
            echo "::error::verified nothing, whatever the test step printed." >&2
            exit 1
          fi
          # The one place the normalised format is read, and it reads only the
          # format kit owns — never a per-language report. A `ran` line is the
          # evidence that something executed; no `ran` line is a tier that ran
          # zero tests, and the failure NAMES THE VARIABLE so the fix is obvious
          # from the log alone.
          if ! grep -qE '^ran[[:space:]]' "$log"; then
            echo "::error::$REQUIRED_TIER was set and no 'ran <tier> <suite> <test>'" >&2
            echo "::error::line reached this log. A gate variable that is set and a" >&2
            echo "::error::tier that ran zero tests is a green build that verified" >&2
            echo "::error::nothing. See templates/tier/README.md." >&2
            exit 1
          fi
      # --if-present keeps day-one adoption green; drop it once the script exists
      # so a missing coverage step fails the build.
      - name: coverage
        working-directory: ${{ inputs.working-dir }}
        run: npm run coverage --if-present
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: coverage-node
          path: ${{ inputs.working-dir }}/coverage
          if-no-files-found: ignore

  # ------------------------------------------------------------------- bun
  # The job gateway's own CI hand-rolled, because kit had none. gateway ships
  # bun.lock and no package-lock.json, so the `node` job above would have died
  # on `npm ci` on day one and the whole file would have stayed bespoke.
  #
  # It is a separate job rather than a flag on the node one because the two
  # differ in ways a flag hides: a different package manager, a different
  # lockfile name, and a different frozen-install contract.
  bun:
    name: bun
    if: ${{ inputs.language == 'bun' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ fromJSON(inputs.versions).bun || '1.3.12' }}
      - name: install
        working-directory: ${{ inputs.working-dir }}
        # Frozen: installs exactly bun.lock and FAILS when the lock and the
        # manifest disagree. Plain `bun install` here would let a lockfile drift
        # reach master unnoticed, which is the entire reason the lockfile exists.
        run: bun install --frozen-lockfile
      - name: typecheck
        # `tsc --noEmit`. --noEmit matters: without it this step publishes
        # .js files next to the .ts sources, and the next step then tests files
        # the compiler invented rather than the ones in the commit.
        working-directory: ${{ inputs.working-dir }}
        run: bun run typecheck
      - name: test
        working-directory: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          # The demand, exported rather than inferred: a tier that cannot run
          # must fail here, at invocation time, rather than report as a pass.
          if [ -n "${REQUIRED_TIER:-}" ]; then export "$REQUIRED_TIER=1"; fi
          bun test 2>&1 | tee "$RUNNER_TEMP/kit-tier.log"
          # `pipefail` is on, so this step already exits with bun's status.
          exit "${PIPESTATUS[0]}"
      - name: tier demand
        working-directory: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          # An empty REQUIRED_TIER is the default and demands nothing, so a repo
          # that has not adopted tiers is untouched. Exits before reading a log
          # that need not exist.
          [ -n "${REQUIRED_TIER:-}" ] || exit 0
          log="$RUNNER_TEMP/kit-tier.log"
          if [ ! -f "$log" ]; then
            echo "::error::$REQUIRED_TIER was set and there is no run log at $log." >&2
            echo "::error::A demanded tier with no log is a green build that" >&2
            echo "::error::verified nothing, whatever the test step printed." >&2
            exit 1
          fi
          # The one place the normalised format is read, and it reads only the
          # format kit owns — never a per-language report. A `ran` line is the
          # evidence that something executed; no `ran` line is a tier that ran
          # zero tests, and the failure NAMES THE VARIABLE so the fix is obvious
          # from the log alone.
          if ! grep -qE '^ran[[:space:]]' "$log"; then
            echo "::error::$REQUIRED_TIER was set and no 'ran <tier> <suite> <test>'" >&2
            echo "::error::line reached this log. A gate variable that is set and a" >&2
            echo "::error::tier that ran zero tests is a green build that verified" >&2
            echo "::error::nothing. See templates/tier/README.md." >&2
            exit 1
          fi
      # --if-present for the same reason as the node job above: day-one adoption
      # must not be blocked by a coverage script that does not exist yet. Drop
      # it once `coverage` is in package.json, or this step is a report.
      - name: coverage
        working-directory: ${{ inputs.working-dir }}
        run: bun run --if-present coverage
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: coverage-bun
          path: ${{ inputs.working-dir }}/coverage
          if-no-files-found: ignore

  # ----------------------------------------------------------------- telemetry
  # Opt-in (see the `telemetry` input). A repo that has copied
  # templates/otel/<lang>/ into its tree runs the W3C traceparent conformance
  # suite for its language on every push, so "we propagate traces" stops being a
  # claim in a README and becomes a red build.
  #
  # A matrix, not six jobs: this is the one place a matrix is right. It runs
  # only when a repo opts in, it is a small stdlib-only suite, and a per-language
  # job here would mean six near-identical blocks to keep in sync. The six
  # language jobs above stay ungated-by-matrix because each one installs a
  # different toolchain, which is the thing a matrix cannot share.
  telemetry:
    name: telemetry (${{ matrix.language }})
    if: ${{ inputs.telemetry == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      # One language at a time. Six runners for six stdlib suites costs more
      # than it returns, and a failure is easier to read from a serial log.
      max-parallel: 2
      fail-fast: false
      matrix:
        language:
          - go
          - ruby
          - elixir
          - python
          - node
          - rust
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The toolchain comes from the matrix, so a bun-only repo does not install
      # an entire Go toolchain to run one test file. Each entry is the setup
      # action the language's own job uses, deliberately the same action and the
      # same version default, so the two paths cannot drift.
      - name: install go
        if: ${{ matrix.language == 'go' }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ fromJSON(inputs.versions).go || 'stable' }}
      - name: install ruby
        if: ${{ matrix.language == 'ruby' }}
        uses: ruby/setup-ruby@v1
      - name: install elixir
        if: ${{ matrix.language == 'elixir' }}
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ fromJSON(inputs.versions).elixir || '1.18' }}
          otp-version: ${{ fromJSON(inputs.versions).erlang || '27' }}
      - name: install python
        if: ${{ matrix.language == 'python' }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ fromJSON(inputs.versions).python || '3.13' }}
      - name: install node
        if: ${{ matrix.language == 'node' }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ fromJSON(inputs.versions).node || '22' }}
      - name: install rust
        if: ${{ matrix.language == 'rust' }}
        uses: dtolnay/rust-toolchain@stable
      # Kit's own tree, for the fallback suite below. Fetched by a NAME and never
      # read out of `$GITHUB_ACTION_PATH`, and the reason is the same one the
      # language jobs use: GitHub documents `GITHUB_ACTION_PATH` as
      # composite-action-only, so inside a REUSABLE WORKFLOW it is not set and
      # `${GITHUB_ACTION_PATH}/…` expands to nothing. Under `set -euo pipefail`
      # that is not a missing optional path — it is `unbound variable` and the
      # step dies on its first line. See the `kit-gate-tree` comment block at the
      # top of the `secrets` job, which is where the whole of that argument is.
      #
      # WHY `run:` AND NOT `uses: actions/checkout`, which is the SECOND fatal on
      # this line and the reason `secrets` has still never been green. The action
      # REFUSES a `path:` outside the workspace, from its own source at v7
      # `src/input-helper.ts`:
      #
      #   result.repositoryPath = path.resolve(githubWorkspacePath, path)
      #   if (!(result.repositoryPath + path.sep).startsWith(githubWorkspacePath + path.sep))
      #     throw new Error(`Repository path '…' is not under '…'`)
      #
      # It is a guard rather than a quirk — the action cleans up after itself and
      # persists credentials relative to the workspace — and NO input relaxes it.
      # Measured in `cafaye/parlor` run 37249271580, job `ci (kit, node) /
      # secrets`:
      #
      #   ##[error]Repository path '/home/runner/work/_temp/kit' is not under
      #             '/home/runner/work/parlor/parlor'
      #
      # So a `git clone` into `$RUNNER_TEMP` sidesteps the guard entirely and
      # writes wherever it likes, which is the only place this tree may go (see
      # below). `tests/validate.sh`'s `checkout_path_check` now fails on any
      # `actions/checkout` in this directory whose `path:` is not under the
      # workspace, so the shape cannot come back by accident.
      #
      # WHY `$RUNNER_TEMP` AND NOT `.kit` INSIDE THE WORKSPACE, unchanged. The
      # `secrets` job scans `$GITHUB_WORKSPACE`, and a second git repository
      # inside the tree being scanned is a nested-repo question with no good
      # answer. `$RUNNER_TEMP` is per-job scratch space, emptied at the end of the
      # job, which is exactly the lifetime this file needs and no more.
      #
      # CREDENTIALS. `cafaye/kit` is PUBLIC, so this clone needs no token — which
      # is a stronger position than the `persist-credentials: false` the action
      # was given, because nothing is written to `.git/config` to be cleaned up.
      # `GIT_TERMINAL_PROMPT=0` is set so a future private repo fails instead of
      # hanging on a prompt that cannot be answered in CI.
      - name: kit (conformance fallback)
        env:
          KIT_REF: ${{ inputs.kit-lint-ref }}
          KIT_SPARSE: templates/otel
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          KIT_TREE_DIR="$RUNNER_TEMP/kit"
          git init --quiet "$KIT_TREE_DIR"
          git -C "$KIT_TREE_DIR" remote add origin https://github.com/cafaye/kit.git
          git -C "$KIT_TREE_DIR" sparse-checkout set --no-cone "$KIT_SPARSE"
          git -C "$KIT_TREE_DIR" fetch --depth 1 --filter=blob:none --quiet origin "$KIT_REF"
          git -C "$KIT_TREE_DIR" checkout --quiet FETCH_HEAD
          echo "KIT_TREE_DIR=$KIT_TREE_DIR" >> "$GITHUB_ENV"
      - name: conformance suite
        # The suite the repo copied, not the one in kit: a service that has
        # patched its own middleware runs its own tests. Falls back to kit's
        # copy when the repo has not adopted the template yet, so turning the
        # input on is never a red build for want of a file.
        working-directory: ${{ inputs.working-dir }}
        env:
          KIT_TELEMETRY_DIR: ${{ inputs.working-dir }}/templates/otel/${{ matrix.language }}
        run: |
          set -euo pipefail
          dir="$KIT_TELEMETRY_DIR"
          if [ ! -d "$dir" ]; then
            echo "::notice::no $dir in this repo; running kit's own copy of the suite"
            dir="$KIT_TREE_DIR/templates/otel/${KIT_TELEMETRY_LANG:-${{ matrix.language }}}"
          fi
          case "${{ matrix.language }}" in
            go)
              GOFLAGS=-mod=mod GOPROXY=off GOTOOLCHAIN=local go test "$dir/..." ;;
            ruby)
              ruby "$dir/test_traceparent.rb" ;;
            elixir)
              elixir -r "$dir/traceparent.ex" "$dir/test_traceparent.exs" ;;
            python)
              python3 "$dir/test_traceparent.py" ;;
            node)
              node --test "$dir/traceparent.test.mjs" ;;
            rust)
              rustc --test --edition 2021 -o "$RUNNER_TEMP/kit-telemetry" "$dir/traceparent.rs"
              "$RUNNER_TEMP/kit-telemetry" ;;
          esac

  # ------------------------------------------------------------------ secrets
  # The one job here with no opt-in, and the only one a repository cannot
  # choose to not run.
  #
  # WHY NO OPT-IN
  #   Every other job in this file is gated because a new job that can go red
  #   must not turn thirteen green repositories red on the day it lands — the
  #   repo has to ask for it by name. A secret scanner is the exception, and
  #   the exception is the ruling (DECISIONS.md, MD10): a secret scanner that
  #   only warns is a report. An opt-in control is not a control.
  #
  #   The cost of that choice is real and is written down rather than
  #   discovered: a repository that adopts kit and has a secret anywhere in its
  #   history gets a red build on its first run. That red build is the scanner
  #   working. What to do about it is in README.md — rotate first, then
  #   allowlist with a reason if it was a false positive. Do not reach for
  #   `continue-on-error`, which is the only setting on this job that would
  #   make it a report instead of a gate, and which tests/validate.sh fails on.
  #
  # WHY THIS RUNS ON `pull_request` AND NEVER `pull_request_target`
  #   `pull_request_target` runs in the context of the BASE repository with the
  #   repository's secrets and a writable token, executing code proposed by a
  #   FORK. Any job under that trigger is a credential-theft primitive waiting
  #   for a reason. The scanner is the job that most obviously invites "let me
  #   just pull the base branch in so the scan sees the real history" — and that
  #   edit is how a secret scanner becomes the way secrets are taken. So the
  #   reusable workflow declares no dangerous trigger at all, and
  #   tests/validate.sh fails if the string ever appears.
  #
  # WHY fetch-depth: 0
  #   The default checkout is a shallow clone: one commit. A shallow scan cannot
  #   see a secret that was committed and deleted, which is the finding that
  #   matters most — it is on every fork, and it is in the packfile of anyone
  #   who cloned. Full history is the requirement; the default is not.
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history. See above: a shallow scan is a diff scan with extra
          # steps, and a diff scan cannot see a deleted secret.
          fetch-depth: 0
          persist-credentials: false
      # =========================================================================
      # `kit-gate-tree` — WHY THIS STEP, AND WHY IT IS A HAND-ROLLED `git` FETCH
      #
      # This job needs two files that live in kit's tree and in no other:
      # `tests/bootstrap.sh` and `tests/gitleaks_gate.sh`. Until 2026-10-05 it
      # reached for them with `${GITHUB_ACTION_PATH}`, and that is the variable
      # GitHub documents as **composite-action-only**. This file is a REUSABLE
      # WORKFLOW, so the variable is not set, and under `set -euo pipefail` an
      # unset one is not an empty path — it is a fatal:
      #
      #   …/_temp/9bf3851b-….sh: line 2: GITHUB_ACTION_PATH: unbound variable
      #   ##[error]Process completed with exit code 1.
      #
      # Measured in `cafaye/site` run 37236386666 and `cafaye/parlor` run
      # 37230458669, on the `secrets` job, on its second line.
      #
      # The reason this survived for four days across eleven repositories is the
      # reason half this file's history survived: every check in kit PARSES the
      # YAML, and a variable that expands to nothing parses. A reusable workflow
      # has no way to know its own location — `github.workflow_ref` is the
      # CALLER's workflow — so there was no path to check and nothing to assert.
      # The `kit-lint-ref` input is what makes one exist: the tree is FETCHED by
      # a name, so the fetch is the mechanism and the name is the pin.
      #
      # WHY NOT `uses: actions/checkout`, WHICH IS THE SECOND FATAL ON THIS LINE
      # AND THE REASON THIS JOB HAS STILL NEVER BEEN GREEN. The fix for the
      # variable replaced five reads of `$GITHUB_ACTION_PATH` with three explicit
      # `actions/checkout` steps, and the action REFUSES a `path:` outside the
      # workspace. From its own source, v7 `src/input-helper.ts`:
      #
      #   result.repositoryPath = core.getInput('path') || '.'
      #   result.repositoryPath = path.resolve(githubWorkspacePath, result.repositoryPath)
      #   if (!(result.repositoryPath + path.sep).startsWith(githubWorkspacePath + path.sep))
      #     throw new Error(`Repository path '…' is not under '…'`)
      #
      # That is a GUARD and not a quirk: the action cleans up after itself and
      # persists credentials relative to the workspace, so a path outside it is
      # one it will not write to, and there is NO input that relaxes it. Measured
      # in `cafaye/parlor` run 37249271580, on this job:
      #
      #   ##[error]Repository path '/home/runner/work/_temp/kit' is not under
      #             '/home/runner/work/parlor/parlor'
      #
      # So this job went from `GITHUB_ACTION_PATH: unbound variable` to
      # `Repository path … is not under …`, both fatal and both on its FIRST
      # checkout. A `git` clone is not subject to the guard, and it is the only
      # way to write to the one place this tree is allowed to go.
      #
      # `$RUNNER_TEMP` and NOT `<workspace>/.kit`, deliberately, and unchanged.
      # The scan below is rooted at `$GITHUB_WORKSPACE` and reads the
      # repository's full git history, so putting a second git repository inside
      # the tree it scans is a nested-repository question with no good answer.
      # `$RUNNER_TEMP` is per-job scratch space that is emptied at the end of the
      # job, which is exactly the lifetime this file needs and no more.
      #
      # MEASURED, because the paragraph above says the nested repository would
      # join the caller's scan and it is worth knowing whether that is true. A
      # clone at `<caller>/.kit`, a `ghp_…` planted in a commit of KIT's history,
      # nothing staged in the caller, scanned through `tests/gitleaks_gate.sh`
      # rooted at the caller: `1 commits scanned … no leaks found`. gitleaks
      # reads the OUTER repository's history, and an untracked directory carrying
      # its own `.git` is not in it. (Staging it makes it a gitlink — also not
      # scanned, but that is git complaining rather than a design.) So the hazard
      # is LATENT rather than immediate, which is an argument for `$RUNNER_TEMP`
      # and not against it: the whole difference between the two is that
      # `$RUNNER_TEMP` cannot become the caller's problem at all, and a reason
      # that is not currently firing is not a reason to move towards it.
      #
      # `KIT_SPARSE: tests` because the other half of this job's rationale — not
      # scanning a service's committed `.gitleaks.toml` twice, not shipping
      # kit's `templates/` into a caller's build — is already in the script. What
      # is read out of this clone is `tests/`, and a full clone of kit on every
      # push of every repository is a cost paid for files nobody opens.
      #
      # CREDENTIALS, DELIBERATELY. Hand-rolling the fetch gives up the action's
      # credential hygiene, and that cost is real — but it is only paid by a
      # repository that needs a token, and `cafaye/kit` is PUBLIC: measured
      # `HTTP 200` unauthenticated, and the clone writes nothing to
      # `.git/config`, so there is no credential to persist and none to clean up.
      # That is a STRONGER position than `persist-credentials: false`, which
      # suppresses the write and still depends on a post-step that removes it.
      # `GIT_TERMINAL_PROMPT=0` is set so that if kit is ever made private this
      # fails legibly instead of hanging on a prompt CI cannot answer.
      # `checkout_path_check` in tests/validate.sh fails on any
      # `actions/checkout` in this directory whose `path:` is not under the
      # workspace, so the shape that shipped here cannot come back by accident.
      # =========================================================================
      - name: kit (gate scripts)
        env:
          KIT_REF: ${{ inputs.kit-lint-ref }}
          KIT_SPARSE: tests
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          KIT_TREE_DIR="$RUNNER_TEMP/kit"
          git init --quiet "$KIT_TREE_DIR"
          git -C "$KIT_TREE_DIR" remote add origin https://github.com/cafaye/kit.git
          git -C "$KIT_TREE_DIR" sparse-checkout set --no-cone "$KIT_SPARSE"
          git -C "$KIT_TREE_DIR" fetch --depth 1 --filter=blob:none --quiet origin "$KIT_REF"
          git -C "$KIT_TREE_DIR" checkout --quiet FETCH_HEAD
          echo "KIT_TREE_DIR=$KIT_TREE_DIR" >> "$GITHUB_ENV"
      - name: install gitleaks (pinned release, sha256-verified)
        # kit's own bootstrap, not a third-party action. Two reasons, and both
        # of them are properties this repository already holds hadolint to: the
        # version and the hash are one edit in a file we ship, and the scan
        # cannot be quietly swapped for another scanner by a dependency bump.
        #
        # `KIT_TREE_DIR`, never `$GITHUB_ACTION_PATH`, and never a
        # literal path. See the step above, which is where the whole of that
        # argument is; this is the fourth place the same mistake was made and the
        # reason `kit_gate_tree_check` in tests/validate.sh asserts on the
        # ABSENCE of the variable and on the presence of the fetch above it,
        # rather than on this file happening to be correct today. Not re-declared
        # per step: the fetch exports it through `$GITHUB_ENV`, so the directory
        # is written once.
        run: |
          set -euo pipefail
          . "$KIT_TREE_DIR/tests/bootstrap.sh"
          kit_bootstrap_binary gitleaks \
            "https://github.com/gitleaks/gitleaks/releases/download/v${KIT_GITLEAKS_VERSION}" \
            "$KIT_GITLEAKS_SHA256S" "$KIT_TREE_DIR" \
            "gitleaks_${KIT_GITLEAKS_VERSION}_@ros@_@arch@.tar.gz" gitleaks
          echo "GITLEAKS=$BIN" >> "$GITHUB_ENV"
      - name: gitleaks (full history, redacted)
        # kit's own script, so this invocation and `bash tests/validate.sh` on a
        # laptop are the same scan. --redact is inside that script and cannot be
        # turned off from here: a CI log is a place secrets go to be read, and
        # the scanner finding a secret must never be why the secret is printed.
        #
        # The runner does have network access — GitHub-hosted runners always do
        # and there is no per-step way to remove it. What is offline is the
        # scan: gitleaks is a static binary that reads a repository and matches
        # regexes. That is the whole reason it is gitleaks and not trufflehog,
        # which would use this network access to verify a live credential
        # against its issuer — a scanner that can reach the internet is a
        # scanner that can be made to exfiltrate.
        #
        # `$KIT_TREE_DIR`, never `$GITHUB_ACTION_PATH`. See the `kit (gate
        # scripts)` step above this job's other two; the short version is that
        # the variable is composite-action-only and this is a reusable workflow.
        # It is not re-declared per step: the fetch step above exports it through
        # `$GITHUB_ENV`, so the directory is written once and every step that
        # reads it cannot disagree about where that is.
        run: bash "$KIT_TREE_DIR/tests/gitleaks_gate.sh" "$GITHUB_WORKSPACE" "$GITLEAKS"

  # ------------------------------------------------------------------ zizmor
  # GitHub Actions' own security audit, run on the adopting repository's own
  # workflows. It is a separate job rather than a step in `secrets` because they
  # answer different questions: gitleaks looks at content, zizmor looks at the
  # workflow's own shape — who can write, what is pinned, what persists a
  # credential.
  #
  # It ships with the same opt-out as `secrets` and for a different reason. The
  # audit's output depends entirely on the adopting repository's workflows,
  # which kit does not control and did not write, so making it fatal on day one
  # would mean a repo inherits a red build for a finding kit introduced. A repo
  # that wants it now asks for it; every repo gets it the moment this stops
  # being true, because the input is already here and the default only ever
  # moves down.
  #
  # `unpinned-uses` is reported and does not fail the job. That is not a
  # baseline: the finding is counted and printed on every run, and the decision
  # it is waiting on is written down in DECISIONS.md under MD10 with all three
  # options costed. Every other audit is fatal.
  zizmor:
    name: zizmor
    if: ${{ inputs.zizmor == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: install zizmor (pinned)
        # From PyPI, not a release archive: zizmor publishes no checksums file,
        # so pinning its archives would mean pinning hashes we computed
        # ourselves, which is a weaker claim than hadolint's and gitleaks'.
        # The version is exact because an audit whose findings change when the
        # tool is upgraded is an audit nobody can reason about.
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check 'zizmor==1.30.1'
      # Kit's own tree, for `tests/zizmor_gate.sh`. Fetched by a NAME, never
      # `$GITHUB_ACTION_PATH` — the variable is documented as composite-action-only
      # and this is a reusable workflow, so it is not set here and reading it
      # under `set -euo pipefail` is a fatal on the step's first line. The full
      # argument, with the two runs that show it, is on the `secrets` job's
      # `kit (gate scripts)` step; this job is the SECOND one that had the defect
      # and the reason `kit_gate_tree_check` asserts on the variable's absence
      # rather than on either file happening to be correct today.
      #
      # Hand-rolled `git` rather than `uses: actions/checkout`, and this is the
      # THIRD job that carried the same latent fatal: the action refuses a `path:`
      # outside the workspace, and this step pointed one at the runner's scratch
      # directory. It had simply never fired, because this job is opt-in and
      # `secrets` — the job with no opt-in — failed first. All three copies are
      # fixed together for the reason AGENTS.md records about the
      # `REUSABLE_WORKFLOWS` list: a fix that leaves two armed is a fix that has
      # not landed, and "nobody has seen it fail" is a fact about which job runs
      # first, not about whether it fails.
      - name: kit (gate scripts)
        env:
          KIT_REF: ${{ inputs.kit-lint-ref }}
          KIT_SPARSE: tests
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          KIT_TREE_DIR="$RUNNER_TEMP/kit"
          git init --quiet "$KIT_TREE_DIR"
          git -C "$KIT_TREE_DIR" remote add origin https://github.com/cafaye/kit.git
          git -C "$KIT_TREE_DIR" sparse-checkout set --no-cone "$KIT_SPARSE"
          git -C "$KIT_TREE_DIR" fetch --depth 1 --filter=blob:none --quiet origin "$KIT_REF"
          git -C "$KIT_TREE_DIR" checkout --quiet FETCH_HEAD
          echo "KIT_TREE_DIR=$KIT_TREE_DIR" >> "$GITHUB_ENV"
      - name: zizmor (unpinned-uses recorded, everything else fatal)
        # `PY` is exported as well as `KIT_TREE_DIR`, and that is a SECOND defect
        # in this job rather than a detail of the first: `tests/zizmor_gate.sh`
        # ends by piping zizmor's JSON report through `"$PY" - …`, and nothing
        # here ever set it. In kit's own gate `PY` comes from
        # `kit_bootstrap_python`, which `validate.sh` calls; a reusable workflow
        # has no such call, so the script reached its own last line and died on
        # `PY: unbound variable`. Both are the same shape — a script written to
        # be called by one caller, run by another that had not been read.
        #
        # `KIT_TREE_DIR` is not re-declared here: the fetch step above exports it
        # through `$GITHUB_ENV`. `PY` still has to be, because no step exports it.
        env:
          PY: python3
        run: bash "$KIT_TREE_DIR/tests/zizmor_gate.sh" "$GITHUB_WORKSPACE" "$(command -v zizmor)"
