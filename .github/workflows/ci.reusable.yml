          # The one place the normalised format is read, and it reads only the
          # format kit owns — never a per-language report. A `ran` line is the
          # evidence that something executed; no `ran` line is a tier that ran
          # zero tests, and the failure NAMES THE VARIABLE so the fix is obvious
          # from the log alone.
          if ! grep -qE '^ran[[:space:]]' "$log"; then
            echo "::error::$REQUIRED_TIER was set and no 'ran <tier> <suite> <test>'" >&2
            echo "::error::line reached this log. A gate variable that is set and a" >&2
            echo "::error::tier that ran zero tests is a green build that verified" >&2
            echo "::error::nothing. See templates/tier/README.md." >&2
            exit 1
          fi
      # The repo's own `rake coverage` task reads COVERAGE_FAIL_UNDER and exits
      # nonzero below it (see README: a coverage rake task is part of adoption).
      - name: coverage
        working-directory: ${{ inputs.working-dir }}
        run: bundle exec rake coverage
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: coverage-ruby
          path: ${{ inputs.working-dir }}/coverage
          if-no-files-found: ignore

