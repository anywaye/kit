          # lints with kit's policy and nothing else.
          [ -n "${KIT_LINT_ARGS:-}" ] || exit 0
          # Deliberate word splitting — the seam is a command line, and this is
          # the list the shell will hand the linter. shellcheck disable=SC2086
          # for exactly that one line.
          # shellcheck disable=SC2086
          for tok in $KIT_LINT_ARGS; do
            # `--config=path` and `--config path` are the same request, so the
            # value is stripped before the name is matched.
            name="${tok%%=*}"
            case "$name" in
              --config|-c|--no-config|--no-config-lookup|--force-default-config|\
              --issues-exit-code|--fail-level|--quiet|\
              --no-error-on-unmatched-pattern|--auto-gen-config|--regenerate-todo|\
              --new|--new-from-rev|--new-from-patch|--new-from-merge-base)
                echo "::error::lint-args may not contain '$name'." >&2
                echo "::error::The seam is for a STRICTER setting. '$name' changes" >&2
                echo "::error::which config is read, what is linted, or whether a" >&2
                echo "::error::finding fails the build — so a green build would stop" >&2
