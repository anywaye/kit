      #                  / --no-config-lookup (eslint) / --force-default-config
      #   what is linted --new, --new-from-rev, --new-from-patch,
      #                  --new-from-merge-base (a diff, not the tree)
      #   does it fail   --issues-exit-code (golangci-lint; `=0` is a linter that
      #                  cannot fail), --fail-level (rubocop), --quiet (eslint:
      #                  "report errors only", which is looser, not stricter),
      #                  --no-error-on-unmatched-pattern (an unmatched path is
      #                  green, so a renamed file is silently unlinted)
      #
      # `--auto-gen-config` and `--regenerate-todo` are here for a different
      # reason and it is the packet's own reason: both WRITE a config file into
      # the tree. A linter that generates its own config is the copy mechanism
      # arriving through the back door, and it would be a copy nobody reviews.
      #
