---
name: release
on:
  push:
    branches: [master]
    paths:
      - 'schemas/**'
      - 'fleet.yml'

permissions:
  contents: write

jobs:
  classify:
    name: classify the spec change
    runs-on: ubuntu-latest
    outputs:
      level: ${{ steps.classify.outputs.level }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: classify schemas/ against the previous tag
        id: classify
        run: |
          set -euo pipefail
          previous="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -z "$previous" ]; then
            echo "level=minor" >>"$GITHUB_OUTPUT"
            echo "no previous tag; first release is 0.1.0" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git worktree add -q "$RUNNER_TEMP/previous" "$previous"
          mkdir -p "$RUNNER_TEMP/old" "$RUNNER_TEMP/new"
          cp -R "$previous/schemas/." "$RUNNER_TEMP/old/"
          cp -R schemas/. "$RUNNER_TEMP/new/"

          curl -fsSL -o /tmp/classify \
            "https://raw.githubusercontent.com/anywaye/kit/master/tests/classify.py"
          curl -fsSL -o /tmp/rules.json \
            "https://raw.githubusercontent.com/anywaye/kit/master/tests/rules.json"

          if python3 /tmp/classify "$RUNNER_TEMP/old" "$RUNNER_TEMP/new" \
               --tier FILE --rules /tmp/rules.json --json >"$RUNNER_TEMP/report.json"; then
            level=patch
          else
            level=minor
          fi
          echo "level=$level" >>"$GITHUB_OUTPUT"
          cp "$RUNNER_TEMP/report.json" "$RUNNER_STEP_SUMMARY" || true

  tag:
    name: publish the tag
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: compute the next version
        id: version
        run: |
          set -euo pipefail
          previous="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -z "$previous" ]; then
            echo "next=0.1.0" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          base="${previous#v}"
          major="${base%%.*}"
          rest="${base#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"

          case "${{ needs.classify.outputs.level }}" in
            minor)
              minor=$((minor + 1)); patch=0 ;;
            patch)
              patch=$((patch + 1)) ;;
            *)
              echo "unknown classification level" >&2; exit 1 ;;
          esac
          echo "next=v${major}.${minor}.${patch}" >>"$GITHUB_OUTPUT"

      - name: publish
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          if git rev-parse "$NEXT" >/dev/null 2>&1; then
            echo "refusing to move an existing tag: $NEXT" >&2
            exit 1
          fi
          git tag -a "$NEXT" -m "core $NEXT

          schemas/ changed. Classified ${{ needs.classify.outputs.level }} by
          tests/classify.py, which fails closed on an unrecognised change."
          git push origin "$NEXT"
          echo "published $NEXT" >>"$GITHUB_STEP_SUMMARY"
