---
# golangci-lint v2 config — kit's own, used FROM kit at run time. Not copied
# into a service repo:
#   golangci-lint run --config=<repo>/.kit/lint/golangci.yml ./...
# See README.md, "Where the lint configs run".
#
# WHY THE FLAG IS NOT OPTIONAL — measured, and this is the load-bearing line in
# the file:
#   With no config present anywhere, golangci-lint v2 does not fail and does
#   not run nothing. It falls back to its own five-linter default set
#   (errcheck govet ineffassign staticcheck unused) and exits 0 on a file this
#   config rejects — a misspelling in a comment is green without `--config` and
#   red with it. So a Go service whose lint step lost its `--config` still runs,
#   still passes, and is now on a policy nobody chose and nobody can see.
#   `GOLANGCI_LINT_CONFIG` is NOT an alternative: measured on v2.6.2, setting it
#   changes nothing and the run proceeds on that same default set.
#
# STRICTNESS NOTES
#   - version: "2" is the config schema version, not the tool version; CI runs
#     whatever golangci-lint-action installs.
#   - errcheck, govet, ineffassign, staticcheck, unused are the default set and
#     stay on. We add the correctness linters that have actually caught cafaye
#     bugs: bodyclose (leaked HTTP bodies), noctx (requests without context),
#     errorlint (mis-wrapped errors), exhaustive (missed switch cases).
#   - go: "1.24" is a FLOOR, not a pin: it must match the lowest go directive in
#     the service's go.mod, and it is the one line CI can silently disagree
#     with. A service that raises its go directive must raise this.
#   - We disable errcheck on Close/Flush only: those return errors nobody can
#     act on, and forcing a `//nolint` per call site is how people learn to
#     ignore errcheck. No other exclusion is pre-approved.
#   - There is no `extends`. Measured: the v2 JSON Schema sets
#     `additionalProperties: false` and `extends` is not a key, so a config that
#     tries to inherit one is rejected or ignored. Deviation is therefore a
#     documented workflow input, not a file — see the `lint-args` input.
version: '2'
run:
  go: '1.24'
  timeout: 5m
linters:
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - exhaustive
    - misspell
    - noctx
    - revive
    - unconvert
    - wastedassign
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    misspell:
      locale: US
    revive:
      enable-all-rules: false
      rules:
        - name: context-as-argument
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: indent-error-flow
        - name: unreachable-code
  exclusions:
    # GENERATED FILES ARE NOT LINTED, and the rule is here because the lint
    # already broke one. `cafaye/pantry`'s `internal/telemetry/telemetry.go`
    # carries the canonical marker — `// Code generated by `cafe gen telemetry`.
    # DO NOT EDIT.` — and a `misspell` pass rewrote UK spellings in it
    # (`behaviour` → `behavior`, `honoured` → `honored`). The file's own drift
    # test caught it (`TestTheGeneratedTelemetryPackageIsStillGenerated`:
    # "differs from what `cafe gen telemetry` writes today"), which is the check
    # that guards generated output — and it is the RIGHT guard. A linter editing
    # a file that says DO NOT EDIT produces exactly the failure the marker exists
    # to prevent, and the fix belongs at the lint, not at every generator.
    #
    # `generated: lax` is golangci-lint v2's documented value: it honours the
    # conventional markers (`Code generated … DO NOT EDIT.`, and the tool-specific
    # ones). A generated file that a human needs to edit is a generator bug, not a
    # lint exemption.
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - errcheck
formatters:
  enable:
    - gofmt
    - goimports
