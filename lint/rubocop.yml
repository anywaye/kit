---
AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  SuggestExtensions: true
  Exclude:
    - 'bin/**/*'
    - 'db/schema.rb'
    - 'node_modules/**/*'
    - 'tmp/**/*'
    - 'vendor/**/*'
Layout/LineLength:
  Max: 120
Metrics/AbcSize:
  Exclude: &test_files
    - 'test/**/*'
    - 'spec/**/*'
    - '**/test_*.rb'
    - '**/*_test.rb'
Metrics/CyclomaticComplexity:
  Exclude: *test_files
Metrics/PerceivedComplexity:
  Exclude: *test_files
Metrics/MethodLength:
  Max: 15
  Exclude: *test_files
Metrics/ClassLength:
  Max: 150
  Exclude: *test_files
Metrics/ModuleLength:
  Max: 150
Style/Documentation:
  Enabled: true
Naming/PredicatePrefix:
  Enabled: true
Naming/MethodParameterName:
  MinNameLength: 3
